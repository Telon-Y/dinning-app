<script>
  // 尽早登记历史记录（早于所有外部脚本加载）：
  // 否则页面刚打开、脚本还没跑起来时按返回键，会直接退出应用。
  try {
    // 带上 # 标记：同 URL 的 pushState 有些浏览器（尤其是快捷方式打开的自定义标签）会忽略
    history.replaceState({ app: true, tab: "week", kind: "home" }, "", "#home");
    history.pushState({ app: true, tab: "week", kind: "tab" }, "", "#tab");
  } catch (e) {
    /* 忽略 */
  }
</script>
