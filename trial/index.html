<script type="module">
// ===== app\github.js =====
// GitHub Contents API 的最小封装：读取、写入、SHA 检查、409 冲突。
// 只做「发现变化」，不做业务合并（合并交给 src/rules/merge.js）。

const API = "https://api.github.com";

class GitHubError extends Error {
  constructor(status, body) {
    super(`GitHub ${status}`);
    this.name = "GitHubError";
    this.status = status;
    this.body = body;
  }
}

function headers(token) {
  return {
    Authorization: `token ${token}`,
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
}

function contentsUrl({ owner, repo, path, branch, ref }) {
  const encodedPath = String(path).split("/").map(encodeURIComponent).join("/");
  const base = `${API}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodedPath}`;
  const useRef = ref || branch;
  return useRef ? `${base}?ref=${encodeURIComponent(useRef)}` : base;
}

async function readBody(res) {
  try {
    return await res.text();
  } catch {
    return "";
  }
}

async function getFile(cfg, ref) {
  // cache: "no-store" 必须带：GitHub API 允许私有缓存（max-age=60），
  // 否则刚推送完再读，浏览器可能直接返回上一次的缓存内容，看着"已同步"其实是旧数据。
  const res = await fetch(contentsUrl({ ...cfg, ref }), { headers: headers(cfg.token), cache: "no-store" });
  if (res.status === 404) return { exists: false };
  if (!res.ok) throw new GitHubError(res.status, await readBody(res));
  const data = await res.json();
  return { exists: true, sha: data.sha, content: decodeBase64Utf8(data.content || "") };
}

async function putFile(cfg, content, sha, message) {
  const res = await fetch(contentsUrl(cfg), {
    method: "PUT",
    cache: "no-store",
    headers: { ...headers(cfg.token), "Content-Type": "application/json" },
    body: JSON.stringify({
      message: message || "update data.json",
      content: encodeBase64Utf8(content),
      branch: cfg.branch,
      ...(sha ? { sha } : {})
    })
  });
  if (res.status === 409) return { conflict: true };
  if (!res.ok) throw new GitHubError(res.status, await readBody(res));
  const data = await res.json();
  return { conflict: false, sha: data.content ? data.content.sha : undefined };
}

function encodeBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

function decodeBase64Utf8(b64) {
  const bin = atob(b64.replace(/\s+/g, ""));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// 数据文件的提交历史，用来做「操作日志」和回退到某一版。
async function listCommits(cfg, { path, perPage = 20 } = {}) {
  const params = new URLSearchParams({ sha: cfg.branch || "main", per_page: String(perPage) });
  if (path) params.set("path", path);
  const url = `${API}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/commits?${params.toString()}`;
  const res = await fetch(url, { headers: headers(cfg.token), cache: "no-store" });
  if (!res.ok) throw new GitHubError(res.status, await readBody(res));
  const list = await res.json();
  return list.map((c) => ({
    sha: c.sha,
    short: String(c.sha).slice(0, 7),
    date: (c.commit && c.commit.author && c.commit.author.date) || "",
    message: (c.commit && c.commit.message) || ""
  }));
}

// ===== src\rules\merge.js =====
// 三方合并：base 为最后同步成功的基线，local / remote 为两端各自的最新版。
// 规则：能自动合的自动合；同字段双方都改且不同 → 记为冲突、保留双方，等待用户选择。
// 不做「最后写入者获胜」，不静默覆盖。

function isPlainObject(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function stableStringify(v) {
  if (v === undefined) return "undefined";
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(stableStringify).join(",") + "]";
  return (
    "{" +
    Object.keys(v)
      .sort()
      .map((k) => JSON.stringify(k) + ":" + stableStringify(v[k]))
      .join(",") +
    "}"
  );
}

function deepEqual(a, b) {
  return stableStringify(a) === stableStringify(b);
}

function isIdArray(arr) {
  return arr.every((x) => isPlainObject(x) && typeof x.id === "string");
}

function threeWayMerge(base, local, remote) {
  const conflicts = [];
  const merged = mergeValue(base, local, remote, "", conflicts);
  return { merged, conflicts };
}

function mergeValue(base, local, remote, path, conflicts) {
  if (deepEqual(local, remote)) return local;
  if (deepEqual(base, local)) return remote;
  if (deepEqual(base, remote)) return local;

    const out = {};

    }

    if (rv === undefined) {
      if (bv === undefined) {
        // 远端没有、基线也没有 → 本地新加的，留着，不算冲突
        out.push(lv);
        continue;
      }
      if (deepEqual(bv, lv)) continue; // 只有远端删，本地没动 → 采纳删除
      conflicts.push({ path: `${path}/${id}`, kind: "delete-vs-modify", base: bv, local: lv, remote: null });
      out.push(lv);
      continue;
    }

    out.push(mergeValue(bv, lv, rv, `${path}/${id}`, conflicts));
  }
  return out;
}

// ===== src\rules\week.js =====
// 周界线：默认周六起（settings.budget.weekStartsOn），时区用 settings.budget.timezone。
// 内部统一用「UTC 正午」做日期加减，避免夏令时把日期算偏。

const DOW = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];

// 把某个时刻按指定时区落成日期（YYYY-MM-DD）。
// cookedAt 之类的时间戳是 UTC 的，直接切前 10 位会把「晚上做的饭」算到前一天，
// 所以「哪天吃的」必须按时区算。
function dateInTZ(date, timeZone = "UTC") {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date instanceof Date ? date : new Date(date));
  const get = (t) => parts.find((p) => p.type === t).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function todayISO(timeZone = "UTC") {
  return dateInTZ(new Date(), timeZone);
}

function toUTCNoon(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Date.UTC(y, m - 1, d, 12);
}

function addDays(iso, n) {
  return new Date(toUTCNoon(iso) + n * 86400000).toISOString().slice(0, 10);
}

function weekdayIndex(iso) {
  return new Date(toUTCNoon(iso)).getUTCDay(); // 0 = 周日
}

function weekStartISO(iso, weekStartsOn = "saturday") {
  const target = DOW.indexOf(weekStartsOn);
  const diff = (weekdayIndex(iso) - target + 7) % 7;
  return addDays(iso, -diff);
}

function weekRange(iso, weekStartsOn = "saturday") {
  const start = weekStartISO(iso, weekStartsOn);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  return { start, end: days[6], days };
}

function inRange(iso, range) {
  return !range || (iso >= range.start && iso <= range.end);
}

// 往前/往后挪几周（weekStart 得是某周的起点，也就是 weekRange().start）
function shiftWeek(weekStart, delta) {
  return addDays(weekStart, delta * 7);
}

const WEEKDAY_LABEL = { 0: "周日", 1: "周一", 2: "周二", 3: "周三", 4: "周四", 5: "周五", 6: "周六" };

// ===== src\rules\validate.js =====
// 与具体 Ajv 实例解耦：浏览器传 window.Ajv，Node 测试传加载好的 Ajv。
// 手机与电脑复用同一份 schema 和同一个入口。

function buildValidator(Ajv, schema) {
  const ajv = new Ajv({ allErrors: true, strict: false, jsonPointers: true });
  return ajv.compile(schema);
}

function formatErrors(validateFn) {
  if (!validateFn.errors) return [];
  return validateFn.errors.map((e) => {
    const where = e.dataPath || e.instancePath || "";
    const extra = e.params && e.params.additionalProperty ? ` (${e.params.additionalProperty})` : "";
    return `${where} ${e.message}${extra}`.trim();
  });
}

// ===== src\rules\resolve.js =====
// 冲突解决：把某个冲突路径上的值换成用户选定的一方。
// 路径来自三方合并，形如 /settings/budget/weeklyPence 或 /meals/meal_x/actualServings；
// 数组那一段用的是记录 id，不是下标。

function child(container, key) {
  if (Array.isArray(container)) return container.find((x) => x && x.id === key) || null;
  return container && typeof container === "object" ? container[key] : null;
}

function setAtPath(data, path, value, { deleteIfNull = false } = {}) {
  const parts = String(path || "").split("/").filter(Boolean);
  if (!parts.length) return data;
  const clone = structuredClone(data);
  let cur = clone;
  for (let i = 0; i < parts.length - 1; i++) {
    cur = child(cur, parts[i]);
    if (cur == null) return clone;
  }
  const last = parts[parts.length - 1];

  if (deleteIfNull && value === null) {
    if (Array.isArray(cur)) {
      const idx = cur.findIndex((x) => x && x.id === last);
      if (idx >= 0) cur.splice(idx, 1);
    } else if (cur && typeof cur === "object") {
      delete cur[last];
    }
    return clone;
  }

  if (Array.isArray(cur)) {
    const idx = cur.findIndex((x) => x && x.id === last);
    if (idx >= 0) cur[idx] = value;
    else cur.push(value);
  } else if (cur && typeof cur === "object") {
    cur[last] = value;
  }
  return clone;
}

// 按选择表把一串冲突一次应用完。choices: { [path]: "local" | "remote" }
function applyResolutions(data, conflicts, choices) {
  let next = data;
  for (const c of conflicts) {
    const choice = choices[c.path];
    if (!choice) continue;
    const value = choice === "remote" ? c.remote : c.local;
    next = setAtPath(next, c.path, value === undefined ? null : value, {
      deleteIfNull: c.kind === "delete-vs-modify"
    });
  }
  return next;
}

// ===== src\rules\savecode.js =====
// 存档编码：JSON → LZString 压缩 → 固定密钥流混淆 → base64，最后带一段校验和。
// 风格参考增量游戏的存档串：短、不可读、防手改。
// 说明：密钥写在代码里，所以这是「混淆 + 完整性校验」，不是密码级加密。

const MAGIC = "DIN1";
const KEY = "dinning-save-v1-2026";

function keystreamByte(i) {
  return (KEY.charCodeAt(i % KEY.length) + i * 31) & 0xff;
}

function xorBytes(bytes) {
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ keystreamByte(i);
  return out;
}

function bytesToBase64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// FNV-1a 32 位：用来发现抄漏、抄错、截断
function checksum(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36);
}

function encodeSave(data, LZ) {
  const json = JSON.stringify(data);
  const packed = xorBytes(LZ.compressToUint8Array(json));
  const body = bytesToBase64(packed);
  return `${MAGIC}:${checksum(body)}:${body}`;
}

function decodeSave(text, LZ) {
  const raw = String(text == null ? "" : text).trim().replace(/\s+/g, "");
  const parts = raw.split(":");
  if (parts.length !== 3 || parts[0] !== MAGIC) {
    return { ok: false, reason: `这不像本应用的存档文本（开头应该是 ${MAGIC}:）` };
  }
  const sum = parts[1];
  const body = parts[2];
  if (checksum(body) !== sum) {
    return { ok: false, reason: "存档文本不完整或抄错了（校验和不匹配）" };
  }
  try {
    const bytes = xorBytes(base64ToBytes(body));
    const json = LZ.decompressFromUint8Array(bytes);
    if (!json) throw new Error("解压结果为空");
    return { ok: true, data: JSON.parse(json) };
  } catch (e) {
    return { ok: false, reason: "解压失败：" + (e && e.message ? e.message : e) };
  }
}

// ===== src\rules\expiry.js =====
// 保质期提醒：把库存批次按到期日排出「已过期 / 临期 / 正常 / 日期未确认」。
// 只认明确写过的日期；没填日期的不猜，标成未确认。

const WARN_DAYS = 3;

function addDaysISO(iso, days) {
  const d = new Date(`${iso}T00:00:00Z`);
  if (Number.isNaN(d.getTime())) return null;
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

// 换了「放入日期」之后，到期日该挪到哪天：保持保质天数不变。
// 例：10-12 放入、10-15 到期；把放入日期改成 10-14 → 到期 10-17。
function shiftExpiryDate(date, prevAdded, added) {
  if (!date || !prevAdded || !added) return null;
  const delta = daysUntil(added, prevAdded); // (added - prevAdded) 天
  if (delta == null || delta === 0) return null;
  return addDaysISO(date, delta);
}

// 按食材的保鲜期估算到期日，入库时自动带上，你只在包装上写了别的日期时才改。
// 肉、水产、乳制品按食品安全算（use-by），其余按品质（best-before）。
function estimateBatchDates(food, { addedAt, location } = {}) {
  const life = (food && food.shelfLifeDays) || {};
  const place = location && life[location] != null
    ? location
    : ["fridge", "freezer", "pantry", "counter"].find((k) => life[k] != null);
  if (!place || !addedAt || !(life[place] > 0)) return null;
  const date = addDaysISO(addedAt, life[place]);
  if (!date) return null;
  return {
    dateType: ["meat", "fish", "dairy"].includes(food.area) ? "use_by" : "best_before",
    date,
    dateSource: "estimate"
  };
}

// 给所有还没填日期的库存自动补上估算到期日（不需要你手动保存一遍）。
// 用得着你动手的只有「包装上写了别的日期」这一种情况。
function backfillBatchDates(data, todayISODate) {
  const foodsById = new Map(((data && data.foods) || []).map((f) => [f.id, f]));
  let filled = 0;
  const batches = ((data && data.inventoryBatches) || []).map((b) => {
    // 估算来的日期要一直跟「放入日期 + 保鲜期」保持一致，漂了就纠回来
    if (b.dateSource === "estimate") {
      const est = estimateBatchDates(foodsById.get(b.foodId), {
        addedAt: b.addedAt || todayISODate,
        location: b.location
      });
      if (!est || est.date === b.date) return b;
      filled += 1;
      return { ...b, ...est };
    }
    if (b.date && b.dateType !== "unknown") return b; // 包装上的日期：不动
    if (b.dateSource === "none") return b; // 你明确说过「日期未确认」，就别再猜
    const est = estimateBatchDates(foodsById.get(b.foodId), {
      addedAt: b.addedAt || todayISODate,
      location: b.location
    });
    if (!est) return b;
    filled += 1;
    return { ...b, ...est };
  });
  if (!filled) return { data, filled: 0 };
  return { data: { ...data, inventoryBatches: batches }, filled };
}

function daysUntil(dateISO, todayISODate) {
  if (!dateISO) return null;
  const a = Date.parse(String(dateISO) + "T00:00:00Z");
  const b = Date.parse(String(todayISODate) + "T00:00:00Z");
  if (Number.isNaN(a) || Number.isNaN(b)) return null;
  return Math.round((a - b) / 86400000);
}

function expiryInfo(batch, todayISODate, warnDays = WARN_DAYS) {
  const estimated = !!(batch && batch.dateSource === "estimate");
  if (!batch || batch.dateType === "unknown" || !batch.date) return { level: "unknown", days: null, estimated };
  const days = daysUntil(batch.date, todayISODate);
  if (days == null) return { level: "unknown", days: null, estimated };
  if (days < 0) return { level: "expired", days, estimated };
  if (days <= warnDays) return { level: "soon", days, estimated };
  return { level: "ok", days, estimated };
}

function expiryLabel(info) {
  if (!info || info.level === "unknown") return "日期未确认";
  if (info.level === "expired") return `已过期 ${Math.abs(info.days)} 天`;
  if (info.days === 0) return "今天到期";
  return `还剩 ${info.days} 天`;
}

function rank(info) {
  if (info.level === "expired") return 0;
  if (info.level === "soon") return 1;
  if (info.level === "ok") return 2;
  return 3;
}

// 过期的排最前，然后按到期日从近到远，没填日期的垫底。
function sortByExpiry(batches, todayISODate) {
  return batches
    .map((b) => ({ b, info: expiryInfo(b, todayISODate) }))
    .sort((x, y) => {
      const rx = rank(x.info);
      const ry = rank(y.info);
      if (rx !== ry) return rx - ry;
      if (x.info.days == null && y.info.days == null) return 0;
      if (x.info.days == null) return 1;
      if (y.info.days == null) return -1;
      return x.info.days - y.info.days;
    })
    .map((x) => x.b);
}

// 这批库存还算不算「有货」。做饭扣减只把数量扣到 0、不删批次（批次是记账单位），
// 所以光看到期日会把吃完的东西也排进提醒里。「冰箱」页也按同一条规则过滤，两边必须一致。
// 档位库存（quantityState !== "exact"）没有精确数字，不能当成 0，照旧提醒。
function hasStock(batch) {
  if (!batch) return false;
  if (batch.quantityState !== "exact") return true;
  return (Number(batch.quantity) || 0) > 0;
}

// 需要提醒的：还有货 + 已经过期 / 快到期的。已经吃完的（0 存量）不提醒。
function expiringBatches(batches, todayISODate, warnDays = WARN_DAYS) {
  return sortByExpiry(batches.filter(hasStock), todayISODate).filter((b) => {
    const info = expiryInfo(b, todayISODate, warnDays);
    return info.level === "expired" || info.level === "soon";
  });
}

// ===== src\rules\sync.js =====
// 同步的判定逻辑（纯函数，方便测）：
// 写入用的是「请求开始那一刻」的数据快照。如果请求期间本地又改过，
// 就不能把状态标成「已同步」，也不能用远端返回的内容覆盖当前数据 ——
// 否则用户在这几秒里的修改会被悄悄吞掉。

function writeOutcome({ snapshotRev, currentRev } = {}) {
  const changedDuringWrite = (snapshotRev || 0) !== (currentRev || 0);
  return {
    changedDuringWrite,
    clearPending: !changedDuringWrite,
    pushAgain: changedDuringWrite
  };
}

// ===== app\store.js =====

const KEYS = { config: "dinning.config", data: "dinning.data", meta: "dinning.meta" };
const BACKUP_KEY = "dinning.backup";

// 空档：第一次打开（本机和远端都还没有数据）时用，保证界面能正常渲染
function emptyDocument() {
  return {
    schemaVersion: 1,
    updatedAt: new Date().toISOString(),
    settings: {
      household: { defaultServings: 2 },
      budget: { weeklyPence: 5000, weekStartsOn: "saturday", timezone: "Europe/London" },
      stores: [
        { id: "aldi", name: "Aldi", role: "main" },
        { id: "lanjing", name: "蓝鲸（中超）", role: "main" },
        { id: "sainsburys", name: "Sainsbury's", role: "topup" }
      ]
    },
    foods: [],
    recipes: [],
    meals: [],
    inventoryBatches: [],
    purchases: [],
    cookLogs: [],
    stockLedger: [],
    deletions: []
  };
}

// 本机存储：优先 IndexedDB；用不了（file:// 打开的单文件版、隐私模式）就退回 localStorage。
// 试用的朋友常常是「微信里收到一个 html 直接打开」，那条路上 IndexedDB 可能不可用。
let idbPromise = null;
let idbBroken = false;
function db() {
  if (idbBroken) return Promise.reject(new Error("IndexedDB 不可用"));
  if (!idbPromise) {
    idbPromise = window.idb.openDB("dinning", 1, {
      upgrade(d) {
        if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      }
    });
  }
  return idbPromise;
}

function localRead(k) {
  try {
    const raw = window.localStorage.getItem(k);
    return raw == null ? undefined : JSON.parse(raw);
  } catch {
    return undefined;
  }
}

function localWrite(k, v) {
  try {
    window.localStorage.setItem(k, JSON.stringify(v));
  } catch {
    /* 存不下就算了，至少别让界面崩 */
  }
}

async function kvGet(k) {
  try {
    return await (await db()).get("kv", k);
  } catch {
    idbBroken = true;
    return localRead(k);
  }
}

async function kvSet(k, v) {
  try {
    return await (await db()).put("kv", v, k);
  } catch {
    idbBroken = true;
    localWrite(k, v);
  }
}

let validatorPromise = null;
function getValidator() {
  if (!validatorPromise) {
    validatorPromise = (async () => {
      let schema = null;
      try {
        // no-store：schema 也必须每次拿最新版，否则新加的字段会被旧 schema 判成非法
        const res = await fetch("../schema/data.schema.json", { cache: "no-store" });
        schema = await res.json();
      } catch {
        // 单文件试用版（file:// 打开）取不到外链 schema：用内联的那份
        schema = window.__DINNING_SCHEMA__ || null;
      }
      if (!schema) throw new Error("拿不到 schema");
      return buildValidator(window.Ajv, schema);
    })();
  }
  return validatorPromise;
}

const state = {
  data: null,
  config: { owner: "Telon-Y", repo: "Dinning", branch: "main", path: "data.json", token: "" },
  sha: null,
  base: null,
  rev: 0, // 本地数据版本号：每次 mutate +1，用来发现「同步期间又改了」
  conflictBase: null, // 这轮冲突是跟哪个远端版本比出来的
  conflictSha: null,
  status: "加载中",
  statusKind: "",
  message: "",
  conflicts: [],
  pending: false,
  labels: [],
  log: null,
  backup: null,
  recipeQuery: "",
  recipeCategory: "",
  recipeLimit: 30,
  suggestLimit: 8,
  swapFrom: null, // 「点选对调」模式下要从哪天开始换
  weekStart: null, // 「本周」在看哪一周：null = 本周本身，否则是那一周的起点（可以往未来排）
  tab: "week"
};

const listeners = new Set();
const subscribe = (fn) => {
  listeners.add(fn);
  return () => listeners.delete(fn);
};
function emit() {
  for (const fn of listeners) fn();
}

function setStatus(status, message = "", kind = "") {
  state.status = status;
  state.message = message;
  state.statusKind = kind;
  emit();
}

function currentRange(data) {
  const tz = data.settings.budget.timezone;
  return weekRange(todayISO(tz), data.settings.budget.weekStartsOn);
}

function summarize(data) {
  return `食谱 ${data.recipes.length} · 菜单 ${data.meals.length} · 库存 ${data.inventoryBatches.length} · 购买 ${data.purchases.length}`;
}

async function persist() {
  if (state.data) await kvSet(KEYS.data, state.data);
  await kvSet(KEYS.meta, { sha: state.sha, base: state.base, pending: state.pending, labels: state.labels });
}

// 旧版（M0 同步验证页）把配置存在 dinning-m0 / github。这里读一次迁移过来，省得重新输 Token。
async function legacyConfig() {
  try {
    if (!indexedDB.databases) return null;
    const dbs = await indexedDB.databases();
    if (!dbs.some((d) => d.name === "dinning-m0")) return null;
    const old = await new Promise((resolve, reject) => {
      const req = indexedDB.open("dinning-m0");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    let cfg = null;
    if (old.objectStoreNames.contains("kv")) {
      cfg = await new Promise((resolve, reject) => {
        const tx = old.transaction("kv", "readonly");
        const r = tx.objectStore("kv").get("github");
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => reject(r.error);
      });
    }
    old.close();
    return cfg;
  } catch {
    return null;
  }
}

async function init() {
  const [config, data, meta] = await Promise.all([kvGet(KEYS.config), kvGet(KEYS.data), kvGet(KEYS.meta)]);
  if (config) {
    state.config = { ...state.config, ...config };
  } else {
    const legacy = await legacyConfig();
    if (legacy && legacy.token) {
      state.config = { ...state.config, ...legacy };
      await kvSet(KEYS.config, state.config);
    }
  }
  if (data) state.data = data;
  // 本机完全没数据过（第一次打开、又拉不到远端）：
  // 单文件试用版会带一份初始食谱库，其它情况给一份空档，
  // 免得界面去读 state.data.settings 直接抛异常，整个初始化中断。
  if (!state.data) {
    const seed = window.__DINNING_SEED__;
    state.data = seed ? structuredClone(seed) : emptyDocument();
    if (seed) state.seeded = true;
  }
  if (meta) {
    state.sha = meta.sha || null;
    state.base = meta.base || null;
    state.pending = !!meta.pending;
    state.labels = Array.isArray(meta.labels) ? meta.labels : [];
  }
  if (window.__DINNING_STANDALONE__ && !state.config.token) {
    setStatus(state.seeded ? "试用版" : "未连接", "试用版：数据只存在这台设备上，不会同步到任何仓库", "warn");
  } else if (!state.config.token) setStatus("未连接", "去「我的」填 Token，之后自动读写", "warn");
  else if (state.pending) setStatus("待同步", "有改动没推上去，正在自动推送…", "warn");
  else if (state.data) setStatus("本地副本", "正在拉取最新版…", "warn");
  else setStatus("同步中", "正在拉取远端数据…", "warn");
  await loadBackupInfo();
  emit();
}

async function saveConfig(patch) {
  state.config = { ...state.config, ...patch };
  await kvSet(KEYS.config, state.config);
  emit();
}

async function mutate(fn, label) {
  if (!state.data) return;
  state.data = fn(structuredClone(state.data));
  // 顺手把没填日期的库存按保鲜期估上：不用你一条条手动保存
  const back = backfillBatchDates(state.data, todayISO(state.data.settings.budget.timezone));
  if (back.filled) state.data = back.data;
  state.rev = (state.rev || 0) + 1; // 本地版本号：同步期间又改了就靠它发现
  if (label && !state.labels.includes(label)) state.labels.push(label);
  if (state.labels.length > 5) state.labels = state.labels.slice(-5);
  state.pending = true;
  state.status = "待同步";
  state.statusKind = "warn";
  // 本地也先校验一遍：别等推到远端才发现格式不对
  try {
    const validate = await getValidator();
    if (!validate(state.data)) {
      const errs = formatErrors(validate).slice(0, 3).join("；");
      setStatus("格式错误", `这次改动不合 schema（已存本机，暂时不会推远端）：${errs}`, "bad");
    }
  } catch {
    /* 校验器加载失败就不拦 */
  }
  await persist();
  emit();
  schedulePush();
}

function handleErr(e, phase) {
  let msg;
  if (e instanceof GitHubError) {
    if (e.status === 401) msg = "401 未授权：检查 Token 是否有效、是否勾了 Contents 读写";
    else if (e.status === 403) msg = "403 权限不足或触发限流";
    else if (e.status === 404) msg = "404 找不到仓库或路径：检查 owner / repo / path 与 Token 授权范围";
    else msg = `${e.status} ${e.body}`;
  } else {
    msg = e && e.message ? e.message : String(e);
  }
  setStatus(`${phase}失败`, msg, "bad");
}

async function readRemote() {
  try {
    setStatus("读取中…");
    const res = await getFile(state.config);
    if (!res.exists) {
      setStatus("远端为空", "远端还没有 data.json", "warn");
      return;
    }
    const changed = res.content !== state.base;
    const parsed = JSON.parse(res.content);
    state.data = parsed;
    state.sha = res.sha;
    state.base = res.content;
    state.conflicts = [];
    await persist();
    const info = summarize(parsed);
    setStatus("已同步", changed ? `已更新：${info}` : `远端没有变化：${info}`, "good");
  } catch (e) {
    handleErr(e, "读取");
  }
}

async function writeRemote() {
  if (!state.data) return;
  try {
    setStatus("写入中…");
    const validate = await getValidator();
    if (!validate(state.data)) {
      setStatus("格式错误", "数据不符合 schema，已阻止写入：" + formatErrors(validate).slice(0, 3).join("；"), "bad");
      return;
    }
    const rev = state.rev || 0; // 这次上传的是哪个版本
    const content = JSON.stringify(state.data, null, 2) + "\n";
    const message = state.labels.length ? `Dinning：${state.labels.join("；")}` : "更新 data.json";
    const res = await putFile(state.config, content, state.sha, message);
    if (res.conflict) {
      await mergeAndPush();
      return;
    }
    state.sha = res.sha;
    state.base = content;
    // 请求期间本地又改了：上传的那份已经不是最新的，绝不能标成「已同步」，
    // 也不能用旧内容覆盖 state.data —— 继续保留待同步，稍后再推一次。
    if (writeOutcome({ snapshotRev: rev, currentRev: state.rev }).changedDuringWrite) {
      await persist();
      setStatus("待同步", "同步期间又改了，正在再推一次", "warn");
      schedulePush(200);
      return;
    }
    state.pending = false;
    state.labels = [];
    await persist();
    setStatus("已同步", `已写入远端：${summarize(state.data)}`, "good");
  } catch (e) {
    handleErr(e, "写入");
  }
}

async function mergeAndPush() {
  const rev = state.rev || 0;
  const latest = await getFile(state.config);
  if (!latest.exists) {
    setStatus("同步失败", "远端文件不见了", "bad");
    return;
  }
  if (!state.base) {
    setStatus("需人工处理", "没有同步基线，先「读取远端」再改", "warn");
    return;
  }
  // 用「此刻」的本地数据合并：等远端的这段时间里可能又改过
  const local = state.data;
  const { merged, conflicts } = threeWayMerge(JSON.parse(state.base), local, JSON.parse(latest.content));
  state.conflicts = conflicts;
  // 记住这次冲突是跟哪个远端版本比出来的，解决冲突时要把基线推进到它
  state.conflictBase = latest.content;
  state.conflictSha = latest.sha;
  if (conflicts.length) {
    setStatus("需人工处理", `${conflicts.length} 处冲突，已保留双方`, "warn");
    return;
  }
  const content = JSON.stringify(merged, null, 2) + "\n";
  const res2 = await putFile(state.config, content, latest.sha, "三方自动合并");
  if (res2.conflict) {
    setStatus("待同步", "写入时远端又变了，请重试", "warn");
    return;
  }
  state.sha = res2.sha;
  state.base = content;
  if (writeOutcome({ snapshotRev: rev, currentRev: state.rev }).changedDuringWrite) {
    // 合并/写入期间又改了：把这次写入的合并结果当作新基线，本地改动继续保留，再推一次
    await persist();
    setStatus("待同步", "同步期间又改了，正在再推一次", "warn");
    schedulePush(200);
    return;
  }
  state.data = merged;
  state.pending = false;
  state.labels = [];
  await persist();
  setStatus("已同步", `已自动合并并写入：${summarize(state.data)}`, "good");
}

// ---- 自动同步 ----
let pushTimer = null;
let pushInFlight = false;
let pushAgain = false;

function schedulePush(delay = 1500) {
  if (!state.config.token || !state.data) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    pushTimer = null;
    autoPush();
  }, delay);
}

async function autoPush() {
  if (pushInFlight) {
    pushAgain = true;
    return;
  }
  pushInFlight = true;
  try {
    await writeRemote();
  } finally {
    pushInFlight = false;
    if (pushAgain) {
      pushAgain = false;
      schedulePush(500);
    }
  }
}

// 页面打开时：本地有没推上去的改动就先推，否则直接拉最新。
function syncOnOpen() {
  if (!state.config.token) return;
  // 有冲突时不要再自动推送：否则每次打开都在重试同一个冲突，永远读不到远端的新数据。
  if ((state.conflicts || []).length) {
    setStatus("需人工处理", "有冲突等你选；也可以点「读取远端」放弃本地改动、直接用远端版本", "warn");
    return;
  }
  if (state.pending) autoPush();
  else readRemote();
}

async function loadLog() {
  try {
    state.log = await listCommits(state.config, { path: state.config.path, perPage: 20 });
    emit();
  } catch (e) {
    handleErr(e, "读取日志");
  }
}

// 回退到某一版：拿那一版的内容当当前数据，用最新 SHA 写回，形成一条新提交，历史不丢。
async function restoreCommit(sha) {
  try {
    setStatus("读取中…", `正在回到 ${String(sha).slice(0, 7)}`);
    const [old, latest] = await Promise.all([getFile(state.config, sha), getFile(state.config)]);
    if (!old.exists || !latest.exists) {
      setStatus("回退失败", "这一版或远端当前没有数据文件", "bad");
      return;
    }
    state.data = JSON.parse(old.content);
    state.base = latest.content;
    state.sha = latest.sha;
    state.pending = true;
    state.labels = [`回到 ${String(sha).slice(0, 7)}`];
    await persist();
    emit();
    await autoPush();
  } catch (e) {
    handleErr(e, "回退");
  }
}

// 处理一处冲突：按选择把值换成我的或远端的，解决完最后一处就自动写回。
async function resolveConflictAt(path, choice) {
  const conflict = (state.conflicts || []).find((c) => c.path === path);
  if (!conflict) return;
  const value = choice === "remote" ? conflict.remote : conflict.local;
  state.data = setAtPath(state.data, path, value === undefined ? null : value, {
    deleteIfNull: conflict.kind === "delete-vs-modify"
  });
  state.conflicts = state.conflicts.filter((c) => c.path !== path);
  state.rev = (state.rev || 0) + 1;
  // 冲突是拿某个远端版本比出来的：解决完就把它当成新基线，
  // 否则下一次写入还会拿旧基线去比，同一处冲突又冒出来。
  if (state.conflictBase) {
    state.base = state.conflictBase;
    if (state.conflictSha) state.sha = state.conflictSha;
    state.conflictBase = null;
    state.conflictSha = null;
  }
  state.pending = true;
  if (!state.labels.includes("解决冲突")) state.labels.push("解决冲突");
  await persist();
  if (state.conflicts.length === 0) {
    setStatus("待同步", "冲突已解决，正在写入…", "warn");
    schedulePush(400);
  } else {
    setStatus("需人工处理", `还剩 ${state.conflicts.length} 处冲突`, "warn");
  }
}

// ---- 备份与恢复 ----

// 恢复前把当前数据留在本机一份，随时能退回来。
async function saveBackupLocal() {
  if (!state.data) return;
  const at = new Date().toISOString();
  await kvSet(BACKUP_KEY, { at, data: state.data });
  state.backup = { at, summary: summarize(state.data) };
}

async function loadBackupInfo() {
  const b = await kvGet(BACKUP_KEY);
  state.backup = b && b.data ? { at: b.at, summary: summarize(b.data) } : null;
}

// 生成存档文本：压缩 + 混淆，能直接复制走。
function exportSaveText() {
  if (!state.data || !window.LZString) return "";
  return encodeSave(state.data, window.LZString);
}

// 换上一份新数据（导入或恢复备份都走这里）。
// 先把远端最新版当基线，这样写回去是我们这份说了算，不被判成冲突。
async function applyNewData(next, label) {
  try {
    const latest = await getFile(state.config);
    if (latest.exists) {
      state.sha = latest.sha;
      state.base = latest.content;
    }
  } catch {
    /* 拿不到远端就按现有 SHA 写，真冲突了再走合并 */
  }
  state.data = next;
  state.pending = true;
  state.labels = [label];
  state.conflicts = [];
  await persist();
  emit();
  await autoPush();
}

// 粘贴读档：解出存档 → 校验格式 → 自动备份当前数据 → 换上去并写回远端。
async function importSaveText(text) {
  if (!window.LZString) return { ok: false, reason: "压缩库没加载起来，刷新页面再试" };
  const decoded = decodeSave(text, window.LZString);
  if (!decoded.ok) return decoded;
  let validate;
  try {
    validate = await getValidator();
  } catch {
    return { ok: false, reason: "校验器没加载起来，稍后再试" };
  }
  if (!validate(decoded.data)) {
    return { ok: false, reason: "存档里的数据格式不符合要求，已拒绝：" + formatErrors(validate).slice(0, 3).join("；") };
  }
  await saveBackupLocal();
  await applyNewData(decoded.data, "粘贴读档");
  return { ok: true };
}

async function restoreBackup() {
  const b = await kvGet(BACKUP_KEY);
  if (!b || !b.data) return { ok: false, reason: "还没有自动备份" };
  const target = b.data;
  await saveBackupLocal(); // 当前这份变成新的备份，可以再退回来
  await applyNewData(target, "恢复备份");
  return { ok: true };
}

// ===== app\ui.js =====
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let modalRoot = null;
function mountModals(root) {
  modalRoot = root;
}

// 弹窗序号：用来判断“我这一层”是否已经被新弹窗顶替。
// 有些按钮会先打开新弹窗、再由这一层收尾，不能把新弹窗一起关掉。
let modalSeq = 0;
// 当前这一摞弹窗是否往历史里压过一条记录（弹窗套弹窗只压一条）。
let modalPushed = false;
// 最上面那层弹窗的关闭函数，给“点了某个按钮就直接收工”的场景用
let currentClose = null;

function pushModalHistory() {
  if (modalPushed) return;
  modalPushed = true;
  try {
    history.pushState({ modal: true, kind: "modal" }, "", "#modal");
  } catch {
    /* 忽略 */
  }
}

// 主动关掉弹窗时把自己那条历史记录退掉，免得留下“空记录”让返回键失灵
function popModalHistory() {
  if (!modalPushed) return;
  modalPushed = false;
  try {
    if (history.state && history.state.modal) history.back();
  } catch {
    /* 忽略 */
  }
}

function openModal({ title, body, okText = "确定", cancelText = "取消", dangerText, onOk, onDanger, onMount }) {
  modalSeq += 1;
  const mySeq = modalSeq;
  const stillMine = () => modalSeq === mySeq;
  const nested = !!modalRoot.querySelector(".modal");
  modalRoot.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" role="dialog">
        <h3>${esc(title)}</h3>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">
          ${dangerText ? `<button class="danger" data-modal="danger">${esc(dangerText)}</button>` : ""}
          <button class="secondary" data-modal="cancel">${esc(cancelText)}</button>
          <button class="primary" data-modal="ok">${esc(okText)}</button>
        </div>
      </div>
    </div>`;
  const close = () => {
    if (!stillMine()) return; // 已经被新弹窗顶替，历史记录交给新弹窗管
    modalRoot.innerHTML = "";
    popModalHistory();
    if (currentClose === close) currentClose = null;
  };
  currentClose = close;
  // 给返回键留一条记录：按返回先关弹窗，而不是直接退出应用
  if (!nested) pushModalHistory();

  modalRoot.querySelector('[data-modal="cancel"]').onclick = close;
  const dangerBtn = modalRoot.querySelector('[data-modal="danger"]');
  if (dangerBtn) {
    dangerBtn.onclick = () => {
      const result = onDanger ? onDanger(modalRoot.querySelector(".modal")) : undefined;
      if (result !== false && stillMine()) close();
    };
  }
  modalRoot.querySelector(".modal-backdrop").onclick = (e) => {
    if (e.target === e.currentTarget) close();
  };
  modalRoot.querySelector('[data-modal="ok"]').onclick = () => {
    const result = onOk ? onOk(modalRoot.querySelector(".modal")) : undefined;
    // 异步的 onOk（校验、解压这类）等出结果再关，避免失败时把用户粘贴的内容弄丢
    if (result && typeof result.then === "function") {
      result
        .then((r) => {
          if (r !== false && stillMine()) close();
        })
        .catch(() => {});
      return false;
    }
    if (result !== false && stillMine()) close();
    return false;
  };
  // 只有明确写了 data-autofocus 的才自动聚焦。
  // 以前是「聚焦第一个输入框」，手机上打开弹窗立刻弹输入法，很烦。
  const input = modalRoot.querySelector("[data-autofocus]");
  if (input) input.focus();
  if (onMount) onMount(modalRoot.querySelector(".modal"));
  return close;
}

// 份数一律用滑块：手机上手指一滑就改，不弹输入法
function servingsField(id, value, { min = 1, max = 8, label = "做几份" } = {}) {
  const v = Math.max(min, Math.min(max, Number(value) || min));
  return `<div class="slider-field">
    <div class="row between"><span>${esc(label)}</span><b id="${id}-out">${v} 人份</b></div>
    <input id="${id}" type="range" min="${min}" max="${max}" step="1" value="${v}">
    <div class="slider-ticks"><span>${min}</span><span>${max}</span></div>
  </div>`;
}

function readServings(root, id, fallback) {
  const input = root.querySelector(`#${id}`);
  const n = input ? parseInt(input.value, 10) : NaN;
  return Number.isFinite(n) && n > 0 ? n : fallback;
}

function bindServings(root, id, onChange) {
  const input = root.querySelector(`#${id}`);
  if (!input) return;
  const out = root.querySelector(`#${id}-out`);
  input.addEventListener("input", () => {
    if (out) out.textContent = `${input.value} 人份`;
    if (onChange) onChange(parseInt(input.value, 10));
  });
}

// 一行单选：选项只有三五个的时候，比下拉少一次点击（点一下就是选中）
function radioRow({ id, value, choices, name }) {
  return `<div class="radio-row"${name ? ` data-group="${esc(name)}"` : ""}>
    <input type="hidden" id="${id}" value="${esc(value == null ? "" : value)}">
    ${choices
      .map(
        ([v, label]) =>
          `<button type="button" class="chip${v === value ? " active" : ""}" data-radio="${id}" data-value="${esc(v)}">${esc(
            label
          )}</button>`
      )
      .join("")}
  </div>`;
}

// 返回键按下时：关掉当前所有弹窗（它们只占历史里的一条记录）
function closeModalsOnBack() {
  if (!modalRoot || !modalRoot.querySelector(".modal")) return false;
  modalRoot.innerHTML = "";
  modalPushed = false; // 浏览器已经帮我们退掉那条记录，这里只清状态
  currentClose = null;
  return true;
}

// 代码里主动关弹窗（比如选好菜直接收工）：会把自己那条历史记录一起退掉
function closeModal() {
  if (!currentClose) return false;
  const close = currentClose;
  currentClose = null;
  close();
  return true;
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ===== src\rules\money.js =====
// 金额一律以整数「便士」存储与计算，避免浮点误差。
// 详细规则见 docs/M0-业务规则.md。

function poundsToPence(pounds) {
  return Math.round(Number(pounds) * 100);
}

function formatPence(pence) {
  const value = Number(pence);
  const sign = value < 0 ? "-" : "";
  const abs = Math.abs(Math.round(value));
  const pounds = Math.floor(abs / 100);
  const cents = String(abs % 100).padStart(2, "0");
  return `${sign}£${pounds}.${cents}`;
}

// 按用量分摊整包金额：packPence 为整包价格，used / packSize 必须是同一基础单位。
// half-up 舍入，结果仍为整数便士。
function apportionPence(packPence, used, packSize) {
  if (!(packSize > 0)) throw new Error("packSize 必须大于 0");
  if (used < 0) throw new Error("used 不能为负");
  return Math.round((packPence * used) / packSize);
}

// 预算条怎么画：已付的钱和「还要买」的预计各占一段，两段合起来才是这周要花的。
// 以前只按预计画，实际花了多少在条子上看不出来。
function budgetBar({ budgetPence, paidPence, estimatePence } = {}) {
  const budget = Math.max(0, Number(budgetPence) || 0);
  const paid = Math.max(0, Number(paidPence) || 0);
  const estimate = Math.max(0, Number(estimatePence) || 0);
  const spentPence = paid + estimate;
  const totalPct = budget > 0 ? Math.min(100, Math.round((spentPence / budget) * 100)) : 0;
  const paidPct = budget > 0 ? Math.min(totalPct, Math.round((paid / budget) * 100)) : 0;
  return {
    spentPence,
    leftPence: budget - spentPence,
    over: spentPence > budget,
    totalPct,
    paidPct,
    estimatePct: totalPct - paidPct
  };
}

// ===== src\rules\units.js =====
// 单位换算：
//  1) 公制/市制之间的换算不需要问食材（kg↔g、l↔ml、斤↔g），按定义直接算；
//  2) 「个 → 克」这种必须靠食材显式声明的 unitConversions，绝不臆测。
// 未知量返回 { value: null, certain: false }，调用方必须保留不确定状态。

// unitConversions 语义：1 个「基础单位」等于多少「目标单位」。
// 例：洋葱 baseUnit = 个，unitConversions = { g: 150 } → 1 个 ≈ 150g。

// 输入单位时给的下拉选项
const COMMON_UNITS = ["g", "kg", "ml", "l", "个"];

// 同一「物理量」下的固定倍数换算，和食材无关
const METRIC = {
  g: { base: "g", factor: 1 },
  kg: { base: "g", factor: 1000 },
  斤: { base: "g", factor: 500 },
  两: { base: "g", factor: 50 },
  ml: { base: "ml", factor: 1 },
  l: { base: "ml", factor: 1000 },
  L: { base: "ml", factor: 1000 }
};

function convert(food, amount, from, to) {
  if (from === to) return { value: amount, certain: true };

  const mFrom = METRIC[from];
  const mTo = METRIC[to];
  if (mFrom && mTo && mFrom.base === mTo.base) {
    return { value: (amount * mFrom.factor) / mTo.factor, certain: true };
  }

  const base = food && food.baseUnit;
  const conv = (food && food.unitConversions) || {};

  // 1 个 from/to 单位各等于多少「基础单位」（换算不了返回 null）
  const toBase = (u) => {
    if (u === base) return 1;
    const m = METRIC[u];
    if (m && m.base === base) return m.factor;
    // 「kg → g → 个」这种要接力一次：先按公制退到 g，再靠食材换算退到 个
    if (m && m.base !== u) {
      const inner = toBase(m.base);
      if (inner != null) return m.factor * inner;
    }
    if (typeof conv[u] === "number" && conv[u] !== 0) return 1 / conv[u];
    return null;
  };

  const a = toBase(from);
  const b = toBase(to);
  if (a == null || b == null) return { value: null, certain: false };
  return { value: (amount * a) / b, certain: true };
}

function isConvertible(food, from, to) {
  if (from === to) return true;
  const mFrom = METRIC[from];
  const mTo = METRIC[to];
  if (mFrom && mTo && mFrom.base === mTo.base) return true;
  const conv = (food && food.unitConversions) || {};
  const base = food && food.baseUnit;
  const reachable = (u, seen = new Set()) => {
    if (u === base) return true;
    if (seen.has(u)) return false;
    seen.add(u);
    const m = METRIC[u];
    if (m && m.base === base) return true;
    if (m && m.base !== u && reachable(m.base, seen)) return true;
    return typeof conv[u] === "number";
  };
  return reachable(from) && reachable(to);
}

// 只有单位可互转时才允许合并用量；否则必须分开列出。
function canMergeQuantity(food, unitA, unitB) {
  return isConvertible(food, unitA, unitB);
}

// ===== src\rules\servings.js =====
// 份数换算：统一使用「基础食材量 × 实际份数 / 基础份数」。
// 每餐只存一个 actualServings（实际制作份数），不做「双份」这类额外开关。

function scaleAmount(baseAmount, baseServings, actualServings) {
  if (!(baseServings > 0)) throw new Error("baseServings 必须大于 0");
  return (baseAmount * actualServings) / baseServings;
}

function scaleIngredients(ingredients, baseServings, actualServings) {
  return ingredients.map((ing) => ({
    ...ing,
    amount: scaleAmount(ing.amount, baseServings, actualServings)
  }));
}

// 一餐的份数：优先用该餐自己的 actualServings，没设就取家庭人数。
// 想吃隔天午饭，就把那一餐的份数直接调大（例如 2 人吃、这一餐设 4 份），多做出来的部分记为剩菜。
function resolveMealServings(meal, householdServings) {
  return meal && meal.actualServings != null ? meal.actualServings : householdServings;
}

// ===== src\rules\planning.js =====
// 采购清单生成：需要补买 = 尚未完成的菜单需求 − 可用库存，再按包装规格决定买几包。
// 库存不够时才买；同一批库存只会被算一次，不会重复分给多道菜。
const NEEDS_COOKING = ["planned", "cooking"];
const AREA_ORDER = ["meat", "fish", "veg", "fruit", "dairy", "staple", "seasoning", "other"];

function round3__m1(n) {
  return Math.round(n * 1000) / 1000;
}

function mealsNeedingCook(meals, range) {
  return meals.filter((m) => NEEDS_COOKING.includes(m.state) && m.recipeId && inRange(m.date, range));
}

function aggregateRequirements(meals, recipes, foods) {
  const recipesById = new Map(recipes.map((r) => [r.id, r]));
  const foodsById = new Map(foods.map((f) => [f.id, f]));
  const buckets = new Map();
  const uncertain = [];

  for (const meal of meals) {
    const recipe = recipesById.get(meal.recipeId);
    if (!recipe) continue;
    const servings = meal.actualServings != null ? meal.actualServings : recipe.baseServings;
    for (const ing of recipe.ingredients) {
      const food = foodsById.get(ing.foodId);
      const amount = scaleAmount(ing.amount, recipe.baseServings, servings);
      let unit = ing.unit;
      let value = amount;
      let certain = true;
      if (food) {
        const c = convert(food, amount, ing.unit, food.baseUnit);
        if (c.certain) {
          unit = food.baseUnit;
          value = c.value;
        } else {
          certain = false;
        }
      }
      if (!certain) uncertain.push({ mealId: meal.id, foodId: ing.foodId, amount, unit: ing.unit });
      // 同一样食材只出一行：能换算的都先换成基础单位再合并，
      // 否则「生抽 10g」和「生抽 15ml」会各占一行，勾选的时候还容易认错行。
      const key = certain ? ing.foodId : `${ing.foodId}|${unit}`;
      const cur = buckets.get(key) || { foodId: ing.foodId, unit, need: 0, certain: true, firstDate: null };
      cur.need += value;
      if (!certain) cur.certain = false;
      // 这一样食材最早哪天要用：判断库存够不够时按那一天算（use-by 过了就不能算）
      if (!cur.firstDate || meal.date < cur.firstDate) cur.firstDate = meal.date;
      buckets.set(key, cur);
    }
  }
  return { requirements: [...buckets.values()], uncertain };
}

function availableQuantity(food, unit, batches, { onDate } = {}) {
  let qty = 0;
  let uncertain = false;
  let expired = 0;
  let expiresBeforeUse = 0;
  for (const b of batches) {
    if (!food || b.foodId !== food.id) continue;
    // 吃完的批次既不算可用量，也不该被算成「冰箱里有 N 批用不上」
    if (!hasStock(b)) continue;
    if (b.quantityState !== "exact") {
      uncertain = true; // 档位不假装精确
      continue;
    }
    // use-by 是食品安全日期：到那天之后就不能再吃了。
    // 但「估算」出来的日期只是按保鲜期猜的，不能拿它把库存一笔勾销 ——
    // 只提醒（按估算日期会赶不上这顿），仍然算可用；包装上印的日期才硬排除。
    if (onDate && b.dateType === "use_by" && b.date && b.date < onDate) {
      if (b.dateSource === "estimate") {
        expiresBeforeUse += 1;
      } else {
        expired += 1;
        continue;
      }
    }
    const c = convert(food, b.quantity, b.unit, unit);
    if (c.certain) qty += c.value;
    else uncertain = true;
  }
  return { qty, uncertain, expired, expiresBeforeUse };
}

function defaultPack(food, unit) {
  if (!food || !food.packSizes || food.packSizes.length === 0) return null;
  return food.packSizes.find((p) => p.unit === unit) || food.packSizes[0];
}

// 一道菜按参考价折算的食材成本，逐样列出来（缺价的单独标）。
// 用于比较菜品、也在「这道菜多少钱」的二级页里显示。
function recipeCostBreakdown(recipe, foods, servings, { batches = [], purchases = [] } = {}) {
  const foodsById = new Map(foods.map((f) => [f.id, f]));
  // 库存优先：先用冰箱里的批次抵掉用量。
  // 「库存·没花钱」的批次成本按 0 算 —— 登记成库存的东西就当免费。
  const purchaseById = new Map(purchases.map((p) => [p.id, p]));
  const stock = new Map();
  for (const b of batches) {
    if (b.quantityState !== "exact" || !(Number(b.quantity) > 0)) continue;
    const p = b.sourcePurchaseId ? purchaseById.get(b.sourcePurchaseId) : null;
    const free = p ? p.storeId === "stock" : false;
    const unit = free ? 0 : b.unitCostPence != null ? b.unitCostPence : null;
    const list = stock.get(b.foodId) || [];
    list.push({ qty: Number(b.quantity), unit: b.unit, unitCost: unit, free });
    stock.set(b.foodId, list);
  }
  const rows = [];
  let pence = 0;
  let unpriced = 0;
  let freePence = 0;
  for (const ing of recipe.ingredients) {
    const food = foodsById.get(ing.foodId);
    const amount = scaleAmount(ing.amount, recipe.baseServings, servings);
    // 先看库存能抵多少
    let needFromStock = amount;
    let stockPence = null;
    let freeUsed = 0;
    const list = food ? stock.get(food.id) || [] : [];
    for (const s of list) {
      if (needFromStock <= 1e-9) break;
      if (s.qty <= 0) continue;
      const c = convert(food, Math.min(s.qty, needFromStock), food.baseUnit, ing.unit);
      if (!c.certain) continue;
      const take = Math.min(s.qty, needFromStock / (c.value / Math.min(s.qty, needFromStock) || 1) || s.qty);
      const used = Math.min(s.qty, take);
      s.qty -= used;
      needFromStock -= c.value ? Math.min(c.value, needFromStock) : used;
      if (s.free) {
        freeUsed += used;
      } else if (s.unitCost != null) {
        stockPence = (stockPence || 0) + used * s.unitCost;
      } else if (s.unitCost == null && !s.free) {
        stockPence = stockPence; // 价格未知的库存不作数，留给参考价
      }
    }
    const pack = food ? defaultPack(food, ing.unit) : null;
    const restAmount = Math.max(0, needFromStock);
    if (freeUsed > 0) freePence += 0; // 免费部分不再计价
    if (stockPence != null) pence += Math.round(stockPence);
    if (restAmount <= 1e-9) {
      // 全靠库存解决
      rows.push({
        foodId: ing.foodId,
        name: food ? food.name : ing.foodId,
        amount,
        unit: ing.unit,
        pence: stockPence == null ? 0 : Math.round(stockPence),
        fromStock: true,
        free: freeUsed > 0 && stockPence == null
      });
      continue;
    }
    if (!pack || pack.pricePence == null) {
      unpriced++;
      rows.push({
        foodId: ing.foodId,
        name: food ? food.name : ing.foodId,
        amount,
        unit: ing.unit,
        pence: stockPence == null ? null : Math.round(stockPence),
        free: freeUsed > 0,
        reason: "没有参考价"
      });
      continue;
    }
    const c = convert(food, pack.size, pack.unit, ing.unit);
    const packInUnit = c.certain ? c.value : null;
    if (!packInUnit) {
      unpriced++;
      rows.push({
        foodId: ing.foodId,
        name: food.name,
        amount,
        unit: ing.unit,
        pence: stockPence == null ? null : Math.round(stockPence),
        free: freeUsed > 0,
        reason: `包装单位（${pack.unit}）和用量单位（${ing.unit}）换不了`
      });
      continue;
    }
    // 剩下的部分（库存没覆盖的）按参考价折算
    const cost = Math.round((pack.pricePence * restAmount) / packInUnit);
    pence += cost;
    rows.push({
      foodId: ing.foodId,
      name: food.name,
      amount,
      unit: ing.unit,
      pence: cost + (stockPence == null ? 0 : Math.round(stockPence)),
      free: freeUsed > 0,
      packSize: pack.size,
      packUnit: pack.unit,
      packPence: pack.pricePence
    });
  }
  return { pence, unpriced, rows, freePence, servings: servings || recipe.baseServings };
}

// 只要总额和缺价数量时用它
function recipeCostPence(recipe, foods, servings) {
  const { pence, unpriced } = recipeCostBreakdown(recipe, foods, servings);
  return { pence, unpriced };
}

// timing（大采购 / 顺手补货）由商店在设置里的 role 决定；
// 没配 stores 时退回老规则：Sainsbury's 算补货，其余算大采购。
function timingOf(food, storeRoles) {
  const storeId = (food && food.storeHint) || null;
  if (storeId && storeRoles.has(storeId)) return storeRoles.get(storeId) === "topup" ? "topup" : "main";
  return storeId === "sainsburys" ? "topup" : "main";
}

function buildShoppingList({ meals, recipes, foods, batches, range, stores }) {
  const foodsById = new Map(foods.map((f) => [f.id, f]));
  const { requirements, uncertain } = aggregateRequirements(mealsNeedingCook(meals, range), recipes, foods);
  const storeRoles = new Map((stores || []).map((s) => [s.id, s.role || "main"]));
  const items = [];
  const warnings = [];

  for (const req of requirements) {
    const food = foodsById.get(req.foodId);
    const stock = availableQuantity(food, req.unit, batches, { onDate: req.firstDate });
    const shortfall = Math.max(0, req.need - stock.qty);
    const item = {
      foodId: req.foodId,
      key: `${req.foodId}|${req.unit}`,
      name: food ? food.name : req.foodId,
      area: food && food.area ? food.area : "other",
      storeId: (food && food.storeHint) || null,
      timing: timingOf(food, storeRoles),
      unit: req.unit,
      need: round3__m1(req.need),
      available: round3__m1(stock.qty),
      availableUncertain: stock.uncertain,
      expiredSkipped: stock.expired || 0,
      expiresBeforeUse: stock.expiresBeforeUse || 0,
      needUncertain: !req.certain,
      shortfall: round3__m1(shortfall),
      packs: null,
      packLabel: null,
      estPence: null,
      leftover: null
    };

    if (shortfall > 0) {
      const pack = defaultPack(food, req.unit);
      if (!pack) {
        item.packs = 1;
        warnings.push(`${item.name}：没有包装规格，按 1 份计`);
      } else {
        const c = convert(food, pack.size, pack.unit, req.unit);
        const packInUnit = c.certain ? c.value : null;
        item.packLabel = `${pack.size}${pack.unit}`;
        if (packInUnit) {
          const packs = Math.ceil(shortfall / packInUnit - 1e-9);
          item.packs = packs;
          item.leftover = round3__m1(packs * packInUnit - shortfall);
          if (pack.pricePence != null) item.estPence = packs * pack.pricePence;
        } else {
          item.packs = 1;
          warnings.push(`${item.name}：包装单位（${pack.unit}）与需求单位（${req.unit}）不可换算，购买量待确认`);
        }
      }
    }
    items.push(item);
  }

  items.sort(
    (a, b) => AREA_ORDER.indexOf(a.area) - AREA_ORDER.indexOf(b.area) || (a.name > b.name ? 1 : a.name < b.name ? -1 : 0)
  );

  const estimatedPence = items.reduce((s, i) => s + (i.estPence || 0), 0);
  const unpriced = items.filter((i) => i.shortfall > 0 && i.estPence == null);
  return { items, budget: { estimatedPence, unpricedCount: unpriced.length }, warnings, uncertain };
}

// ===== src\rules\mealtags.js =====
// 能不能被推荐，只看这两个标签：同时有「家常菜」和「正餐」才进推荐池。
// 口径（哪道菜有什么标签）在 tools/recipe-tags.mjs 里，改那儿再跑 apply-recipe-tags.mjs。
// 这样韭菜盒子、煮鸡蛋、葱烧海参这类就不会被推上来当正餐了。

const MEAL_TAGS = ["家常菜", "正餐"];

function isMealDish(recipe) {
  if (!recipe) return false;
  const tags = recipe.tags || [];
  return MEAL_TAGS.every((t) => tags.includes(t));
}

function missingMealTags(recipe) {
  const tags = (recipe && recipe.tags) || [];
  return MEAL_TAGS.filter((t) => !tags.includes(t));
}

// ===== src\rules\suggest.js =====
// 剩余食材推荐：拿冰箱里现有的东西，挑出「能做/差一点就能做」的菜。
// 排序偏好：用掉的现有食材越多、还缺的越少、能顺手消耗快过期的东西越多，排越前。
// 把库存按食材聚合到基础单位。
// onDate（通常是今天或这顿饭的日期）：use-by 已经过了的批次不算可用 —— 那是食品安全日期。
function stockByFood(data, { onDate, skipExpired = true } = {}) {
  const foodsById = new Map(data.foods.map((f) => [f.id, f]));
  const map = new Map();
  for (const b of data.inventoryBatches || []) {
    // 吃完的批次没有可用量（加 0 也是 0），统一走 hasStock，免得以后各写一套判据
    if (b.quantityState !== "exact" || !hasStock(b)) continue;
    const f = foodsById.get(b.foodId);
    if (!f) continue;
    if (skipExpired && onDate && b.dateType === "use_by" && b.date && b.date < onDate) continue;
    const c = convert(f, b.quantity, b.unit, f.baseUnit);
    if (!c.certain) continue;
    const cur = map.get(b.foodId) || { qty: 0, unit: f.baseUnit };
    cur.qty += c.value;
    map.set(b.foodId, cur);
  }
  return map;
}

function suggestRecipes(data, { limit = 8, today, servings, maxMissing = 3, minUsed = 2 } = {}) {
  const foodsById = new Map(data.foods.map((f) => [f.id, f]));
  const stock = stockByFood(data, { onDate: today });
  const target =
    servings || (data.settings && data.settings.household ? data.settings.household.defaultServings : 2);

  // 快过期 / best-before 过了的食材，能顺手用掉是加分项；
  // 但 use-by 已过的不能再吃，不算加分项（那些批次也已经不计入库存了）；
  // 已经吃完的批次（0 存量）同样不算 —— 它没什么可「顺手用掉」的。
  const warnFoods = new Set();
  for (const b of data.inventoryBatches || []) {
    if (!hasStock(b)) continue;
    const info = expiryInfo(b, today);
    if (info.level === "soon") warnFoods.add(b.foodId);
    else if (info.level === "expired" && b.dateType !== "use_by") warnFoods.add(b.foodId);
  }

  const out = [];
  for (const r of data.recipes) {
    if (r.status !== "complete" || !r.ingredients.length) continue;
    if (!isMealDish(r)) continue; // 只有「家常菜 + 正餐」才参与推荐
    const scale = target / r.baseServings;
    let full = 0;
    let partial = 0;
    const missing = []; // 主料缺口：这个才算“还得去买”
    const missingSeasoning = []; // 调料缺口：家里多半有，只是没记进冰箱
    const warnUsed = [];

    for (const ing of r.ingredients) {
      const f = foodsById.get(ing.foodId);
      const need = ing.amount * scale;
      let needBase = need;
      let unit = ing.unit;
      if (f) {
        const c = convert(f, need, ing.unit, f.baseUnit);
        if (c.certain) {
          needBase = c.value;
          unit = f.baseUnit;
        }
      }
      const s = stock.get(ing.foodId);
      const have = s && s.unit === unit ? s.qty : 0;
      const isSeasoning = f && f.area === "seasoning";
      const bucket = isSeasoning ? missingSeasoning : missing;
      if (have >= needBase && needBase > 0) {
        full += 1;
        if (warnFoods.has(ing.foodId)) warnUsed.push(f ? f.name : ing.foodId);
      } else if (have > 0) {
        partial += 1;
        bucket.push({ foodId: ing.foodId, name: f ? f.name : ing.foodId, short: Math.round((needBase - have) * 10) / 10 });
      } else {
        bucket.push({ foodId: ing.foodId, name: f ? f.name : ing.foodId, short: Math.round(needBase * 10) / 10 });
      }
    }

    const total = r.ingredients.length;
    const usedCount = full + partial;
    if (usedCount < minUsed) continue; // 跟你的库存基本没关系，不算「用现有食材」
    if (missing.length > maxMissing) continue; // 缺太多，跟重新买一遍没区别

    const score = ((full + partial * 0.5) / total) * 100 + (warnUsed.length ? 20 : 0) - missing.length * 5;
    out.push({
      recipeId: r.id,
      name: r.name,
      category: r.category || "",
      baseServings: r.baseServings,
      servings: target,
      full,
      partial,
      missing,
      missingSeasoning,
      warnUsed: [...new Set(warnUsed)],
      score: Math.round(score * 10) / 10
    });
  }

  out.sort((a, b) => b.score - a.score || (a.name > b.name ? 1 : -1));
  return { items: out.slice(0, limit), total: out.length };
}

// ===== src\rules\browse.js =====
// 食谱检索：食谱库页和「安排到某天」的选择页共用同一套匹配规则，
// 两边搜出来的结果要一致，不然会以为菜丢了。
const RECIPE_CATEGORIES = ["荤菜", "素菜", "主食", "汤", "早餐", "水产", "甜点", "饮品", "半成品", "调料", "其他"];

function normalizeQuery(q) {
  return (q || "").trim().toLowerCase();
}

// 匹配范围：菜名、类目、标签都算。
// 所以搜「鸡」能搜到带鸡的菜，搜「家常菜」能一次列出所有可推荐的菜。
function matchesRecipe(recipe, query) {
  const q = normalizeQuery(query);
  if (!q) return true;
  if ((recipe.name || "").toLowerCase().includes(q)) return true;
  if ((recipe.category || "").toLowerCase().includes(q)) return true;
  return (recipe.tags || []).some((t) => String(t).toLowerCase().includes(q));
}

function browseRecipes(
  recipes,
  { query = "", category = "", limit = 30, includeDrafts = false, onlyMealDishes = false, preferMeal = false } = {}
) {
  let pool = (recipes || []).filter((r) => includeDrafts || r.status !== "draft");
  if (onlyMealDishes) pool = pool.filter(isMealDish);
  if (category) pool = pool.filter((r) => (r.category || "其他") === category);

  const matched = pool.filter((r) => matchesRecipe(r, query));
  // 排序保持原顺序（进库顺序），只在需要时把「会参与推荐」的菜提到前面
  const sorted = preferMeal
    ? [...matched].sort((a, b) => (isMealDish(a) ? 0 : 1) - (isMealDish(b) ? 0 : 1))
    : matched;

  return { items: sorted.slice(0, limit), total: sorted.length };
}

// ===== src\rules\prices.js =====
// 价格历史：把每次采购的实付金额按食材攒起来，换算出可比的单位价。
// 单位价是跨规格比较的关键：500g £3.20 和 1kg £6.00 直接比不出来，换成 £/kg 就清楚了。
function unitPricePence(amountPence, quantity) {
  if (amountPence == null || !(quantity > 0)) return null;
  return amountPence / quantity;
}

// 按克买就报 £/kg，按毫升买报 £/L，其余按个数。
function unitPriceText(perUnitPence, unit) {
  if (perUnitPence == null) return "—";
  if (unit === "g") return `${formatPence(Math.round(perUnitPence * 1000))}/kg`;
  if (unit === "ml") return `${formatPence(Math.round(perUnitPence * 1000))}/L`;
  return `${formatPence(Math.round(perUnitPence))}/${unit}`;
}

// 最近一次填过价格的采购（用来给下次填价格当默认值）
function lastKnownPrice(data, foodId, excludePurchaseId) {
  const list = ((data && data.purchases) || []).filter(
    (p) => p.foodId === foodId && p.amountPence != null && p.id !== excludePurchaseId
  );
  if (!list.length) return null;
  list.sort((a, b) => (String(a.purchasedAt) < String(b.purchasedAt) ? 1 : -1));
  return list[0];
}

function foodPriceHistory(data, foodId) {
  const storeNames = new Map((((data && data.settings && data.settings.stores) || [])).map((s) => [s.id, s.name]));
  const storeLabel = (id) => (id === "stock" ? "库存（没花钱）" : id ? storeNames.get(id) || id : "未记录");
  const entries = ((data && data.purchases) || [])
    .filter((p) => p.foodId === foodId)
    .map((p) => ({
      id: p.id,
      at: String(p.purchasedAt || "").slice(0, 10),
      store: storeLabel(p.storeId),
      quantity: p.quantity,
      unit: p.unit,
      amountPence: p.amountPence == null ? null : p.amountPence,
      unitPricePence: unitPricePence(p.amountPence, p.quantity)
    }))
    .sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));

  const priced = entries.filter((e) => e.amountPence != null);

  // 按「店 + 单位」归并：不同单位的单位价不能直接比
  const buckets = new Map();
  for (const e of priced) {
    const key = `${e.store}|${e.unit}`;
    const cur = buckets.get(key) || { store: e.store, unit: e.unit, count: 0, sum: 0, n: 0, cheapest: e, latest: e };
    cur.count += 1;
    if (e.unitPricePence != null) {
      cur.sum += e.unitPricePence;
      cur.n += 1;
      if (cur.cheapest.unitPricePence == null || e.unitPricePence < cur.cheapest.unitPricePence) cur.cheapest = e;
    }
    buckets.set(key, cur);
  }

  const stores = [...buckets.values()].map((s) => ({
    store: s.store,
    unit: s.unit,
    count: s.count,
    latest: s.latest,
    cheapestUnitPence: s.cheapest.unitPricePence,
    avgUnitPence: s.n ? s.sum / s.n : null
  }));

  return { entries, pricedCount: priced.length, latest: priced[0] || null, stores };
}

// ===== src\rules\history.js =====
// 吃的历史：把「真正吃过」的菜按天、按周留下来，给「本周 → 吃的日历」回看。
//
// 为什么事实源要用做饭记录、而不是排期：排了不等于吃了。
// 一条历史按优先级从两处来：
//   1. cookLogs 里没被撤销的 —— 真正下厨过的；
//   2. meals 里 state = "done"、但没有对应 cookLog 的老记录。
//
// 「归到哪一天」用**餐次那天**，不是按钮按下去的时刻：这个应用一天只有一顿正餐，
// 「本周」也是按餐次日期显示的。拿 cookedAt 归日子会出现「本周四那顿算到上周」这种
// 和「本周」对不上的情况（真实数据里就有：10-16 那顿的做饭记录是 10-13 按的）。
// 只有餐次已经被清空、找不到的时候，才退回按 cookedAt + 时区去定那天 ——
// 晚上 11 点做的饭 UTC 已经是第二天，直接切前 10 位会算错。
// cookedAt 仍然留着，界面上写「几点做的 / 实际哪天下的厨」。
//
// 早期 cookLog 没有 recipeId，菜名要去当时的餐次上找；再找不到就只留「做过一顿」，
// 不猜。新增的 cookLog 会自己带上 recipeId / recipeName，以后就算菜单被清空、
// 食谱被删掉，这周吃过什么也还留着。
//
// 全是纯函数：只读 data，不写。
const MEAL_DATE_RE = /^meal_(\d{4}-\d{2}-\d{2})/;

function mealDateOf(mealId) {
  const m = MEAL_DATE_RE.exec(String(mealId || ""));
  return m ? m[1] : null;
}

// 「哪天吃了什么」的事件流（按日期从早到晚）
function cookedEvents(data, { timeZone = "UTC" } = {}) {
  const recipesById = new Map((data.recipes || []).map((r) => [r.id, r]));
  const mealsById = new Map((data.meals || []).map((m) => [m.id, m]));
  const nameOf = (recipeId) => {
    const r = recipeId ? recipesById.get(recipeId) : null;
    return r ? r.name : null;
  };

  const events = [];
  const loggedMeals = new Set();
  for (const log of data.cookLogs || []) {
    if (!log || log.undoneBy) continue; // 撤销过的那顿不算吃过
    const meal = mealsById.get(log.mealId) || null;
    const mealDate = meal ? meal.date : mealDateOf(log.mealId);
    const cookedDate = log.cookedAt ? dateInTZ(log.cookedAt, timeZone) : null;
    const recipeId = log.recipeId || (meal && meal.recipeId) || null;
    events.push({
      date: mealDate || cookedDate,
      mealDate,
      cookedDate,
      mealId: log.mealId,
      recipeId,
      name: log.recipeName || nameOf(recipeId),
      servings: log.actualServings != null ? log.actualServings : meal ? meal.actualServings : null,
      cookedAt: log.cookedAt || null,
      source: "cookLog"
    });
    loggedMeals.add(log.mealId);
  }

  for (const meal of data.meals || []) {
    if (!meal || meal.state !== "done" || !meal.recipeId) continue;
    if (loggedMeals.has(meal.id)) continue; // 上面已经算过了
    events.push({
      date: meal.date,
      mealDate: meal.date,
      cookedDate: null,
      mealId: meal.id,
      recipeId: meal.recipeId,
      name: nameOf(meal.recipeId),
      servings: meal.actualServings != null ? meal.actualServings : null,
      cookedAt: null,
      source: "meal"
    });
  }

  events.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return events;
}

function eventsByWeek(events, weekStartsOn = "saturday") {
  const map = new Map();
  for (const e of events) {
    if (!e.date) continue;
    const wk = weekStartISO(e.date, weekStartsOn);
    if (!map.has(wk)) map.set(wk, []);
    map.get(wk).push(e);
  }
  return map;
}

// 每道菜「做过的日期」列表（升序、去重），用来回答「这道菜上次做是什么时候」
function cookedDatesByRecipe(events) {
  const sets = new Map();
  for (const e of events) {
    if (!e.recipeId || !e.date) continue;
    if (!sets.has(e.recipeId)) sets.set(e.recipeId, new Set());
    sets.get(e.recipeId).add(e.date);
  }
  const out = new Map();
  for (const [id, set] of sets) out.set(id, [...set].sort());
  return out;
}

// 某天之前最后一次做的日期（不含那天本身；没有就 null）
function lastCookedBefore(dates, date) {
  if (!dates || !dates.length || !date) return null;
  let found = null;
  for (const d of dates) {
    if (d < date) found = d;
    else break;
  }
  return found;
}

function weekRangeOf(weekStart) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  return { start: weekStart, end: days[6], days };
}

// 一天的「结果」：吃了什么 / 外食 / 跳过 / 吃剩菜 / 定了还没做 / 排了没做 / 没安排。
// 注意「没做」只对已经过去的日子说 —— 今天还没过完，今天定了菜不叫没做。
function dayOutcome(meal, eaten, date, today) {
  if (eaten.length) return "cooked";
  const state = meal ? meal.state : null;
  if (state === "eating_out") return "eating_out";
  if (state === "skipped") return "skipped";
  if (state === "leftovers") return "leftovers";
  if (state === "planned" || state === "cooking") return today && date < today ? "missed" : "planned";
  if (today && date > today) return "future";
  return "empty";
}

const STAT_KEY = {
  cooked: "cooked",
  eating_out: "eatingOut",
  skipped: "skipped",
  leftovers: "leftovers",
  missed: "missed",
  planned: "planned",
  future: "future",
  empty: "empty"
};

// 某一周：7 天各是什么结果 + 这周的统计
function weekHistory(data, { weekStart, weekStartsOn = "saturday", timeZone = "UTC", today } = {}) {
  const events = cookedEvents(data, { timeZone });
  const range = weekRangeOf(weekStart);
  const byDate = new Map();
  for (const e of events) {
    if (e.date < range.start || e.date > range.end) continue;
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }

  const stats = { cooked: 0, eatingOut: 0, skipped: 0, leftovers: 0, missed: 0, planned: 0, future: 0, empty: 0, dishes: 0 };
  const days = range.days.map((d) => {
    const meal = (data.meals || []).find((m) => m.date === d) || null;
    const eaten = byDate.get(d) || [];
    const kind = dayOutcome(meal, eaten, d, today);
    const key = STAT_KEY[kind];
    if (key) stats[key] += 1;
    const planned = meal && meal.recipeId ? (data.recipes || []).find((r) => r.id === meal.recipeId) || null : null;
    stats.dishes += eaten.filter((e) => e.recipeId).length;
    return {
      date: d,
      weekday: WEEKDAY_LABEL[weekdayIndex(d)],
      kind,
      eaten,
      mealState: meal ? meal.state : null,
      planned: planned ? { recipeId: planned.id, name: planned.name } : null,
      plannedServings: meal && meal.actualServings != null ? meal.actualServings : null
    };
  });

  return { weekStart: range.start, weekEnd: range.end, days, stats, events: days.flatMap((d) => d.eaten) };
}

// 月历：按周起点铺 6 行 × 7 列（够放任何一个月），每格给出那天是什么结果
function monthGrid(data, { year, month, weekStartsOn = "saturday", timeZone = "UTC", today } = {}) {
  const monthKey = `${year}-${String(month).padStart(2, "0")}`;
  const gridStart = weekStartISO(`${monthKey}-01`, weekStartsOn);
  const events = cookedEvents(data, { timeZone });
  const byDate = new Map();
  for (const e of events) {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }
  const cells = [];
  for (let i = 0; i < 42; i += 1) {
    const date = addDays(gridStart, i);
    const inMonth = date.slice(0, 7) === monthKey;
    const meal = (data.meals || []).find((m) => m.date === date) || null;
    const eaten = byDate.get(date) || [];
    let kind = dayOutcome(meal, eaten, date, today);
    // 别的月那几天不标状态，只是淡着显示日期
    if (!inMonth && (kind === "empty" || kind === "future")) kind = "outside";
    cells.push({
      date,
      dayNumber: Number(date.slice(8, 10)),
      inMonth,
      kind,
      eaten,
      names: eaten.map((e) => e.name).filter(Boolean)
    });
  }
  return { year, month, monthKey, gridStart, cells };
}

function monthLabel(year, month) {
  return `${year} 年 ${month} 月`;
}

// 往前/往后挪一个月（month 是 1-12）
function shiftMonth(year, month, delta) {
  const d = new Date(Date.UTC(year, month - 1 + delta, 1));
  return { year: d.getUTCFullYear(), month: d.getUTCMonth() + 1 };
}

function shortValue(v) {
  if (v === null) return "（没有／已删除）";
  if (v === undefined) return "（不存在）";
  const s = typeof v === "string" ? v : JSON.stringify(v);
  return s && s.length > 70 ? s.slice(0, 70) + "…" : s;
}

function nameOf(data, coll, id) {
  const list = (data && data[coll]) || [];
  const item = list.find((x) => x && x.id === id);
  return item ? item.name || id : null;
}

function describePath(data, path) {
  const parts = String(path || "").split("/").filter(Boolean);
  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    const prev = parts[i - 1];
    if (prev === "meals" || prev === "cookLogs") {
      const m = /^meal_(\d{4}-\d{2}-\d{2})/.exec(p);
      out.push(m ? m[1].slice(5) : p.slice(0, 12));
      continue;
    }
    if (prev === "foods" || prev === "purchases" || prev === "inventoryBatches" || prev === "recipes") {
      out.push(nameOf(data, prev, p) || p.slice(0, 12));
      continue;
    }
    out.push(FIELD_NAMES[p] || p);
  }
  return out.join(" › ");
}

function renderConflicts(state) {
  const list = state.conflicts || [];
  if (!list.length) return "";
  return `<section class="card">
    <h2>冲突（${list.length}）</h2>
    <p class="muted">两边改了同一处。选一个保留，全部选完会自动写入远端。</p>
    <ul class="plain-list">
      ${list
        .map(
          (c) => `<li class="conflict-item">
            <div class="shop-main">
              <div class="log-msg">${esc(describePath(state.data, c.path))}</div>
              <div class="shop-sub muted">我的：${esc(shortValue(c.local))}</div>
              <div class="shop-sub muted">远端：${esc(shortValue(c.remote))}</div>
            </div>
            <div class="stepper">
              <button class="mini primary" data-action="resolve-conflict" data-path="${esc(c.path)}" data-choice="local">用我的</button>
              <button class="mini" data-action="resolve-conflict" data-path="${esc(c.path)}" data-choice="remote">用远端的</button>
            </div>
          </li>`
        )
        .join("")}
    </ul>
  </section>`;
}

// 「本周」页在看哪一周：state.weekStart 为空就是本周本身，否则是那一周的起点。
// 采购清单（买菜 Tab）和冰箱里的「本周定了」永远按本周算 —— 买菜是现在要买的东西。
function rangeOf(data, weekStart = null) {
  const budget = data.settings.budget;
  return weekRange(weekStart || todayISO(budget.timezone), budget.weekStartsOn);
}

// 这一周相对本周是第几周，用来写「上周 / 下周 / 3 周后」
function weekLabel(weekStart, curStart) {
  const weeks = Math.round((Date.parse(`${weekStart}T00:00:00Z`) - Date.parse(`${curStart}T00:00:00Z`)) / (7 * 86400000));
  if (weeks === 0) return "本周";
  if (weeks === -1) return "上周";
  if (weeks === 1) return "下周";
  return weeks < 0 ? `${-weeks} 周前` : `${weeks} 周后`;
}

function inWeek(iso, r) {
  return iso >= r.start && iso <= r.end;
}

function expClass(info) {
  if (!info) return "muted";
  if (info.level === "expired") return "exp-expired";
  if (info.level === "soon") return "exp-soon";
  return "muted";
}

function renderTab(state) {
  // 「我的」是填 Token、做同步的地方，即使还没有数据也必须能进，否则没法初始化。
  if (state.tab === "me") return renderSettings(state);
  if (!state.data) {
    const hasToken = !!(state.config && state.config.token);
    return `<section class="card">
      <h2>还没有数据</h2>
      <p class="muted">${hasToken ? "配置已就绪。点下面按钮，把仓库里的 data.json 拉下来。" : "先填好 Token（私有仓库的访问令牌），再读取远端。"}</p>
      <div class="actions">
        <button class="primary" data-action="sync-read">读取远端</button>
        <button class="secondary" data-action="goto-tab" data-tab="me">去「我的」填 Token</button>
      </div>
      ${state.message ? `<p class="muted">${esc(state.message)}</p>` : ""}
    </section>`;
  }
  switch (state.tab) {
    case "shop":
      return renderShop(state);
    case "recipes":
      return renderRecipes(state);
    case "fridge":
      return renderFridge(state);
    case "me":
      return renderSettings(state);
    default:
      return renderWeek(state);
  }
}

function renderWeek(state) {
  const data = state.data;
  const r = rangeOf(data, state.weekStart);
  const thisWeek = rangeOf(data);
  const today = todayISO(data.settings.budget.timezone);
  const weekName = weekLabel(r.start, thisWeek.start);
  const isCurrent = r.start === thisWeek.start;
  const isPast = r.end < today;
  const recipesById = new Map(data.recipes.map((x) => [x.id, x]));
  const foodsById = new Map(data.foods.map((x) => [x.id, x]));
  const soon = expiringBatches(data.inventoryBatches, today);
  // 「这道菜上次做是什么时候」：只算真正做过的（历史模块里那份判据），
  // 而且要「这天之前」的那一次 —— 今天做的这顿不算「上次」。
  const cookedDates = cookedDatesByRecipe(cookedEvents(data, { timeZone: data.settings.budget.timezone }));
  const lastHint = (recipeId, date) => {
    const prev = recipeId ? lastCookedBefore(cookedDates.get(recipeId), date) : null;
    return prev ? `<span class="muted"> · 上次 ${prev.slice(5)}</span>` : "";
  };
  const list = buildShoppingList({ meals: data.meals, recipes: data.recipes, foods: data.foods, batches: data.inventoryBatches, range: r, stores: data.settings.stores });
  const paid = data.purchases.filter((p) => inWeek(p.purchasedAt.slice(0, 10), r)).reduce((s, p) => s + (p.amountPence || 0), 0);
  // 已经买进来、但还没填实付价的那几笔：金额算不出来，不能再当成 £0 报「还剩多少」
  // 标了「库存·没花钱」的不算待补价：登记成库存就当免费
  const paidPending = data.purchases.filter(
    (p) => inWeek(p.purchasedAt.slice(0, 10), r) && p.amountPence == null && p.storeId !== "stock"
  ).length;
  const budget = data.settings.budget.weeklyPence;
  // 预算条：已付的钱和「还要买」的预计各占一段 —— 以前只画预计，实际花了多少看不出来
  const paidPence = paid;
  const remainPence = Math.max(0, list.budget.estimatedPence);
  const { spentPence, leftPence, over, paidPct, estimatePct } = budgetBar({
    budgetPence: budget,
    paidPence,
    estimatePence: remainPence
  });
  const moneyBar = `<div class="bar">
    <i class="paid${over ? " over" : ""}" style="width:${paidPct}%"></i>
    <i class="estimate${over ? " over" : ""}" style="width:${estimatePct}%"></i>
  </div>`;

  const days = r.days
    .map((d) => {
      const meal = data.meals.find((m) => m.date === d) || null;
      const isToday = d === today;
      // 拖动/对调：只有「还没做」的天能当起点和落点。
      // 外食 / 跳过 / 吃剩菜 / 已做完是你自己定的，不参与（要说清楚原因，别点了没反应）。
      const mealState = meal ? meal.state : null;
      const isCooking = !meal || mealState === "planned" || mealState === "cooking";
      const holdsDish = !!(meal && meal.recipeId && isCooking);
      const swapFrom = state.swapFrom || null;
      const dishLink = (recipe) =>
        recipe
          ? `<span class="link" data-action="edit-recipe-ingredients" data-id="${esc(recipe.id)}">${esc(recipe.name)}</span>`
          : "（食谱缺失）";
      // 这顿大概花多少钱：按参考价和实际用量折算（缺价的食材单独标出来）
      const dishCost = (recipe, servings) => {
        if (!recipe) return "";
        const cost = recipeCostPence(recipe, data.foods, servings);
        if (cost.pence <= 0 && !cost.unpriced) return "";
        // 点一下就进「这道菜多少钱」的二级页，看每样食材摊了多少钱
        return ` · <span class="link" data-action="dish-price" data-id="${esc(recipe.id)}" data-servings="${servings}">参考 ${formatPence(
          cost.pence
        )}${cost.unpriced ? `（${cost.unpriced} 项无价）` : ""}</span>`;
      };
      const stateButtons = (states) =>
        states
          .map(
            ([state, label]) =>
              `<button class="mini" data-action="set-meal" data-date="${d}" data-state="${state}">${label}</button>`
          )
          .join("");
      let body = '<span class="muted">未安排</span>';
      // 空白日：能一次点完的都摆出来（推荐 / 安排 / 不做了的三种），不用先进二级页
      let actions = `<button class="mini primary" data-action="suggest-day" data-date="${d}">推荐</button>
        <button class="mini" data-action="pick-recipe" data-date="${d}">安排</button>
        ${stateButtons([
          ["eating_out", "外食"],
          ["skipped", "跳过"],
          ["leftovers", "吃剩菜"]
        ])}`;

      if (meal) {
        const recipe = meal.recipeId ? recipesById.get(meal.recipeId) : null;
        if (meal.state === "planned" || meal.state === "cooking") {
          const servings = meal.actualServings != null ? meal.actualServings : data.settings.household.defaultServings;
          body = `<b>${dishLink(recipe)}</b><span class="muted"> · ${servings} 人份${dishCost(recipe, servings)}</span>${lastHint(
            meal.recipeId,
            d
          )}`;
          // 有菜的日子只留最常用的三个，其余收进「不做了…」，免得一排七个按钮
          actions = `
            <button class="mini primary" data-action="cook-meal" data-date="${d}">做完</button>
            <button class="mini" data-action="suggest-day" data-date="${d}">推荐</button>
            <button class="mini" data-action="pick-recipe" data-date="${d}">换</button>
            <button class="mini" data-action="day-actions" data-date="${d}">不做了…</button>`;
        } else if (meal.state === "done") {
          const servings = meal.actualServings != null ? meal.actualServings : data.settings.household.defaultServings;
          body = `<span class="done">已做：${dishLink(recipe)}</span><span class="muted">${dishCost(recipe, servings)}</span>`;
          actions = `<button class="mini" data-action="undo-cook" data-date="${d}">撤销做完</button>
            <button class="mini" data-action="pick-recipe" data-date="${d}">重新安排</button>`;
        } else if (meal.state === "eating_out") {
          body = '<span class="tag">外食</span>';
          actions = `<button class="mini" data-action="pick-recipe" data-date="${d}">改成做菜</button>
            <button class="mini" data-action="suggest-day" data-date="${d}">推荐</button>
            <button class="mini" data-action="day-actions" data-date="${d}">改状态…</button>`;
        } else if (meal.state === "skipped") {
          body = '<span class="muted">跳过</span>';
          actions = `<button class="mini" data-action="pick-recipe" data-date="${d}">改成做菜</button>
            <button class="mini" data-action="suggest-day" data-date="${d}">推荐</button>
            <button class="mini" data-action="day-actions" data-date="${d}">改状态…</button>`;
        } else if (meal.state === "leftovers") {
          body = '<span class="tag">吃剩菜</span>';
          actions = `<button class="mini" data-action="pick-recipe" data-date="${d}">改成做菜</button>
            <button class="mini" data-action="suggest-day" data-date="${d}">推荐</button>
            <button class="mini" data-action="day-actions" data-date="${d}">改状态…</button>`;
        }
      }

      // 对调模式：给能当落点的天一个明确的按钮（点按钮，不会跟「做完 / 换」这些按钮打架）
      let swapRow = "";
      if (swapFrom === d) {
        swapRow = `<div class="swap-row"><button class="mini" data-action="swap-cancel">✕ 取消对调</button></div>`;
      } else if (swapFrom && isCooking) {
        swapRow = `<div class="swap-row"><button class="mini primary" data-action="swap-target" data-date="${d}">⇄ 换到这天</button></div>`;
      }
      const classes = [
        "day-card",
        isToday ? "today" : "",
        holdsDish ? "draggable" : "",
        !isCooking ? "locked" : "",
        swapFrom === d ? "swap-source" : swapFrom && isCooking ? "swap-armed" : ""
      ]
        .filter(Boolean)
        .join(" ");

      return `<div class="${classes}" data-day="${d}" data-drop="${isCooking ? "1" : "0"}"${
        holdsDish ? ` data-drag-handle="${d}"` : ""
      }>
        <div class="day-head"><span class="day-name">${WEEKDAY_LABEL[weekdayIndex(d)]}</span><span class="day-date">${d.slice(5)}</span>${
        isToday ? '<span class="today-tag">今天</span>' : ""
      }<span class="day-head-right">${
        holdsDish
          ? `<button class="drag-grip" data-action="swap-start" data-date="${d}" title="对调这一天">⠿ 换</button>`
          : !isCooking
            ? '<span class="muted lock-note">不动</span>'
            : ""
      }</span></div>
        <div class="day-body">${body}</div>
        ${swapRow}
        <div class="day-actions">${actions}</div>
      </div>`;
    })
    .join("");

  return `
    <section class="card week-nav">
      <div class="row between">
        <button class="mini" data-action="week-prev">‹ 上一周</button>
        <span><b>${r.start.slice(5)} ~ ${r.end.slice(5)}</b> <span class="tag${isCurrent ? " star" : ""}">${weekName}</span></span>
        <button class="mini" data-action="week-next">下一周 ›</button>
      </div>
      ${
        isCurrent
          ? `<p class="muted">想看后面几周、提前把菜排上，点「下一周」。</p>`
          : `<div class="actions"><button class="mini" data-action="week-today">回到本周</button></div>
             <p class="muted">${
               isPast
                 ? "这一周已经过去了：这里只回看/补记，不会再给你推荐或重排。"
                 : `你在提前排 ${weekName}：排好之后到那一周买菜清单会自动跟上。`
             }</p>`
      }
    </section>
    <section class="card">
      <div class="row between"><h2>${isCurrent ? "本周预算" : `${weekName}预算`}</h2><span class="muted">周六 → 周五 · ${r.start.slice(5)} 至 ${r.end.slice(5)}</span></div>
      ${moneyBar}
      <p class="legend muted"><span><i class="dot paid"></i>已付 ${formatPence(paidPence)}</span><span><i class="dot estimate"></i>还要买 ${formatPence(
        remainPence
      )}（预计）</span></p>
      <div class="row budget-row">
        <span>已知合计 <b class="${over ? "over-text" : ""}">${formatPence(spentPence)}</b> / 预算 ${formatPence(budget)}${
          paidPending
            ? ` <button class="mini" data-action="pending-prices">＋${paidPending} 笔待补价 ›</button>`
            : ""
        }</span>
        <span class="${leftPence < 0 ? "over-text" : "muted"}">${
          paidPending
            ? "金额还不确定"
            : leftPence < 0
              ? `超出 ${formatPence(-leftPence)}`
              : `还剩 ${formatPence(leftPence)}`
        }</span>
      </div>
      ${
