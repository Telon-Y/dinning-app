:"2026-10-12T16:25:02.238Z","createdAt":"2026-10-12T16:25:02.238Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%95%AA%E8%8C%84%E7%BA%A2%E9%85%B1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.238Z"},"category":"荤菜"},{"id":"recipe_htc_18f6hc9","name":"瘦肉土豆片","baseServings":2,"ingredients":[{"foodId":"food_imp_esoi0j","amount":200,"unit":"g"},{"foodId":"food_potato","amount":200,"unit":"g"},{"foodId":"food_spring_garlic","amount":2,"unit":"个"},{"foodId":"food_cornflour","amount":5,"unit":"g"},{"foodId":"food_soy_sauce","amount":13,"unit":"g"},{"foodId":"food_imp_5vosw6","amount":2,"unit":"g"}],"steps":["土豆去皮、对半切开，再切成 2mm 的薄片，备用","蒜苗洗净，切成 1cm 的段，备用","瘦肉洗净切成 2mm 的薄片，放入碗中，加入 5g 生粉、5g 生抽、3g 老抽腌制十分钟，备用","瘦肉腌制时，烧一锅开水，将土豆片放入锅中，焯水， 5 分钟","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高","放入瘦肉，翻炒至变色，倒入蒜苗一起炒，蒜苗炒 20 秒","放入土豆，保持翻炒，加入 2g 食用盐、5g 生抽，","炒 3 分钟，盛盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.254Z","createdAt":"2026-10-12T16:25:02.254Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%98%A6%E8%82%89%E5%9C%9F%E8%B1%86%E7%89%87/%E7%98%A6%E8%82%89%E5%9C%9F%E8%B1%86%E7%89%87.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.254Z"},"category":"荤菜"},{"id":"recipe_htc_kase8k","name":"白菜猪肉炖粉条","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":300,"unit":"g"},{"foodId":"food_imp_wnqgzr","amount":500,"unit":"g"},{"foodId":"food_potato","amount":50,"unit":"g"},{"foodId":"food_imp_vl5koi","amount":10,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":5,"unit":"g"},{"foodId":"food_imp_5vosw6","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"}],"steps":["锅内烧水，水开后放入干粉条，煮 5 分钟后同水一起倒出容器中，盖上盖子继续浸泡泡 备用","五花肉切 3mm 的肉片，备用","大白菜嫩叶与白菜帮子分开切成 2 份菜片，备用","热锅，锅内放入 10ml - 15ml 食用油。等待 10 秒让油温升高","放入五花肉，保持翻炒至肉变色","加入老抽，炒 1 分钟，给肉上色","加入白菜帮子，加入食用盐、生抽，炒一分钟","加水没过所有食材，加入鸡精 ，十三香，沸腾后，将火调小然后等待 20 分钟","粉条滤水切成小段放入碗中 备用","加入白菜嫩叶，炒匀后将粉条放在菜上方，加盖再煮 5 分钟","尝味、关火，收汁"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.270Z","createdAt":"2026-10-12T16:25:02.270Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%99%BD%E8%8F%9C%E7%8C%AA%E8%82%89%E7%82%96%E7%B2%89%E6%9D%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.270Z"},"category":"荤菜"},{"id":"recipe_htc_1enjkcv","name":"空气炸锅脆皮现腌炸鸡","baseServings":2,"ingredients":[{"foodId":"food_imp_1sjye6q","amount":6,"unit":"个"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_milk","amount":5,"unit":"ml"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_fhq4ly","amount":13,"unit":"g"},{"foodId":"food_imp_uf5y12","amount":10,"unit":"g"},{"foodId":"food_onion","amount":5,"unit":"g"},{"foodId":"food_imp_1g3ukbz","amount":5,"unit":"g"},{"foodId":"food_imp_xf24bs","amount":60,"unit":"g"},{"foodId":"food_cornflour","amount":30,"unit":"g"},{"foodId":"food_imp_9dmuwc","amount":1,"unit":"g"},{"foodId":"food_veg_oil","amount":5,"unit":"ml"}],"steps":["鸡翅中清洗后擦干水分，每个鸡翅两面各划 2 刀，方便入味。","调制腌料：生抽 15ml、蒜粉 8g、红甜椒粉 5g、洋葱粉 3g、黑胡椒粉 3g，牛奶或希腊酸奶 5ml搅拌均匀。","将腌料和鸡翅中一起放到大 zip 保鲜袋里充分搅拌按摩，在冰箱里静置一晚。","裹粉：中筋面粉 60g、淀粉 30g、蒜粉 5g、红甜椒粉 5g、洋葱粉 2g、黑胡椒粉 2g、泡打粉 1g搅拌均匀。","裹浆：鸡蛋 1 个，牛奶或水 5ml，充分打散。","裹粉：将鸡翅中抖干水分，放入裹粉中轻轻按压，抖落多余的粉，一旁静置 10 分钟。","裹浆：如想要更饱满的外壳，可以再裹一层浆，然后重复裹粉步骤。","将裹粉静置后的鸡翅放入裹浆，然后轻轻抖落多余的浆。","再次放入裹粉，轻轻按压，抖落多余的粉。","一旁静置 20 分钟。","空气炸锅预热到 180°C，预热 5 分钟。","炸篮内刷薄油，鸡皮面朝下，鸡翅上喷或者刷薄油。","设定空气炸锅 180°C，先炸 10 分钟。","打开炸篮翻面，在鸡翅表面补喷或者刷薄油，再以 180°C 炸 6 分钟。","观察鸡皮颜色，并用牙签扎一下最厚的部分，看是否有血水流出。","如需要再以 200°C 炸 1-2 分钟补脆上色。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.281Z","createdAt":"2026-10-12T16:25:02.281Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%A9%BA%E6%B0%94%E7%82%B8%E9%94%85%E8%84%86%E7%9A%AE%E7%8E%B0%E8%85%8C%E7%82%B8%E9%B8%A1/%E7%A9%BA%E6%B0%94%E7%82%B8%E9%94%85%E8%84%86%E7%9A%AE%E7%8E%B0%E8%85%8C%E7%82%B8%E9%B8%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.281Z"},"category":"荤菜"},{"id":"recipe_htc_8179t8","name":"粉蒸肉","baseServings":3,"ingredients":[{"foodId":"food_pork_belly","amount":250,"unit":"g"},{"foodId":"food_imp_qxbd4m","amount":50,"unit":"g"},{"foodId":"food_soy_sauce","amount":12.5,"unit":"ml"},{"foodId":"food_shaoxing","amount":7.5,"unit":"ml"},{"foodId":"food_doubanjiang","amount":5,"unit":"g"},{"foodId":"food_ginger","amount":5,"unit":"g"},{"foodId":"food_garlic","amount":5,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2.5,"unit":"g"},{"foodId":"food_potato","amount":150,"unit":"g"},{"foodId":"food_imp_1v0xmfu","amount":1000,"unit":"ml"}],"steps":["将五花肉洗净，切成长 5cm、宽 3cm、厚度 0.5cm 的肉片","将姜、蒜切成颗粒直径不大于 1mm 的细末","取一大碗，放入切好的五花肉、15ml 生抽、10ml 老抽、15ml 料酒、10g 郫县豆瓣酱、10g 姜末、10g 蒜末、5g 白砂糖","用筷子搅拌均匀后，盖上保鲜膜，室温静置腌制 30 分钟","腌制完成后，加入 100g 蒸肉米粉，继续翻拌 2 分钟，确保每片肉都均匀裹粉","土豆去皮，切片厚度控制在 0.8cm，片面积为 5cm x 5cm，重量控制在 300g","在直径 20cm 的深碗底部铺满土豆片，尽量无重叠","将拌好粉的五花肉均匀铺在土豆片上，压实","蒸锅中加入 2000ml 清水，开火加热至水面持续冒泡","将装好食材的碗放入蒸锅内，盖好锅盖","保持中火蒸 60 分钟","时间结束后，用筷子插入肉块中央，若能轻松穿透并无明显阻力，则表明蒸熟","若未达到此状态，则继续加热 10 - 15 分钟，直至肉质软烂，油脂渗出","取出盛盘，即可食用"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.304Z","createdAt":"2026-10-12T16:25:02.304Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%B2%89%E8%92%B8%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.304Z"},"category":"荤菜"},{"id":"recipe_htc_iepa0p","name":"糖醋排骨","baseServings":2,"ingredients":[{"foodId":"food_imp_60qvl3","amount":300,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":30,"unit":"g"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":5,"unit":"ml"},{"foodId":"food_imp_157q8t2","amount":2,"unit":"g"},{"foodId":"food_ginger","amount":2,"unit":"个"},{"foodId":"food_imp_13s7up","amount":2,"unit":"g"},{"foodId":"food_tomato_puree","amount":10,"unit":"g"},{"foodId":"food_imp_124i6bx","amount":5,"unit":"ml"},{"foodId":"food_imp_d0rxnp","amount":0.5,"unit":"g"}],"steps":["排骨与姜片放入冷水中，大火加热至水沸腾、出现大量泡沫后转中火，待水持续沸腾时再转小火焯水 2–3 分钟，捞出备用。","用开水反复清洗排骨 2–3 遍，确保彻底去除血沫。","在锅中倒入足够量的食用油进行深炸，待油温升至 170°C 后，下排骨炸制 3–5 分钟，直至表面略呈金黄色，捞出控油。","另取干净锅，置于小火上加热 50 ml 热水，加入白砂糖 30 g，轻轻搅拌直至糖完全溶解，并略呈淡黄色。此步骤的重点在于观察糖溶解情况，无需过分依赖颜色变化。","将炸好的排骨倒入炒制糖水的锅中，迅速翻炒 30 秒后，依次加入香醋 5 ml、生抽 5 ml、蚝油 5 ml、鸡精 2 g、番茄酱 10 g、五香粉 0.5 g，再次翻炒 30 秒，使调料均匀裹覆排骨，然后加入开水至刚好没过排骨。","用大火将锅中液体煮沸后，加入老抽 5 ml 进行上色，并快速收汁；若排骨块较大，可转小火焖煮 5–10 分钟以便更好地入味，切勿采用中火长时间炖煮 20 分钟，以免损伤口感。","起锅装盘，撒上芝麻 2 g，即可享用。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.317Z","createdAt":"2026-10-12T16:25:02.317Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%B3%96%E9%86%8B%E6%8E%92%E9%AA%A8/%E7%B3%96%E9%86%8B%E6%8E%92%E9%AA%A8.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.318Z"},"category":"荤菜"},{"id":"recipe_htc_1gj581t","name":"红烧猪蹄","baseServings":4,"ingredients":[{"foodId":"food_imp_1h7wbzn","amount":2,"unit":"个"},{"foodId":"food_veg_oil","amount":30,"unit":"ml"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_ginger","amount":5,"unit":"个"},{"foodId":"food_scallion","amount":0.5,"unit":"个"},{"foodId":"food_imp_pzcj3l","amount":1,"unit":"个"},{"foodId":"food_shaoxing","amount":30,"unit":"ml"},{"foodId":"food_soy_sauce","amount":40,"unit":"ml"},{"foodId":"food_salt","amount":8,"unit":"g"},{"foodId":"food_imp_tk77zc","amount":4,"unit":"个"}],"steps":["冷水锅中放入热心摊主剁好的猪蹄，加入 20 ml 料酒与葱姜，煮 15 分钟去掉血腥","热锅冷油，倒入 30ml 食用油，放入 7-8 粒冰糖，开小火，熬成糖色，期间用锅铲把冰糖压碎，大概熬 2 分钟","熬成糖色后，放入焯过水的猪蹄，继续小火，翻炒猪蹄，直至所有猪蹄两面微黄","加入香叶 2 片、桂皮 1 块、八角 4 个、生抽 20 ml、老抽 20 ml、料酒 10 ml、姜 3 片、盐 8 克，转中火、继续翻炒 1 分钟","加入开水或者冷水，水需要没过猪蹄，盖上锅盖，大火烧开，烧开之后关火","把锅内的食材全部倒入高压锅中，高压锅中需要 15 分钟","15 分钟之后，把高压锅的食材倒入炒锅中，开大火收汁，此时可用筷子尝下味道、淡的话可以加 2~3g 盐","大火收汁时长根据锅中的水来算，一般 30 秒即可，多留点也无碍、红烧猪蹄汤也是很下饭的"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.345Z","createdAt":"2026-10-12T16:25:02.345Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%BA%A2%E7%83%A7%E7%8C%AA%E8%B9%84/%E7%BA%A2%E7%83%A7%E7%8C%AA%E8%B9%84.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.345Z"},"category":"荤菜"},{"id":"recipe_htc_1uqxyc4","name":"南派红烧肉","baseServings":3,"ingredients":[{"foodId":"food_veg_oil","amount":100,"unit":"ml"},{"foodId":"food_ginger","amount":6,"unit":"个"},{"foodId":"food_scallion","amount":30,"unit":"g"},{"foodId":"food_garlic","amount":25,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":30,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_shaoxing","amount":30,"unit":"ml"},{"foodId":"food_imp_lb8cxy","amount":4,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":3,"unit":"个"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":10,"unit":"g"}],"steps":["猪五花肉先不切小块，切成能放入锅中的大块即可","生姜切片","开水烧开","凉水自来水即可","小葱小葱白色的部分葱白切成小段","蒜中间切开，不要拍扁，否则难以捞出以至最后收汁时影响味道","请将辅料分为两个\"预备包\"：","A包：2 片姜、2 段葱段。","B包：剩下的 4 片姜、葱白、蒜瓣、花椒、八角、香叶，统一放入一个小碗中备用。","凉水锅中放入五花肉大块，加入 20ml 料酒 与 A包，煮 15 分钟去掉血腥，捞出来后洗干净；","将焯过水的五花肉捞出，稍微放凉，切成边长 3cm × 3cm × 3cm 的正方体块","另起锅炒糖色，注意：在此菜谱中，请采用其中提到的\"操作 2\"来制作，即在糖液起密集小泡时，迅速将 B包倒入锅中爆香。","爆出香味后，先不要加开水，而是立刻将焯过水的五花肉倒入锅中大火翻炒，让肉块均匀裹上糖色并煸炒出油脂。待闻到肉香后，再倒入开水至没过全部肉，盖上锅盖，转中小火炖煮 50 分钟-60 分钟；","加入 10ml 料酒；","盖上锅盖煮至沸腾后，每隔 25 分钟打开盖子将浮在表面的油和沫捞出；","当水的高度减至肉最高的高度与锅底高度的 3/5 时，转中火，并捞出除肉和水以外的所有辅料，开始收汁；","打开锅盖，待汤汁快没有的时粘稠状出锅；"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.367Z","createdAt":"2026-10-12T16:25:02.367Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%BA%A2%E7%83%A7%E8%82%89/%E5%8D%97%E6%B4%BE%E7%BA%A2%E7%83%A7%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.367Z"},"category":"荤菜"},{"id":"recipe_htc_17qw5x8","name":"简易红烧肉","baseServings":3,"ingredients":[{"foodId":"food_ginger","amount":6,"unit":"个"},{"foodId":"food_imp_uqqghn","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":25,"unit":"ml"},{"foodId":"food_shaoxing","amount":5,"unit":"ml"},{"foodId":"food_imp_lb8cxy","amount":3,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":2,"unit":"个"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_pork_belly","amount":1500,"unit":"g"},{"foodId":"food_imp_1vl6467","amount":1,"unit":"个"},{"foodId":"food_imp_k3b25x","amount":1,"unit":"个"}],"steps":["猪五花肉切大块","豆皮切 2cm 的宽度","生姜切片","水烧开","鹌鹑蛋煮熟并用叉子/牙签扎孔","大葱大葱白色的部分葱白","冷水锅中放入切好的猪五花肉，加入料酒与葱姜，煮 15 分钟去掉血腥","锅中放入两片生姜提味","开中小火后直接加入五花肉，不需要放入食用油，每块五花肉六个面都煎一下，煎至出油即可","将煎出的油倒出备用，并将五花肉推至一边，加入 15g 冰糖，翻炒至冰糖融化；","融化后将五花肉与冰糖炒至融合上色，加入","生抽 10ml","老抽 15ml","料酒 5ml","翻炒至上色；","加入烧好的开水炖煮 40 分钟，并放入","生姜 2 片","香叶 3 片","八角 2 个","盖上锅盖煮至沸腾后，加入煮好扎好孔的鹌鹑蛋和豆皮，开中小火，等待 40 分钟。；","打开锅盖，待汤汁快没有的时候开大火收汁；","加入 2-3g 盐，翻炒一下，就可以出锅了。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.379Z","createdAt":"2026-10-12T16:25:02.379Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%BA%A2%E7%83%A7%E8%82%89/%E7%AE%80%E6%98%93%E7%BA%A2%E7%83%A7%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.379Z"},"category":"荤菜"},{"id":"recipe_htc_10p7f5t","name":"红烧鸡翅","baseServings":4,"ingredients":[{"foodId":"food_imp_1ah0m6f","amount":500,"unit":"g"},{"foodId":"food_ginger","amount":4,"unit":"个"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_imp_lb8cxy","amount":1,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":1,"unit":"个"},{"foodId":"food_dried_chili","amount":2,"unit":"个"},{"foodId":"food_imp_uqqghn","amount":15,"unit":"g"},{"foodId":"food_shaoxing","amount":35,"unit":"ml"},{"foodId":"food_soy_sauce","amount":20,"unit":"ml"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":1,"unit":"g"},{"foodId":"food_imp_1u8783g","amount":3,"unit":"g"},{"foodId":"food_scallion","amount":5,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"}],"steps":["将鸡翅洗净。用刀在鸡翅厚处划三刀，背面扎一刀，便于入味。","如果鸡翅不新鲜，可在打完花刀之后用姜水泡 10-20 分钟。","将 10g 姜片、15g 葱段备好；3-4 瓣大蒜用刀拍散；1 片香叶、1 个八角、2 个干辣椒整理好备用。","起锅开火，锅中加入清水没过所有鸡翅，冷水下锅放入处理好的鸡翅，加入 20ml 黄酒或料酒、2 片姜片，开大火烧至沸腾，沸腾后保持大火继续煮 2-3 分钟，撇去浮沫。","煮好后将鸡翅捞出，用温水清洗 2 遍，彻底去除血沫，控干水分备用。","另起锅，开火烧热后放入 10-15ml 食用油。","待油温至 5 成热，加入 15g 冰糖，开大火将冰糖熬至完全融化，冰糖融化变色后转小火，继续炒至冰糖呈枣红色，立即放入控干水分的鸡翅，快速翻炒 1-2 分钟，使每只鸡翅均匀裹上糖色。","加入准备好的 1 片香叶、1 个八角、2 个干辣椒、剩下的 2 片姜片、15g 葱段、拍散的大蒜，继续煸炒 30 秒至香料香味完全释放。","沿锅边淋入 15ml 料酒或黄酒，15ml 生抽，快速翻炒 10 秒。","加入温水，水量以稍微没过所有鸡翅为准。","加入 5ml 老抽、3g 盐、2g 白糖、1g 胡椒粉，用炒勺轻轻搅拌均匀。","盖上锅盖，开中火烧煮 7-8 分钟。","打开锅盖，用筷子将锅中的香叶、八角、姜片、葱段、大蒜捡出丢弃。","转大火，保持不断翻炒，将汤汁烧至粘稠状态。","关火，将鸡翅盛入盘中，淋上锅中剩余的粘稠汤汁。","最后撒上 3g 白芝麻和 5g 小葱花，完成制作。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.396Z","createdAt":"2026-10-12T16:25:02.396Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%BA%A2%E7%83%A7%E9%B8%A1%E7%BF%85.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.396Z"},"category":"荤菜"},{"id":"recipe_htc_1dtnyk7","name":"老妈蹄花","baseServings":2,"ingredients":[{"foodId":"food_imp_1h7wbzn","amount":3,"unit":"个"},{"foodId":"food_imp_7qd6o8","amount":200,"unit":"g"},{"foodId":"food_imp_1xo5vum","amount":4,"unit":"g"},{"foodId":"food_imp_1q92hdi","amount":5,"unit":"g"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_garlic","amount":8,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":2,"unit":"g"},{"foodId":"food_soy_sauce","amount":25,"unit":"g"},{"foodId":"food_scallion","amount":10,"unit":"g"}],"steps":["200g 白芸豆提前一晚清水浸泡备用","准备猪前蹄，买菜的时候让师傅从中间劈开，用喷火枪去除毛囊，拿回家清洗","冷水锅中加入猪蹄、大葱段、姜片、料酒，焯水十分钟，撇去浮沫，捞出洗干净备用","高压锅中放入猪蹄、当归、白芷、白胡椒粉、姜片，上汽后压三十分钟，放入白芸豆，再压十分钟，这个时候如果汤底是奶白色，那么恭喜是正确的","揭盖后加入盐、鸡精、葱花调味","调制灵魂汁子：放入葱、蒜、小米椒，白胡椒粉、生抽、香醋、油泼辣子、花椒油、猪蹄原汤","灵魂汁子，浇给"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.427Z","createdAt":"2026-10-12T16:25:02.427Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%80%81%E5%A6%88%E8%B9%84%E8%8A%B1/%E8%80%81%E5%A6%88%E8%B9%84%E8%8A%B1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.427Z"},"category":"荤菜"},{"id":"recipe_htc_1fp6e8t","name":"老式锅包肉","baseServings":2,"ingredients":[{"foodId":"food_imp_1y5qoyk","amount":300,"unit":"g"},{"foodId":"food_shaoxing","amount":5,"unit":"ml"},{"foodId":"food_imp_1czt82d","amount":50,"unit":"g"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_carrot","amount":10,"unit":"g"},{"foodId":"food_imp_e0kjvc","amount":10,"unit":"g"},{"foodId":"food_imp_61hm4w","amount":5,"unit":"g"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_soy_sauce","amount":4,"unit":"g"},{"foodId":"food_imp_qq680p","amount":55,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":65,"unit":"g"},{"foodId":"food_cornflour","amount":1.5,"unit":"g"},{"foodId":"food_potato","amount":170,"unit":"g"},{"foodId":"food_veg_oil","amount":1000,"unit":"ml"},{"foodId":"food_imp_1igku8p","amount":5,"unit":"g"}],"steps":["处理猪肉：","将猪通脊肉切成厚度 8mm 的均匀肉片，去除白色筋膜。","用清水冲洗肉片，去除血水。","可选：加入小苏打 5g，抓匀，静置 5 分钟。","用清水冲洗 1-2 次，去除多余小苏打。","腌制肉片：","在肉片中加入盐 3g、料酒 5ml，拌匀，腌制 15 分钟。","挂浆：","方法一：","将土豆淀粉 170g 加入过量清水，搅匀，静置 60 分钟，等待淀粉沉降分层。","倒出上层全部的的清水，保留底部淀粉浆。","放入肉片，放入 5ml 清水，放入 3ml 食用油，搅拌均匀。","方法二：","将土豆淀粉 210g 和中筋面粉 70g 混合。","少量多次加入清水，搅拌至酸奶状，提起可拉丝，浆糊能在盆中堆积。","加入食用油 10ml，小苏打 1g，搅拌均匀。","将腌制好的肉片放入浆糊中，拌匀，使每片肉均匀裹上浆。","调制糖醋汁：","混合白糖 65g、白醋 55g、生抽 4g、盐 2g，搅拌均匀，备用。","可选：水 4g、玉米淀粉 1.5g，用于糖醋汁更加粘稠。","准备配菜：","大葱、姜、胡萝卜切丝，香菜切段，蒜切片。","炸制肉片：","第一次炸制：","锅中加入食用油，加热至 170℃。","将肉片逐片放入油中，炸至表面定型，表面挂浆不粘筷子，肉上浮，颜色浅黄， 30 秒，捞出备用。","第二次炸制：","油温升至 200℃。","将所有肉片放入油中，炸至外壳金黄酥脆， 30 秒，捞出备用。","第三次炸制：","油温升至 220℃。","将肉片快速复炸，直到能看到肉片黄里透红， 30 秒，增强酥脆度，捞出沥油。","炒制：","锅中留 20ml 底油， 倒入调好的糖醋汁，大火加热至沸腾，熬至汤汁粘稠， 30-60 秒。","可选：盛出 1/2 的糖醋汁，可以让后面翻炒更加方便","放入炸好的肉片、葱丝、蒜片、胡萝卜丝、香菜段，浇上前面盛出的糖醋汁，快速翻炒 3 次，使汤汁均匀裹在肉片上。","出锅装盘：","将锅包肉盛入盘中，撒上白熟芝麻，即可上桌。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.443Z","createdAt":"2026-10-12T16:25:02.443Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%80%81%E5%BC%8F%E9%94%85%E5%8C%85%E8%82%89/%E8%80%81%E5%BC%8F%E9%94%85%E5%8C%85%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.443Z"},"category":"荤菜"},{"id":"recipe_htc_19dbt3g","name":"肉饼炖蛋","baseServings":2,"ingredients":[{"foodId":"food_imp_182rd5h","amount":300,"unit":"g"},{"foodId":"food_eggs","amount":2,"unit":"个"},{"foodId":"food_shaoxing","amount":10,"unit":"ml"},{"foodId":"food_soy_sauce","amount":20,"unit":"ml"},{"foodId":"food_imp_1q92hdi","amount":5,"unit":"g"},{"foodId":"food_imp_9xv4vf","amount":10,"unit":"ml"}],"steps":["在碗中加入猪肉末、料酒、生抽、白胡椒粉、鸡蛋和芝麻香油，搅拌均匀。","将调好味的猪肉末铺在盘子里，肉末中间用勺子挖一个洞，往洞中打入 1 个鸡蛋。","锅中加水至 1/4 高度，水烧开后，将盘子放入锅中，盖上锅盖，蒸 15 分钟。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.458Z","createdAt":"2026-10-12T16:25:02.458Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%82%89%E9%A5%BC%E7%82%96%E8%9B%8B.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.458Z"},"category":"荤菜"},{"id":"recipe_htc_1inlgio","name":"腐乳肉","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":400,"unit":"g"},{"foodId":"food_imp_5qxuxg","amount":30,"unit":"g"},{"foodId":"food_imp_1u4yg1b","amount":15,"unit":"ml"},{"foodId":"food_imp_uqqghn","amount":25,"unit":"g"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"},{"foodId":"food_shaoxing","amount":15,"unit":"ml"},{"foodId":"food_imp_2cfz77","amount":15,"unit":"g"},{"foodId":"food_scallion","amount":5,"unit":"g"},{"foodId":"food_ginger","amount":10,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"}],"steps":["五花肉切成长宽 2.5 cm 的小块","冷水放料酒姜片，五花肉放入开火慢慢加入到水沸腾后捞出","玫瑰腐乳块和腐乳汁碾成泥，加冰糖、老抽调成酱汁","热锅冷油爆香葱姜，下肉块煸到金黄","倒入腐乳酱炒匀加热水焖煮","小火慢炖 40 分钟","大火收汁，看到汤汁冒浓稠鱼眼泡时关火"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.474Z","createdAt":"2026-10-12T16:25:02.474Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%85%90%E4%B9%B3%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.474Z"},"category":"荤菜"},{"id":"recipe_htc_xqdwl5","name":"芥末罗氏虾","baseServings":2,"ingredients":[{"foodId":"food_imp_1v2a9hb","amount":250,"unit":"g"},{"foodId":"food_garlic","amount":1,"unit":"个"},{"foodId":"food_imp_1c7705d","amount":20,"unit":"g"},{"foodId":"food_cornflour","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":30,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":5,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":3,"unit":"g"},{"foodId":"food_imp_kh9r1f","amount":15,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_uype7w","amount":1,"unit":"个"},{"foodId":"food_butter","amount":20,"unit":"g"},{"foodId":"food_veg_oil","amount":80,"unit":"ml"}],"steps":["处理虾：","将虾从背部切开，去除虾线和沙袋，也可从腹部切开，炸出来会胀开，成菜比较漂亮","用清水洗干净，控干水分后可拍上生粉，也可不拍","蒜蓉及碗汁处理：","将 2 颗大蒜切成蒜末","准备碗汁，放入生抽、蚝油、白糖、胡椒粉、盐，依据个人口味挤入芥末，加清水稀释后加入生粉化开","炒制过程：","锅热倒入食用油，大概能覆盖锅底","放入控干水分的罗氏虾，慢慢煎制","虾油煎出来后，加入准备好的蒜蓉及小米辣","闻到蒜蓉的香味后，加入黄油","黄油融化后翻拌均匀，加入准备好的碗汁","盖锅盖焖煮 2 分钟汤汁浓稠后出锅"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.490Z","createdAt":"2026-10-12T16:25:02.490Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%8A%A5%E6%9C%AB%E7%BD%97%E6%B0%8F%E8%99%BE/%E8%8A%A5%E6%9C%AB%E7%BD%97%E6%B0%8F%E8%99%BE.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.490Z"},"category":"荤菜"},{"id":"recipe_htc_1aks381","name":"茭白炒肉","baseServings":2,"ingredients":[{"foodId":"food_imp_6732qn","amount":2,"unit":"个"},{"foodId":"food_imp_1gy9300","amount":100,"unit":"g"},{"foodId":"food_cornflour","amount":15,"unit":"g"},{"foodId":"food_veg_oil","amount":30,"unit":"ml"},{"foodId":"food_imp_157q8t2","amount":5,"unit":"g"},{"foodId":"food_ginger","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":1,"unit":"个"},{"foodId":"food_shaoxing","amount":5,"unit":"ml"},{"foodId":"food_salt","amount":2,"unit":"g"}],"steps":["茭白切片，每片厚度 0.5 cm","瘦肉切条，厚度 0.3-0.5 cm，加入料酒、生粉、盐、水搅拌","姜切片、蒜头剁碎","起锅水烧开，放入茭白，水煮 60-90 S 后取出沥干","起锅，倒入 15 ml 油，倒入瘦肉，反复翻炒 60 S 取出","起锅，倒入 15 ml 油，倒入姜、蒜翻炒 30S，加入茭白 + 10ml 蚝油 + 5g 糖，搅匀备用。","热锅，锅内放入 15-20ml 食用油。","放入姜片和花椒，保持小火炸到姜片微微焦黄、花椒颜色变深。","用漏勺把姜片和花椒捞出丢弃，留底油。","保持中大火，将腌好的鸡腿丁平铺下锅，不要急着翻动。","等待 2-3 分钟让鸡腿丁底部煎出焦壳，再翻炒到所有面都变色、鸡肉完全断生。","下入大葱片，保持中大火翻炒 1 分钟炒出葱香。","倒入调好的料汁，翻炒均匀后盖上锅盖。","等待 2 分钟让料汁和葱香完全融合到鸡肉里。","开盖，下入小葱段和 2g 熟白芝麻，翻炒 5-10 秒即可关火出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.567Z","createdAt":"2026-10-12T16:25:02.567Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%91%B1%E7%83%A7%E9%B8%A1%E8%85%BF.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.567Z"},"category":"荤菜"},{"id":"recipe_htc_178vxc2","name":"蒜苔炒肉末","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":4,"unit":"个"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_imp_wbqh99","amount":1,"unit":"个"}],"steps":["蒜苔切成 5cm 小段，备用","五花肉切成 5mm * 5cm 丝状，备用","蒜瓣拍碎切成末，备用","热锅，锅内放入 10ml 食用油。等待 10 秒让油温升高","放入蒜末，中火翻炒 10 秒 将蒜末炒出香味","放入五花肉和 5ml 生抽，中火翻炒 30 秒 将肉炒熟并上色","将蒜苔放入锅内并加入 10ml 生抽，翻炒 30 秒","锅内加入 20g 水，中火翻炒 5 分钟 将蒜苔炒至稍稍变软","最后加入 2g 食盐，中火翻炒 30 秒，即可出锅装盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.583Z","createdAt":"2026-10-12T16:25:02.583Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%92%9C%E8%8B%94%E7%82%92%E8%82%89%E6%9C%AB.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.583Z"},"category":"荤菜"},{"id":"recipe_htc_1e99cyi","name":"蚂蚁上树","baseServings":2,"ingredients":[{"foodId":"food_imp_lypzfc","amount":80,"unit":"g"},{"foodId":"food_imp_182rd5h","amount":150,"unit":"g"},{"foodId":"food_doubanjiang","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"},{"foodId":"food_garlic","amount":10,"unit":"g"},{"foodId":"food_ginger","amount":5,"unit":"g"}],"steps":["红薯粉丝提前泡软，泡水时间为 20 分钟，备用","将蒜、姜分别剁碎，备用","锅烧热，加入 10ml 食用油，加入蒜末、姜末炒香","加入猪肉末翻炒至肉色发白且微微出油","加入郫县豆瓣酱，炒至红油析出","加入生抽和老抽，翻炒均匀","倒入 300ml 清水，煮沸","放入泡软沥干的粉丝，用筷子轻轻拨动防止粘连","中小火煮 5 分钟，直至粉丝完全吸收汤汁、呈现微微收干状态","依据口味可撒入小葱末，关火装盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.615Z","createdAt":"2026-10-12T16:25:02.615Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%9A%82%E8%9A%81%E4%B8%8A%E6%A0%91.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.615Z"},"category":"荤菜"},{"id":"recipe_htc_155ed11","name":"血浆鸭","baseServings":4,"ingredients":[{"foodId":"food_imp_37vkm3","amount":2000,"unit":"g"},{"foodId":"food_imp_r6l0iu","amount":250,"unit":"ml"},{"foodId":"food_ginger","amount":6,"unit":"个"},{"foodId":"food_imp_wfwue5","amount":6,"unit":"个"},{"foodId":"food_scallion","amount":2,"unit":"个"},{"foodId":"food_dried_chili","amount":1000,"unit":"g"},{"foodId":"food_imp_8jif6w","amount":50,"unit":"ml"},{"foodId":"food_imp_1lxgttf","amount":200,"unit":"ml"},{"foodId":"food_imp_1lauik0","amount":200,"unit":"ml"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"},{"foodId":"food_shaoxing","amount":30,"unit":"ml"},{"foodId":"food_salt","amount":8,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":5,"unit":"g"},{"foodId":"food_imp_1nf51h1","amount":1,"unit":"个"}],"steps":["鲜仔鸭肉切成 3cm 小块，加料酒、姜片，去除血水。","炒锅烧热，放入 100ml 食用油，大火待油烧开，放入腌制好的鲜鸭肉，不断翻炒。","待鸭肉完全变色，放入酒，再加入 200ml 开水，刚好淹没鸭肉即可，盖上锅盖中火煮 15 分钟。","水开之后，打开锅盖放入姜蒜，翻炒一遍，盖上锅盖持续加热 10 分钟。","打开锅盖放入辣椒，不断翻炒，待至肉眼可见辣椒炒软，放入鲜鸭血，此时需要不断翻炒，确保每块鸭肉和每片辣椒都有鸭血的浸润。","翻炒至肉眼可见鸭血均为黑色，加入盐，鸡精，香葱，再次翻炒一到二次即可。","出锅盛盘，上桌食用。"],"tags":["导入", amount":1,"unit":"个"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_ginger","amount":3,"unit":"个"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_soy_sauce","amount":2,"unit":"个"},{"foodId":"food_imp_1fxvmfu","amount":4,"unit":"g"},{"foodId":"food_imp_166fixj","amount":2.5,"unit":"ml"},{"foodId":"food_cornflour","amount":1,"unit":"个"},{"foodId":"food_imp_1ovbkph","amount":10,"unit":"g"}],"steps":["检查与清洗白鱔：","购买时已请鱼贩去内脏、刮去黏液并切成 5 厘米长的段。","回家后检查白鱔，冲洗干净，确保无残留黏液或杂质。","可选：用 3g 盐和 1 茶匙生粉轻搓白鱔段，腌制 5 分钟后冲洗干净，去腥并增加嫩滑口感。","准备酱汁：","在小碗中混合 1 汤匙豆豉、2 瓣蒜末、1.5 汤匙生抽、0.5 茶匙老抽、0.5 茶匙糖、0.5 茶匙麻油和 1 汤匙水，搅拌均匀。","若喜欢更浓郁的豉汁，可多加 0.5 汤匙豆豉。","摆盘：","将已切好的白鱔段平铺在耐热盘中，尽量不重叠。","将姜丝均匀撒在白鱔上。","将调好的豉汁均匀淋在白鱔上。","蒸制：","在蒸锅或电蒸炉中加入水 ，烧开。","将装有白鱔的盘子放入蒸锅，盖上锅盖。","用中大火蒸 8-10 分钟 ，至白鱔熟透但不过老 。","装饰与完成：","蒸好后取出，撒上葱丝和红椒丝 作装饰。","可再淋热麻油提升香气。","趁热上桌，搭配白饭享用。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.708Z","createdAt":"2026-10-12T16:25:02.708Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E8%B1%89%E6%B1%81%E8%92%B8%E7%99%BD%E9%B1%94/%E8%B1%89%E6%B1%81%E8%92%B8%E7%99%BD%E9%B1%94.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.708Z"},"category":"荤菜"},{"id":"recipe_htc_1kik80p","name":"贵州辣子鸡","baseServings":2,"ingredients":[{"foodId":"food_ginger","amount":2,"unit":"个"},{"foodId":"food_dried_chili","amount":500,"unit":"g"},{"foodId":"food_spring_garlic","amount":3,"unit":"个"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_potato","amount":2,"unit":"个"},{"foodId":"food_soy_sauce","amount":20,"unit":"ml"},{"foodId":"food_imp_1lxgttf","amount":0.5,"unit":"个"},{"foodId":"food_imp_1a433w1","amount":1000,"unit":"g"}],"steps":["在锅中加入和锅一半高度的油，将切成长条的土豆先炸至表面金黄然后捞出备用，等油温上至烤手时候将切好的鸡块放入锅中炸，并放入切好的生姜片和花椒","刚开始炸鸡的时候，油是浑浊的，因为鸡块里面有水的原因，等到  2-3 遍后放入大碗备用","排骨中加入鱼露、地瓜粉、鸡蛋黄 充分搅拌","将排骨一个一个放入锅中，保证每个不要粘在一起","全部放入后，每 30 S 用勺子来回两面翻转瘦肉块，直至排骨表面金黄","取出排骨，一分钟后倒入油锅中继续炸，直至瘦肉块表面出现焦黄后，取出放入大碗备用","准备一个小碗，加入蒜末、香醋、白砂糖、鱼露、番茄酱、葱花、芝麻搅拌均匀，倒入 5 ml 热油","将汤汁浇灌入排骨，在充分搅拌后倒入盘中"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.786Z","createdAt":"2026-10-12T16:25:02.786Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%86%89%E6%8E%92%E9%AA%A8/%E9%86%89%E6%8E%92%E9%AA%A8.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.786Z"},"category":"荤菜"},{"id":"recipe_htc_6kekwv","name":"青椒土豆炒肉","baseServings":2,"ingredients":[{"foodId":"food_imp_1i2hntx","amount":2,"unit":"个"},{"foodId":"food_potato","amount":2,"unit":"个"},{"foodId":"food_imp_13iazq4","amount":200,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_ginger","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_salt","amount":7,"unit":"g"},{"foodId":"food_soy_sauce","amount":6,"unit":"ml"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"},{"foodId":"food_potato","amount":5,"unit":"g"}],"steps":["青椒去除根蒂切小块，土豆去皮切 2mm 薄片，猪肉切 4mm 薄片，葱横纵切 3mm 小段，姜蒜去皮拍散剁碎末；土豆淀粉加入 15g 水搅拌均匀至水淀粉。","起锅烧油，加热至 7 成热放入猪肉片，缓缓翻滚炒至去肉红色，加入 3ml 酱油，翻炒肉片均匀上色，放入 2g 盐。","转 5 成油温，加入葱姜蒜炒 5 秒，然后加入土豆片，转 7 成油温均匀翻炒，加入 5ml 酱油和 2g 盐，炒至土豆断生，表面轻微焦黄。","转 8 成油温加入青椒，大火煸炒出锅气，反复均匀翻炒 1 分钟上色，最后在锅周围倒入水淀粉转 4 成火勾芡。","在外观*呈粘稠状态*后关火，盛盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.802Z","createdAt":"2026-10-12T16:25:02.802Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%9D%92%E6%A4%92%E5%9C%9F%E8%B1%86%E7%82%92%E8%82%89/%E9%9D%92%E6%A4%92%E5%9C%9F%E8%B1%86%E7%82%92%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Un 鸡爪冷水下锅，葱姜料酒焯水，水开，撇去浮沫。","加入香叶、八角、生抽、老抽，盖盖小火慢煮三十分钟。","捞出鸡爪，留一碗鸡汤备用。","起锅烧油，用小火炒香姜末、蒜末、小米椒，能吃辣再放点辣椒面。加入生抽、老抽、蚝油、五香粉、盐，炒出酱香味。","放入鸡爪，放一点盐调味，翻炒一两分钟，再倒入鸡汤，边炒边搅动。","放入鸡精提鲜，撒入葱段搅拌均匀即可出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.894Z","createdAt":"2026-10-12T16:25:02.894Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%A6%99%E8%BE%A3%E9%B8%A1%E7%88%AA%E7%85%B2/%E9%A6%99%E8%BE%A3%E9%B8%A1%E7%88%AA%E7%85%B2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.894Z"},"category":"荤菜"},{"id":"recipe_htc_196mhhp","name":"鱼香茄子","baseServings":1,"ingredients":[{"foodId":"food_imp_1u4vwvt","amount":2,"unit":"个"},{"foodId":"food_imp_182rd5h","amount":20,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_imp_1yrbk38","amount":5,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_imp_135y1u2","amount":10,"unit":"ml"},{"foodId":"food_cornflour","amount":100,"unit":"ml"},{"foodId":"food_doubanjiang","amount":20,"unit":"g"}],"steps":["将茄子切成条。","将肉切成肉沫，葱姜蒜切碎、小米椒切丁。","调鱼香汁：碗中放入盐、味精、糖、生抽、老抽、醋、水淀粉搅拌均匀。","锅中倒入 300ml 油，开小火，等油温七成热放入茄子炸两分钟，当茄子边缘微黄就捞出。多出的油可以盛出以后炒菜用。","锅中留 15-30ml 油，倒入肉沫炒至颜色变白就盛出来。","锅中倒入 15-30ml 油，放入豆瓣酱、葱白、姜、蒜炒香，然后倒入肉沫翻炒均匀。","加入 80-150ml 清水，倒入茄子、倒入料汁，爆炒入味收汁。最后放入葱翻炒均匀，就可以起锅了。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.927Z","createdAt":"2026-10-12T16:25:02.927Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%B1%BC%E9%A6%99%E8%8C%84%E5%AD%90/%E9%B1%BC%E9%A6%99%E8%8C%84%E5%AD%90.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.927Z"},"category":"荤菜"},{"id":"recipe_htc_sydueq","name":"麻辣香锅","baseServings":2,"ingredients":[{"foodId":"food_bok_choy","amount":455,"unit":"g"},{"foodId":"food_imp_jimbrh","amount":430,"unit":"g"},{"foodId":"food_tofu_silken","amount":152,"unit":"g"},{"foodId":"food_imp_i3x87y","amount":1,"unit":"个"},{"foodId":"food_dried_chili","amount":5,"unit":"g"},{"foodId":"food_imp_177s245","amount":110,"unit":"g"}],"steps":["烧开一锅水。","在开水中放入青菜，焯 5 分钟后盛出备用。","在开水中放入无骨肉，焯 4 分钟后盛出备用。","在开水中放入北京麻辣方便面，煮 2 分钟后盛出备用。","倒出开水，擦干锅具，放入 105 克食用油，大火加热 30 秒。","放入麻辣香锅调料，翻炒 20 秒。","放入干辣椒，翻炒 10 秒。","放入焯过的青菜，改中火，翻炒 3 分钟。","放入焯过的无骨肉，翻炒 3 分钟。","放入煮过的北京麻辣方便面，用筷子翻动 1 分钟。","关火，出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.958Z","createdAt":"2026-10-12T16:25:02.958Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%BA%BB%E8%BE%A3%E9%A6%99%E9%94%85.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.958Z"},"category":"荤菜"},{"id":"recipe_htc_dr0yfe","name":"黄油鸡","baseServings":4,"ingredients":[{"foodId":"food_chicken_thigh","amount":500,"unit":"g"},{"foodId":"food_yogurt","amount":80,"unit":"ml"},{"foodId":"food_ginger","amount":20,"unit":"g"},{"foodId":"food_garlic","amount":8,"unit":"个"},{"foodId":"food_dried_chili","amount":10,"unit":"g"},{"foodId":"food_imp_v6fbt8","amount":3,"unit":"g"},{"foodId":"food_salt","amount":8,"unit":"g"},{"foodId":"food_imp_194b7co","amount":15,"unit":"ml"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"},{"foodId":"food_tomato","amount":5,"unit":"个"},{"foodId":"food_onion","amount":1,"unit":"个"},{"foodId":"food_imp_1w7uhah","amount":30,"unit":"g"},{"foodId":"food_butter","amount":50,"unit":"g"},{"foodId":"food_imp_xt9wvp","amount":100,"unit":"ml"},{"foodId":"food_imp_15sm37n","amount":5,"unit":"g"},{"foodId":"food_imp_9fe3b","amount":3,"unit":"g"},{"foodId":"food_imp_y0wqeo","amount":3,"unit":"g"},{"foodId":"food_imp_7fysv4","amount":2,"unit":"g"},{"foodId":"food_imp_1eua51e","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"}],"steps":["在大碗中混合酸奶、生姜泥、大蒜泥、红辣椒粉、姜黄粉、盐、柠檬汁","放入鸡肉块，充分裹上腌料","盖保鲜膜，冷藏腌制至少 1 小时","在平底锅中倒入 15ml 食用油，大火加热","将腌好的鸡肉块放入锅中","大火煎至*两面焦黄*，鸡肉不需要完全煮熟","盛出备用","在锅中放入番茄块、洋葱块、腰果、生姜、大蒜和水 100ml","大火煮沸后转中火，煮 15 分钟，直至*所有材料完全软烂*","稍微冷却后，倒入搅拌机中打成*细腻顺滑的泥状*","用滤网过滤一遍，去除渣滓，得到顺滑的酱汁，备用","在炒锅中放入黄油 50g，中火加热融化","倒入过滤好的番茄酱汁","加入红辣椒粉 5g、香菜粉 5g、孜然粉 3g、盐 5g","翻炒 3-5 分钟，直至*酱汁颜色变深且油花浮出*","放入烤好的鸡肉块，翻拌均匀","加入糖 10g，搅拌","倒入淡奶油 100ml，搅拌均匀","小火炖 10-12 分钟，使鸡肉完全熟透且吸收酱汁","加入印度综合香料粉 3g、小豆蔻粉 2g","撒入干葫芦巴叶 3g","搅拌均匀，关火","盛盘，可额外淋上少量淡奶油作为装饰"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.972Z","createdAt":"2026-10-12T16:25:02.972Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%BB%84%E6%B2%B9%E9%B8%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.972Z"},"category":"荤菜"},{"id":"recipe_htc_14p7s4r","name":"黄焖鸡","baseServings":2,"ingredients":[{"foodId":"food_chicken_thigh","amount":2,"unit":"个"},{"foodId":"food_imp_h2g6i1","amount":5,"unit":"个"},{"foodId":"food_imp_1i2hntx","amount":2,"unit":"个"},{"foodId":"food_ginger","amount":2,"unit":"个"},{"foodId":"food_dried_chili","amount":5,"unit":"个"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_shaoxing","amount":10,"unit":"ml"},{"foodId":"food_imp_1q92hdi","amount":5,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"},{"foodId":"food_potato","amount":1,"unit":"个"}],"steps":["鸡腿洗净，剁成4cm大小的块","生姜切片、干辣椒切成小圈","香菇切片，青椒切成细长的马蹄状，若为干香菇，洗净灰尘后泡一晚上并留香菇水备用","若有土豆，切为与鸡肉大小类似的滚刀块","炒糖色：锅里倒入底油，冷油时放入白糖","小火慢慢加热，待油温逐渐升高，白糖开始融化并变成较深的棕色","迅速倒入鸡块，转大火，快速翻炒！烹入料酒，继续翻炒片刻","将生姜片和干辣椒倒入","放入酱油，炒匀","倒入香菇水或清水，以能淹住鸡肉为准","倒入香菇片，白胡椒粉，盐，土豆","翻炒均匀后，盖上锅盖焖煮，转中小火15——20分钟，有条件可以转至砂锅","待鸡肉软烂，汤汁浓稠后，最后放入青椒","放入味精，兜炒均匀后，关火！青椒基本断生即可，不要炒时间久了"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.990Z","createdAt":"2026-10-12T16:25:02.990Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%BB%84%E7%84%96%E9%B8%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.990Z"},"category":"荤菜"},{"id":"recipe_htc_6gol1d","name":"黄瓜炒肉","baseServings":2,"ingredients":[{"foodId":"food_imp_ezw0nx","amount":1,"unit":"个"},{"foodId":"food_imp_13iazq4","amount":335,"unit":"g"},{"foodId":"food_veg_oil","amount":50,"unit":"g"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":5,"unit":"g"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_imp_uype7w","amount":1,"unit":"个"}],"steps":["将猪瘦肉切片，放入碗中，倒入食用油 10 克，生抽，搅拌均匀，腌制 10 分钟","将黄瓜切去 5 厘米的头尾，剩余部分斜着切成 0.5 厘米的薄片","将黄瓜倒入碗中，撒上盐 8 克，搅拌均匀，腌制 5 分钟","将蒜瓣去皮，压扁，切成蒜末备用","将小米辣去丁切分成均匀 0.5 厘米的段状","热锅，倒油 40 克，等油温到冒烟，放入蒜蓉小米辣翻炒 5 次","放入腌制好的猪瘦肉，翻炒至肉熟变色","放入黄瓜，加入盐 2 克，大火翻炒均匀半分钟，出锅","如果无法保证大火，可能会有点生。可以考虑增加到 50 秒。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.006Z","createdAt":"2026-10-12T16:25:03.006Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E9%BB%84%E7%93%9C%E7%82%92%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.006Z"},"category":"荤菜"},{"id":"recipe_htc_xnauwx","name":"黔式腊肠娃娃菜","baseServings":2,"ingredients":[{"foodId":"food_imp_1a9k4e6","amount":200,"unit":"g"},{"foodId":"food_imp_imb17x","amount":300,"unit":"g"}],"steps":["锅内放入 750ml 水，开火加热至沸腾","放入腊肠，计时 13 分钟","放入娃娃菜，计时 2 分钟","关火，夹出腊肠及娃娃菜","娃娃菜切段、腊肠切片，装盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.03 dId":"food_garlic","amount":4,"unit":"个"}],"steps":["在碗中混合烤鹰嘴豆粉 120g、切碎的洋葱、青辣椒、生姜","加入孜然籽 3g、芝麻 5g、红辣椒粉 3g、印度黑盐 3g、盐 3g","加入芥末油 15ml、柠檬汁 10ml、切碎的香菜叶","充分混合均匀，馅料应呈松散但可捏合的状态，备用","将全麦面粉 200g 放入大碗中","逐渐加入温水，边加边揉，揉成*光滑柔软*的面团","面团静置 15 分钟","将面团分成 8 个等大的小剂子","每个剂子用手压成一个直径 8cm 的圆形面片","在面片中央放入 15g 馅料","将面片四周收拢包住馅料，封口处捏紧，搓成圆球","烤箱预热至 200°C","将利提放在烤盘上，烤 25-30 分钟，期间翻面一次，直至*表面金棕色且有裂纹*","如果使用明火：将利提直接放在炭火或煤气灶小火上烤，不断翻转，直至*均匀焦黄*","烤好后趁热将每个利提表面涂上酥油，使其*浸润吸收*","将茄子、番茄、土豆放在明火上直接烤，或放入 200°C 烤箱烤 20-25 分钟，直至*外皮焦黑、内部完全软烂*","烤好后去皮，将茄子、番茄、土豆分别用叉子或手捣碎","将捣碎的蔬菜混合在一起","加入切碎的大蒜、青辣椒、盐 4g、芥末油 15ml","充分搅拌混合均匀","撒上香菜叶装饰","将利提摆盘，旁边放上巧卡蔬菜泥","趁热食用，用手掰开利提蘸巧卡"],"tags":["导入"],"status":"complete","publishedAt":"2026-10-12T16:25:03.597Z","createdAt":"2026-10-12T16:25:03.597Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E5%88%A9%E6%8F%90%E5%B7%A7%E5%8D%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.597Z"},"category":"主食"},{"id":"recipe_htc_1dylsn9","name":"印度烤饼","baseServings":3,"ingredients":[{"foodId":"food_imp_xf24bs","amount":300,"unit":"g"},{"foodId":"food_yogurt","amount":60,"unit":"ml"},{"foodId":"food_imp_7nxsev","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"},{"foodId":"food_butter","amount":30,"unit":"g"},{"foodId":"food_imp_9dybko","amount":5,"unit":"g"},{"foodId":"food_imp_1vjxfe2","amount":10,"unit":"g"},{"foodId":"food_garlic","amount":3,"unit":"个"}],"steps":["将干酵母 3g 和糖 10g 溶解在 100ml 温水中","静置 5 分钟，直至*表面冒出细泡沫*","在大碗中放入中筋面粉 300g 和盐 5g，混合均匀","倒入酵母水、酸奶 60ml 和食用油 15ml","用手揉成*光滑柔软*的面团","揉面 8-10 分钟","在面团表面涂 3ml 油防止干裂","用湿布或保鲜膜盖住碗口","放置在温暖处发酵 至少 1 小时，直至*面团膨胀至两倍大*","将发酵好的面团取出，轻揉排气","分成 6 个等大的小剂子","取一个剂子，手上沾 3ml 面粉或油","用擀面杖擀成长椭圆形或泪滴形面饼，厚度 4-5mm","如果制作蒜蓉烤饼：在面饼表面撒上切碎的大蒜和香菜叶，轻轻擀压使其嵌入面饼","可在面饼表面撒上芝麻","将平底锅大火加热至*非常烫*","在面饼一面刷一层薄薄的水","将刷水一面朝下放入锅中","烤 1-2 分钟，直至*底面出现金棕色斑点且面饼开始鼓泡*","翻面，继续烤 1-2 分钟","如果有煤气灶：翻面后可用夹子夹起面饼，将其直接放在明火上烤 数秒钟，面饼会迅速鼓起","取出后立即在表面涂上酥油或黄油","烤箱预热至最高温度","将面饼放在烤盘上","烤 3-5 分钟，直至*表面金黄且鼓起*","取出后涂上酥油或黄油","趁热食用","适合搭配任何印度咖喱，如黄油鸡、红芸豆咖喱等"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:03.613Z","createdAt":"2026-10-12T16:25:03.613Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E5%8D%B0%E5%BA%A6%E7%83%A4%E9%A5%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.613Z"},"category":"主食"},{"id":"recipe_htc_1p0fj8u","name":"印度焖饭","baseServings":4,"ingredients":[{"foodId":"food_chicken_thigh","amount":500,"unit":"g"},{"foodId":"food_yogurt","amount":100,"unit":"ml"},{"foodId":"food_ginger","amount":15,"unit":"g"},{"foodId":"food_garlic","amount":6,"unit":"个"},{"foodId":"food_dried_chili","amount":5,"unit":"g"},{"foodId":"food_imp_v6fbt8","amount":3,"unit":"g"},{"foodId":"food_imp_y0wqeo","amount":5,"unit":"g"},{"foodId":"food_salt","amount":15,"unit":"g"},{"foodId":"food_imp_194b7co","amount":15,"unit":"ml"},{"foodId":"food_imp_nqv7wy","amount":300,"unit":"g"},{"foodId":"food_imp_1e4ic63","amount":2,"unit":"个"},{"foodId":"food_imp_7fysv4","amount":3,"unit":"g"},{"foodId":"food_imp_1xm7x1r","amount":4,"unit":"个"},{"foodId":"food_imp_12j5iyo","amount":1,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":1,"unit":"个"},{"foodId":"food_onion","amount":3,"unit":"个"},{"foodId":"food_veg_oil","amount":50,"unit":"ml"},{"foodId":"food_imp_19n49p7","amount":30,"unit":"g"},{"foodId":"food_imp_13qrjr3","amount":0.5,"unit":"g"},{"foodId":"food_imp_1uem6r2","amount":20,"unit":"g"},{"foodId":"food_imp_1vjxfe2","amount":20,"unit":"g"},{"foodId":"food_dried_chili","amount":3,"unit":"个"}],"steps":["在大碗中混合酸奶、磨碎的生姜和大蒜、红辣椒粉、姜黄粉、印度综合香料粉、盐、柠檬汁","放入鸡肉块，均匀裹上腌料","盖保鲜膜，冷藏腌制至少 1 小时","将藏红花 0.5g 放入 30ml 温牛奶中浸泡 15 分钟，备用","在锅中倒入 50ml 食用油，中火加热","放入洋葱薄片，翻炒至*深金棕色且酥脆*","捞出炸洋葱，用厨房纸吸油，备用","将浸泡好的巴斯马蒂香米沥干","在大锅中烧开 2000ml 水","加入月桂叶、小豆蔻、丁香、肉桂棒、八角和盐 10g","放入米饭，大火煮 5-6 分钟，直至*米粒七成熟*","立即沥干，丢弃全香料，备用","在厚底锅底部涂抹酥油 15g","第一层：将腌制好的鸡肉均匀铺在锅底","第二层：铺上一半的半熟米饭","撒上一半的炸洋葱、薄荷叶、香菜叶、青辣椒","第三层：铺上剩余的米饭","撒上剩余的炸洋葱、薄荷叶、香菜叶","将藏红花牛奶均匀淋在最上层米饭表面","放上剩余的酥油 15g","密封锅盖：用面粉加水和成面团条，沿锅口边缘封住缝隙，或用锡纸包裹锅口再盖锅盖","先用大火加热 3 分钟，直至锅内开始冒蒸汽","然后转最小火，焖 25-30 分钟","关火后不要开盖，再焖 5 分钟","开盖，用大铲子从底部轻轻翻拌，使各层混合均匀","盛盘，搭配酸奶食用"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.628Z","createdAt":"2026-10-12T16:25:03.628Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E5%8D%B0%E5%BA%A6%E7%84%96%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.628Z"},"category":"主食"},{"id":"recipe_htc_1h5qatt","name":"可乐炒饭","baseServings":1,"ingredients":[{"foodId":"food_rice","amount":200,"unit":"g"},{"foodId":"food_imp_1ez6si2","amount":160,"unit":"ml"},{"foodId":"food_eggs","amount":3,"unit":"个"},{"foodId":"food_imp_1xxstfh","amount":20,"unit":"g"},{"foodId":"food_veg_oil","amount":25,"unit":"ml"},{"foodId":"food_soy_sauce","amount":22.5,"unit":"ml"},{"foodId":"food_doubanjiang","amount":7.5,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":5,"unit":"ml"},{"foodId":"food_scallion","amount":5,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":1,"unit":"g"}],"steps":["将锅烧热后，加入 25 ml 油，放两个鸡蛋，煎至底部完全凝固","翻面，煎至两面完全凝固","关火，将鸡蛋取出，剪成 2-5 cm² 的小块后放回锅中","重新开火，倒入可乐、生抽、老抽、豆瓣酱、蚝油，搅拌均匀","加热到锅内液体剩 1/3，倒入米饭和火腿肠翻炒","翻炒均匀后，改小火，锅内食物中心挖一个洞，打入 1 个鸡蛋，盖上锅盖，焖 2 分钟","开盖翻炒至第三颗鸡蛋熟透，撒上葱花和胡椒粉，出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.645Z","createdAt":"2026-10-12T16:25:03.645Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E5%8F%AF%E4%B9%90%E7%82%92%E9%A5%AD.md","repository":"https://github.com/Anduin2017/ 6%84%8F%E5%BC%8F%E8%82%89%E9%85%B1%E9%9D%A2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.706Z"},"category":"主食"},{"id":"recipe_htc_1px3u3l","name":"手工水饺","baseServings":2,"ingredients":[{"foodId":"food_imp_1ezzi84","amount":200,"unit":"g"},{"foodId":"food_imp_1yqq412","amount":150,"unit":"ml"},{"foodId":"food_imp_9xv4vf","amount":2,"unit":"ml"},{"foodId":"food_imp_1gy9300","amount":250,"unit":"g"},{"foodId":"food_ginger","amount":3,"unit":"g"},{"foodId":"food_scallion","amount":15,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_kh9r1f","amount":2,"unit":"ml"},{"foodId":"food_imp_166fixj","amount":2,"unit":"ml"},{"foodId":"food_soy_sauce","amount":2,"unit":"ml"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_182rd5h","amount":50,"unit":"g"}],"steps":["盆中加入所有面粉","加入芝麻香油","面粉中央挖小洞","分 4-5 次加入水，并搅和，当出现碎末状的稍微干燥面团时","取消加水，用手将面团压实","面团压实至可把盆周围的面粉纳入即可，此步骤为面光盆光","将面团置于桌上，盆倒扣于桌上，环境温度为 25 度，使面团醒发 45 分钟","醒发完成后，将面团搓成条状，合成一团，再次搓成条，重复 3 次","擀成条状，切成 20 份均匀大小面团，并搓成直径 3-3.5cm 的球状","压扁面团，在手上，桌上，擀面杖上，及面团上撒上面粉，此步骤防止面团发粘","用擀面杖将面团擀平， 8cm 直径，厚 2mm，中间略微比四周厚 1mm","猪肉去皮，保留部分肥肉,切成小块","菜刀将猪肉剁成肉沫，放入碗中","葱、姜切成末，放入肉碗中搅拌均匀","韭菜洗净，切短至 3mm 以下长度","韭菜和肉沫混合，加入蚝油、生抽、香油各 2ml，加入一个鸡蛋的蛋清，用手混合搅拌均匀","放置 30 分钟即可开始包饺子","左手上放面皮，放饺子馅一面尽量不要粘到面粉，防止无法合拢","右手用筷子夹面皮 1/2 直径的馅","沿饺子皮圆周进行合拢，捏实，个人吃无需捏花，饺子皮不漏即可","使用可放下 20 只饺子的锅，或分批量煮","烧水，水 3/4 锅的高度","大火烧开水后放入饺子，调至中火","第一次放入饺子，且水冒泡后，锅边加入 50ml 冷水","第三次水开后加入冷水 50ml，水开后调至小火等 60s 即可出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.722Z","createdAt":"2026-10-12T16:25:03.722Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E6%89%8B%E5%B7%A5%E6%B0%B4%E9%A5%BA.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.722Z"},"category":"主食"},{"id":"recipe_htc_1dcu4we","name":"日式咖喱饭","baseServings":2,"ingredients":[{"foodId":"food_onion","amount":2,"unit":"个"},{"foodId":"food_potato","amount":2,"unit":"个"},{"foodId":"food_carrot","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_imp_13iazq4","amount":1000,"unit":"g"}],"steps":["胡萝卜去头尾，去皮，滚刀切","洋葱剥去外层去芯，切成月牙状","土豆去皮、切大块","肉切块状","剥蒜拍平切碎","咖喱块切碎，增加接触面积加速溶解","热油锅放入蒜和肉，快速翻炒至肉*表面变白*","加入胡萝卜，快速翻炒至均匀受热","加入洋葱，快速翻炒至洋葱*变透明状*","加入土豆，保持翻炒至土豆*变软*","加水没过所有食材，沸腾后等待 15 分钟","关火，加咖喱并搅拌","等待咖喱融化后再开火，缓慢搅拌 10 分钟，防止糊锅","在外观*呈粘稠状态*关火结束制作","微波炉：单人份高火 2-3 分钟","锅：需额外加 50ml 水，加热时保持搅拌"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.767Z","createdAt":"2026-10-12T16:25:03.767Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E6%97%A5%E5%BC%8F%E5%92%96%E5%96%B1%E9%A5%AD/%E6%97%A5%E5%BC%8F%E5%92%96%E5%96%B1%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.767Z"},"category":"主食"},{"id":"recipe_htc_58sb3u","name":"日式肥牛丼饭","baseServings":2,"ingredients":[{"foodId":"food_onion","amount":1,"unit":"个"},{"foodId":"food_imp_df53tt","amount":250,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_imp_1u8783g","amount":5,"unit":"g"}],"steps":["洋葱剥去外层去芯，切成月牙状","葱洗净切成 0.5cm 的小段","热锅直接放入白芝麻，前后晃动锅体使芝麻均匀受热至*略呈金黄色*","肥牛焯水 1 分钟后捞出","将 40g 味淋，30g 酱油，20g 耗油，5g 糖，5g 老抽，在碗中搅拌混合成调料","热油锅放入洋葱，快速翻炒至洋葱*变透明状*","关小火，加入 250g 水，开回大火加热等待 3 分钟","加入牛肉和调料","不断翻动所有食材 10 分钟，防止食材粘锅","关火","盛装肥牛丼至米饭上","撒上葱花和白芝麻，制作完成。","微波炉：单人份高火 2-3 分钟","锅：需额外加 50ml 水，加热时需不断翻动"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.783Z","createdAt":"2026-10-12T16:25:03.783Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E6%97%A5%E5%BC%8F%E8%82%A5%E7%89%9B%E4%B8%BC%E9%A5%AD/%E6%97%A5%E5 放进去翻炒，翻炒均匀。","将火调小，炒至馍丁呈金黄色。","放入盐，胡椒粉，五香粉。","最后将葱花放入一起翻炒几下。","关火出锅。"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:03.939Z","createdAt":"2026-10-12T16:25:03.939Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E7%82%92%E9%A6%8D.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.939Z"},"category":"主食"},{"id":"recipe_htc_lik35i","name":"炸酱面","baseServings":1,"ingredients":[{"foodId":"food_imp_1nyu9io","amount":150,"unit":"g"},{"foodId":"food_scallion","amount":15,"unit":"g"},{"foodId":"food_imp_zneih0","amount":35,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"g"},{"foodId":"food_doubanjiang","amount":20,"unit":"g"},{"foodId":"food_imp_e3us72","amount":20,"unit":"g"},{"foodId":"food_spaghetti","amount":150,"unit":"g"}],"steps":["菜码切丝备用。","葱切碎。油锅烧热，下葱和肉，炒至肉完全熟透","下豆瓣酱和甜面酱，继续炒至微微粘稠。盛出，得到*炸酱*。","取大碗，加凉水备用。","煮面条至断生，盛入第 4 步装有凉水的碗中。","立即控水捞出，盛入干净的碗中。","取第 3 步炸酱，倒入碗中，拌匀。然后取第 1 步菜码，倒入碗中，拌匀。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:03.955Z","createdAt":"2026-10-12T16:25:03.955Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E7%82%B8%E9%85%B1%E9%9D%A2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.955Z"},"category":"主食"},{"id":"recipe_htc_xx0qmu","name":"烙饼","baseServings":2,"ingredients":[{"foodId":"food_imp_1ezzi84","amount":400,"unit":"g"},{"foodId":"food_imp_1yqq412","amount":130,"unit":"ml"}],"steps":["将 400g 面粉倒入盆中，一半用凉水和面，一半用热水和面，搅拌成面絮，用手揉成团。用保鲜膜封起来，醒面 40 分钟","离醒面完成时间还有 10 分钟时，请查看小技巧中的油酥做法","醒好的面不用揉，稍微摁一下，用一横刀一竖刀将其分成四份。","搓圆，擀开，擀成与电饼铛大小差不多的饼，取 1/4 的油酥，将饼表面涂抹均匀","沿饼的半径切开，从外圈将其卷成圆锥形，然后将圆锥尾部捏好，防止油酥外漏。","按压面饼圆锥尖的地方，将其压扁，然后再次擀成与电饼铛大小差不多的面饼","将电饼铛预热，涂上凉油，将擀好的饼放入电饼铛中，将饼的上方也刷点油，涂抹均匀，盖上盖子","大火烙一分钟，打开盖子，将饼翻个面再烙一分钟","重复以上动作，完成饼的烙制"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:03.970Z","createdAt":"2026-10-12T16:25:03.970Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E7%83%99%E9%A5%BC/%E7%83%99%E9%A5%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:03.970Z"},"category":"主食"},{"id":"recipe_htc_e96ilw","name":"照烧鸡腿饭","baseServings":2,"ingredients":[{"foodId":"food_chicken_thigh","amount":600,"unit":"g"},{"foodId":"food_shaoxing","amount":15,"unit":"ml"},{"foodId":"food_soy_sauce","amount":42,"unit":"ml"},{"foodId":"food_salt","amount":2.5,"unit":"g"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"}],"steps":["取一只鸡腿，鸡皮朝下放在砧板上","用刀尖沿着鸡腿骨头的轮廓轻轻划开，从一端到另一端","用手指或刀背慢慢推开鸡肉，让骨头暴露出来。如果遇到筋膜，用刀尖切断","当鸡肉完全分离后，握住骨头一端，轻轻扭转并拔出","重复上述步骤将所有鸡腿去骨","去骨鸡腿加入黑胡椒粉、黑胡椒碎、盐、姜片腌制 5 分钟","碗里加入料酒、生抽、蜂蜜、老抽清水拌匀","蔬菜焯水 1-2 分钟煮熟捞起","热锅放油 15 ml 放入拍碎的大蒜爆香","放入鸡腿中小火煎至两面金黄，如果感觉锅中太干，补 5-10 ml 油","加入调好的酱汁，盖好盖子中小火焖 5-10 分钟熟透，酱汁浓稠起泡即可","切件，和蔬菜一起摆在饭面，淋入煎鸡腿的酱汁就可以慢慢享用啦"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.016Z","createdAt":"2026-10-12T16:25:04.016Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E7%85%A7%E7%83%A7%E9%B8%A1%E8%85%BF%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.016Z"},"category":"主食"},{"id":"recipe_htc_ej1qu5","name":"猪油拌饭","baseServings":1,"ingredients":[{"foodId":"food_rice","amount":200,"unit":"g"},{"foodId":"food_imp_q1obm4","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":7,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":8,"unit":"g"},{"foodId":"food_imp_1enp0e5","amount":5,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"}],"steps": t":5,"unit":"g"},{"foodId":"food_imp_9fe3b","amount":3,"unit":"g"},{"foodId":"food_imp_y0wqeo","amount":3,"unit":"g"},{"foodId":"food_salt","amount":6,"unit":"g"},{"foodId":"food_imp_1vjxfe2","amount":15,"unit":"g"},{"foodId":"food_rice","amount":200,"unit":"g"}],"steps":["将干红芸豆用清水浸泡至少 8 小时，浸泡后体积会膨胀两倍","将浸泡好的红芸豆沥干","使用高压锅：放入红芸豆和 600ml 水，盖好锅盖，大火上气后转中火，压 15-20 分钟，直至*豆子用手指可轻松压碎*","使用普通锅：放入红芸豆和足量水，大火煮沸后转中火，煮 60-90 分钟，直至豆子完全软烂","煮好后保留煮豆汤水，备用","在炒锅中倒入 30ml 食用油，中火加热","放入月桂叶 2 片，炸至*散出香味*","放入切碎的洋葱，翻炒至*金棕色*","加入磨碎的生姜和大蒜，翻炒 1 分钟","加入切碎的番茄，翻炒至*番茄完全软烂出油*","加入姜黄粉 3g、红辣椒粉 5g、香菜粉 5g、孜然粉 3g、盐 6g","翻炒 2 分钟，使香料与番茄融合","将煮好的红芸豆连同汤水一起倒入锅中","加入青辣椒，搅拌均匀","大火煮沸后转小火，炖 15-20 分钟","期间用铲子背面压碎一部分豆子，使汤汁变得*浓稠*","加入印度综合香料粉 3g，搅拌均匀","关火，撒上香菜叶","将大米淘洗干净","放入电饭锅，加入 400ml 水","正常蒸煮即可","将米饭盛入盘中","将红芸豆咖喱浇在米饭上或旁边","可搭配洋葱沙拉和柠檬角"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.125Z","createdAt":"2026-10-12T16:25:04.125Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E7%BA%A2%E8%8A%B8%E8%B1%86%E6%8B%8C%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.125Z"},"category":"主食"},{"id":"recipe_htc_6kyxyi","name":"老干妈拌面","baseServings":1,"ingredients":[{"foodId":"food_spaghetti","amount":120,"unit":"g"},{"foodId":"food_imp_i93d3q","amount":15,"unit":"ml"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"}],"steps":["将水倒入锅中并煮沸","将面均匀放入锅中","在煮的过程注意搅拌，避免面粘成一坨","当用筷子挑起一根面且该面能自然地从筷子上滑落时再等 30 秒关火","将面夹入碗中","按照上面的计量放入老干妈和酱油","用筷子将碗里的面、老干妈、酱油拌均匀","吃"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.157Z","createdAt":"2026-10-12T16:25:04.157Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%80%81%E5%B9%B2%E5%A6%88%E6%8B%8C%E9%9D%A2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.157Z"},"category":"主食"},{"id":"recipe_htc_9lfdm0","name":"肉蛋盖饭","baseServings":1,"ingredients":[{"foodId":"food_rice","amount":240,"unit":"g"},{"foodId":"food_eggs","amount":4,"unit":"个"},{"foodId":"food_imp_p69qlv","amount":300,"unit":"g"},{"foodId":"food_soy_sauce","amount":35,"unit":"ml"},{"foodId":"food_imp_135y1u2","amount":20,"unit":"ml"},{"foodId":"food_imp_1e8ojmj","amount":10,"unit":"g"},{"foodId":"food_scallion","amount":10,"unit":"g"},{"foodId":"food_veg_oil","amount":30,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":15,"unit":"g"}],"steps":["煮好米饭，通常使用买米赠送的量杯，一杯米 240g","锅中放油 30ml","放入肉馅，调中火煎至两面微焦","将鸡蛋打入锅中，不要打散，盖上锅盖","调一个碗汁，碗中放入计算中的对应数量的老抽，生抽，醋，糖，红葱油，搅拌均匀","打开锅盖，将碗汁倒入锅中，等待三分钟","关火，将肉蛋盖到米饭上","安全检查，开始食用盖饭"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.173Z","createdAt":"2026-10-12T16:25:04.173Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%82%89%E8%9B%8B%E7%9B%96%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.173Z"},"category":"主食"},{"id":"recipe_htc_s96z46","name":"茄子肉煎饼","baseServings":2,"ingredients":[{"foodId":"food_imp_2dzqz5","amount":250,"unit":"g"},{"foodId":"food_imp_1ezzi84","amount":50,"unit":"g"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_1yqqzuz","amount":100,"unit":"g"},{"foodId":"food_imp_1u4vwvt","amount":1,"unit":"个"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"},{"foodId":"food_salt","amount":1,"unit":"g"}],"steps":["将茄子去皮后切成片，将腊肉切成片，备用","依次向盆中加入 250g 米粉、50g 面粉和 1 个鸡蛋","边用筷子搅拌，边加入清水，使米粉、面粉、鸡蛋混合成面糊,当面糊能够附着在茄片、肉片上而不掉落时停止加水，而后将所有茄片和肉片放入面糊中，用面糊充分包裹","平底锅加入食用油10-30ml，开小火","用筷子或勺子把裹了面糊的茄片、肉片放入锅中，先煎至两面金黄，再煎3-6分钟","撒盐，翻炒均匀，起锅装盘"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.188Z","createdAt":"2026-10-12T16:25:04.188Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%8C%84%E5%AD%90%E8%82%89%E7%85%8E%E9%A5%BC/%E8%8C%84%E5%AD%90%E8%82%89%E7%85%8E%E9%A5%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.188Z"},"category":"主食"},{"id":"recipe_htc_1ds5n5r","name":"葱油拌面","baseServings":2,"ingredients":[{"foodId":"food_scallion","amount":100,"unit":"g"},{"foodId":"food_veg_oil","amount":100,"unit":"ml"},{"foodId":"food_soy_sauce","amount":80,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":15,"unit":"g"},{"foodId":"food_spaghetti","amount":80,"unit":"g"},{"foodId":"food_imp_y3d635","amount":15,"unit":"ml"}],"steps":["将 小葱 洗净，切成长段。葱白和葱绿可以分开。","锅中加入 100 ml 食用油，中火烧热。先放入葱白段，煸炒至微黄。","加入葱绿段，转小火，继续煸炒。","保持小火，耐心煸炒 15-20 分钟，直至葱段变得焦黄酥脆。","将焦黄的葱段捞出。","在锅中的葱油中，加入 60 ml 生抽，20 ml 老抽，15 g 白糖。小火加热并搅拌， 1 分钟，至糖溶解，酱汁混合均匀。立即关火。将制作好的葱油酱汁倒入容器中，放凉后密封保存。","取 80 g 干面条。","锅中加入 1000 ml 饮用水，大火烧开。","放入 面条，根据面条包装说明，煮至熟透。","将 煮好的 面条 捞出，沥干水分，放入碗中。","在装有 面条 的碗中，加入 15 ml 之前做好的 葱油酱汁。","可以加入之前炸好的葱段。","用 筷子 快速搅拌均匀，即可食用。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.202Z","createdAt":"2026-10-12T16:25:04.202Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%91%B1%E6%B2%B9%E6%8B%8C%E9%9D%A2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.202Z"},"category":"主食"},{"id":"recipe_htc_tradxq","name":"蛋包饭","baseServings":1,"ingredients":[{"foodId":"food_eggs","amount":2,"unit":"个"},{"foodId":"food_onion","amount":30,"unit":"g"},{"foodId":"food_carrot","amount":30,"unit":"g"},{"foodId":"food_chicken_thigh","amount":50,"unit":"g"},{"foodId":"food_rice","amount":200,"unit":"g"},{"foodId":"food_tomato_puree","amount":20,"unit":"ml"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"},{"foodId":"food_milk","amount":10,"unit":"ml"}],"steps":["洋葱、胡萝卜、火腿肠或鸡胸肉切成小丁，备用","热锅，锅中倒入 10ml 食用油，等待 10 秒加热","先放入洋葱丁翻炒 1 分钟，出香味后加入胡萝卜、玉米粒、青豆继续翻炒 2 分钟","加入火腿肠或鸡胸肉丁，炒至变色","加入米饭炒散后，加入番茄酱 20ml，翻炒均匀，炒饭完成，盛出备用","鸡蛋打散，加入 10ml 牛奶搅匀","锅中放入 5ml 食用油，倒入蛋液，轻晃锅底让蛋液均匀铺满锅面","用小火加热，待蛋液表面半熟状态时，将炒饭放入蛋液中央","用铲子将蛋皮折叠包住米饭，形成椭圆形状","用锅铲轻轻推至盘中，整理外形，可在表面挤上少量番茄酱装饰"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.235Z","createdAt":"2026-10-12T16:25:04.235Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%9B%8B%E5%8C%85%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.235Z"},"category":"主食"},{"id":"recipe_htc_orf1nq","name":"西红柿鸡蛋挂面","baseServings":2,"ingredients":[{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2,"unit":"g"},{"foodId":"food_soy_sauce","amount":5,"unit":"g"},{"foodId":"food_veg_oil","amount":20,"unit":"g"},{"foodId":"food_imp_166fixj","amount":5,"unit":"g"},{"foodId":"food_imp_dh1ffp","amount":1,"unit":"个"}],"steps":["小葱洗净并切成葱花","西红柿切块儿，如果不太会切建议先百度一下~","青椒切成菱形块","生鸡蛋打入一个小碗并打散，如果鸡蛋有点腥味可以加 2g 白醋去腥","起锅烧热，倒入 15~20g 食用油，鸡蛋炒嫩滑就得多一点油，同时为后面煸炒西红柿留一些底油","待油温到七成热时，倒入蛋液快速划散","鸡蛋滑到凝固后，一点不会有蛋液了后倒入小碗备用，此处留一些底油","锅中留底油后先加入葱白、蒜末炒香","加入西红柿块、青椒，待西红柿炒出一点汁水","此时速速加入 5g 酱油和 2g 白砂糖","翻炒十几秒后加入一碗清水","煮沸后加入炒好的鸡蛋，加入蚝油 5g 或者 2g 鸡精用于提鲜","中小火收汁，期间要搅拌防止粘锅，收汁到下图后加一点葱花和香油，臊子制作完成","可以不用洗锅，直接加清水 500ml","煮沸加入挂面，挂面煮软后加入 100ml 清水","再次煮沸后，若面条飘起来了，再加入 100ml 清水","煮沸后看面条两侧是否呈透明状，透明状则熟了","捞面到臊子碗中，拌面即可啦~"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.281Z","createdAt":"2026-10-12T16:25:04.281Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E8%A5%BF%E7%BA%A2%E6%9F%BF%E9%B8%A1%E8%9B%8B%E6%8C%82%E9%9D%A2/%E8%A5%BF%E7%BA%A2%E6%9F%BF%E9%B8% ":100,"unit":"g"},{"foodId":"food_eggs","amount":3,"unit":"个"},{"foodId":"food_imp_166fixj","amount":10,"unit":"ml"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_imp_1ezzi84","amount":250,"unit":"g"}],"steps":["将面粉放入大碗中，加入水，搅拌成光滑的面团，静置 30 分钟。","韭菜洗净切碎，加入打散的鸡蛋、5g 盐，搅拌均匀。","将面团分成小剂子，擀成薄圆饼，包入韭菜、虾仁、鸡蛋液。","热锅，加入食用油，放入包好的韭菜盒子，煎至两面金黄， 3-4 分钟。","盛盘，稍凉后即可享用。"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.390Z","createdAt":"2026-10-12T16:25:04.390Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E9%9F%AD%E8%8F%9C%E7%9B%92%E5%AD%90.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.390Z"},"category":"主食"},{"id":"recipe_htc_b1obx","name":"鲜肉烧卖","baseServings":3,"ingredients":[{"foodId":"food_imp_mm6m4a","amount":240,"unit":"g"},{"foodId":"food_imp_182rd5h","amount":300,"unit":"g"},{"foodId":"food_ginger","amount":5,"unit":"g"},{"foodId":"food_imp_q8je51","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_shaoxing","amount":10,"unit":"ml"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2,"unit":"g"},{"foodId":"food_imp_1q92hdi","amount":2,"unit":"g"},{"foodId":"food_veg_oil","amount":5,"unit":"ml"},{"foodId":"food_imp_1jlkp2x","amount":30,"unit":"ml"},{"foodId":"food_imp_146pcot","amount":6,"unit":"g"},{"foodId":"food_imp_1m8ogqo","amount":50,"unit":"g"},{"foodId":"food_imp_1lhgoou","amount":100,"unit":"g"},{"foodId":"food_imp_h2g6i1","amount":75,"unit":"g"},{"foodId":"food_prawns","amount":100,"unit":"g"},{"foodId":"food_imp_rdy50l","amount":1.2,"unit":"g"},{"foodId":"food_imp_q1obm4","amount":15,"unit":"g"}],"steps":["取 10 mL 冷水，加入复配食品增稠剂，调成糊糊","加入 25 mL 开水，搅拌至半透明凝胶","冷却后混入 280 g 纯瘦肉糜 + 15 g 融化猪油","将猪肉末与生姜末、葱末混合，加入酱油、料酒、盐、糖、白胡椒粉，顺一个方向搅拌上劲","如果使用浓汤宝，取浓汤宝块加入 15 mL 热水混合，搅拌至乳浊液完全分散，再加入 15 mL 常温水","慢慢加入水或高汤，继续搅拌，直到馅料吸收水分，变得粘稠，如果觉得肉馅太稠，补 5 mL 水继续搅拌","加入可选配料，最后淋上芝麻油，拌匀。冷藏 30 分钟，让味道融合","取一张烧卖皮，放上 20-25 g 馅料","用虎口轻轻收拢皮子边缘，形成“花瓶”状，顶部留开口","用手指轻轻压实底部，确保站立稳定","如果要加虾仁，在顶部加一颗虾仁","重复包烧卖的步骤，直到包好","放在蒸笼里，间隔开，避免粘连","大火蒸 8-10 分钟即可"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.406Z","createdAt":"2026-10-12T16:25:04.406Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E9%B2%9C%E8%82%89%E7%83%A7%E5%8D%96.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.406Z"},"category":"主食"},{"id":"recipe_htc_cx20f9","name":"鹰嘴豆炸饼","baseServings":3,"ingredients":[{"foodId":"food_imp_17l1vud","amount":200,"unit":"g"},{"foodId":"food_onion","amount":2,"unit":"个"},{"foodId":"food_tomato","amount":3,"unit":"个"},{"foodId":"food_ginger","amount":10,"unit":"g"},{"foodId":"food_garlic","amount":4,"unit":"个"},{"foodId":"food_dried_chili","amount":2,"unit":"个"},{"foodId":"food_veg_oil","amount":545,"unit":"ml"},{"foodId":"food_imp_ovw96s","amount":1,"unit":"个"},{"foodId":"food_imp_v6fbt8","amount":3,"unit":"g"},{"foodId":"food_dried_chili","amount":5,"unit":"g"},{"foodId":"food_imp_15sm37n","amount":8,"unit":"g"},{"foodId":"food_imp_9fe3b","amount":5,"unit":"g"},{"foodId":"food_imp_y0wqeo","amount":5,"unit":"g"},{"foodId":"food_imp_d155qp","amount":3,"unit":"g"},{"foodId":"food_salt","amount":9,"unit":"g"},{"foodId":"food_imp_xf24bs","amount":250,"unit":"g"},{"foodId":"food_yogurt","amount":60,"unit":"ml"},{"foodId":"food_imp_61hm4w","amount":2,"unit":"g"}],"steps":["将干鹰嘴豆用清水浸泡过夜，浸泡后体积会膨胀至两倍","将浸泡好的鹰嘴豆沥干水分","放入锅中，加入 500ml 水和 1 个红茶包","大火煮沸后转中火，煮 25-30 分钟，直至*鹰嘴豆用手指可以轻松压碎*","取出红茶包，保留煮豆的汤水，备用","在炒锅中倒入 30ml 食用油，中火加热","放入切碎的洋葱，翻炒至*金棕色*","加入磨碎的生姜和大蒜，翻炒 1 分钟","加入切碎的番茄，翻炒至*番茄完全软烂出油*","加入姜黄粉 3g、红辣椒粉 5g、香菜粉 8g、孜然粉 5g、盐 6g","翻炒 2 分钟，使香料充分释放香味","将煮好的鹰嘴豆连同汤水一起倒入锅中","加入青辣椒，搅拌均匀","大火煮沸后转小火，炖 15-20 分钟，期间可用铲子背面压碎一些鹰嘴豆使汤汁变稠","加入印度综合香料粉 5g 和石榴粉 3g","搅拌均匀后关火，备用","在大碗中混合中筋面粉 250g、小苏打 2g、盐 3g","加入酸奶 60ml 和食用油 15ml","逐渐加入温水，边加边揉，揉成*光滑柔软*的面团","用湿布盖住面团，静置 30 分钟","将面团分成 8 个等大的小剂子","取一个剂子，手上沾少量油，擀成直径 15cm、厚度 3mm 的圆形面饼","在深锅中倒入 500ml 食用油，中大火加热至油温 180°C","将面饼轻轻滑入热油中，用漏勺轻轻按压面饼使其*膨胀鼓起*","炸 1-2 分钟，翻面炸至*两面金黄*","捞出，用厨房纸吸去多余油分","将鹰嘴豆咖喱重新加热","炸饼趁热上桌，搭配鹰嘴豆咖喱食用","可搭配切片洋葱、青辣椒和柠檬角"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.436Z","createdAt":"2026-10-12T16:25:04.436Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E9%B9%B0%E5%98%B4%E8%B1%86%E7%82%B8%E9%A5%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.436Z"},"category":"主食"},{"id":"recipe_htc_odyva","name":"麻辣减脂荞麦面","baseServings":2,"ingredients":[{"foodId":"food_imp_1j3dcpp","amount":100,"unit":"g"},{"foodId":"food_imp_imb17x","amount":8,"unit":"个"},{"foodId":"food_imp_1bxbyly","amount":6,"unit":"个"},{"foodId":"food_imp_1lcn8s3","amount":25,"unit":"g"},{"foodId":"food_imp_lm1q3c","amount":15,"unit":"g"},{"foodId":"food_milk","amount":150,"unit":"ml"},{"foodId":"food_soy_sauce","amount":6,"unit":"ml"},{"foodId":"food_dried_chili","amount":10,"unit":"ml"},{"foodId":"food_imp_135y1u2","amount":20,"unit":"ml"},{"foodId":"food_sichuan_pepper","amount":10,"unit":"ml"}],"steps":["娃娃菜、生菜洗好，备用","锅内倒入 500ml 水，开大火，将荞麦面和娃娃菜放进去，等待水沸腾","水沸腾后，转小火，加入火锅底料、花生酱、牛奶、生抽、辣椒油，水开后煮 5 分钟","加入生菜，再煮 2 分钟","加入醋、花椒油，关火，直接端着小锅开吃。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.467Z","createdAt":"2026-10-12T16:25:04.467Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E9%BA%BB%E8%BE%A3%E5%87%8F%E8%84%82%E8%8D%9E%E9%BA%A6%E9%9D%A2.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.467Z"},"category":"主食"},{"id":"recipe_htc_1q3ckpt","name":"上汤娃娃菜","baseServings":2,"ingredients":[{"foodId":"food_imp_imb17x","amount":700,"unit":"g"},{"foodId":"food_imp_997mip","amount":10,"unit":"g"},{"foodId":"food_imp_1gr9ccu","amount":1,"unit":"个"},{"foodId":"food_imp_lb5ao4","amount":1,"unit":"个"}],"steps":["娃娃菜洗净, 竖着切开切成段。","葱 3g 切 小段。蒜 10g 切片。姜 10g 切小片。","皮蛋切成丁, 火腿肠或者午餐肉切成丁","金针菇洗净撕开","烧热水娃娃菜放进去十秒钟出一下水捞出。","热锅凉油, 加热锅倒入油过一遍就倒出来, 重新倒入一点油。","调至小火加入葱姜蒜，煎炒出香味即可。","加入适 300g 清水, 放入娃娃菜, 金针菇, 午餐肉","加入调味料蚝油、糖、盐、味精烧开。","煮 3 分钟, 煮开后开始装盘, 盛出娃娃菜后皮蛋放在上面把汤汁浇上去就可以了","!上汤娃娃菜"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.498Z","createdAt":"2026-10-12T16:25:04.498Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E4%B8%8A%E6%B1%A4%E5%A8%83%E5%A8%83%E8%8F%9C/%E4%B8%8A%E6%B1%A4%E5%A8%83%E5%A8%83%E8%8F%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.498Z"},"category":"素菜"},{"id":"recipe_htc_1i8d7cp","name":"乾隆白菜","baseServings":2,"ingredients":[{"foodId":"food_imp_11l1npw","amount":300,"unit":"g"},{"foodId":"food_imp_qn1vs8","amount":30,"unit":"g"},{"foodId":"food_imp_1pbhh6c","amount":45,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_imp_166fixj","amount":5,"unit":"ml"},{"foodId":"food_salt","amount":1,"unit":"g"},{"foodId":"food_imp_xaiobp","amount":3,"unit":"g"}],"steps":["大白菜只取内部嫩叶，去除菜帮，用手撕成半个巴掌大的块，不要用刀切","将撕好的白菜叶冲洗干净，充分控干水分，水分残留会导致酱汁无法挂附","碗中加入 30g 芝麻酱，先加入 45ml 陈醋，沿同一方向搅拌，将麻酱慢慢稀释开，直至*成细线状滴落*为止","向麻酱汁中加入 5g 白糖，搅拌均匀；再加入 1g 食盐，搅拌均匀；最后加入 5ml 香油，搅拌均匀","将调好的麻酱汁均匀淋在白菜叶上，用手轻轻抓拌，使每片菜叶都裹上酱汁","撒上熟白芝麻，装盘即可食用；若时间充裕，可静置 5 分钟待其入味后再食用"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.515Z","createdAt":"2026-10-12T16:25:04.515Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E4%B9%BE%E9 "unit":"g"},{"foodId":"food_veg_oil","amount":160,"unit":"ml"},{"foodId":"food_soy_sauce","amount":8,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":15,"unit":"ml"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":3,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"},{"foodId":"food_tomato_puree","amount":15,"unit":"ml"}],"steps":["胡萝卜切片，尖椒切薄块，葱蒜碎切好","把买好的日本豆腐打开袋子切好，切成大概 1 cm 厚的圆柱体","生粉放到平盘中，准备给豆腐裹面","轻轻把豆腐放到面粉上，上下两面和周边都裹上面粉，注意不要包裹的太厚","在平底锅里放 150 ml 油，油能没过豆腐一大半即可，看边缘颜色变成金黄，翻面煎就可以了","两边都煎好的时候捞出来放在干净的盘里备用","在炒锅中倒入 10-15 ml 油，放入葱蒜，爆香后放入青椒、胡萝卜、火腿肠、黑木耳","加入蚝油、生抽、盐、鸡精、白砂糖、番茄酱","轻轻翻炒至颜色均匀"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.686Z","createdAt":"2026-10-12T16:25:04.686Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E5%AE%B6%E5%B8%B8%E6%97%A5%E6%9C%AC%E8%B1%86%E8%85%90.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.686Z"},"category":"素菜"},{"id":"recipe_htc_7snaaf","name":"干锅花菜","baseServings":2,"ingredients":[{"foodId":"food_imp_wmwdz4","amount":400,"unit":"g"},{"foodId":"food_pork_belly","amount":100,"unit":"g"},{"foodId":"food_dried_chili","amount":1,"unit":"个"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"}],"steps":["花菜朵朝下，没入淡盐水中浸泡 20 分钟。然后洗净用小刀拆成小朵","入开水锅中焯水 1 分钟，捞出立即用冷水冲淋至完全凉透，沥水备用","五花肉切成薄片，大蒜白色切下用刀背拍扁，小红辣椒切成段","锅烧热放油，油热下大葱白爆香","下五花肉片入锅，用中火煸炒至表面全部变色，继续煸炒一会儿，把肥肉部分的油份逼出一部分","倒入红辣椒段和花菜，翻炒几下","加入 10 ml 生抽","再加入 5 g 白糖，转大火不断翻炒 1 分钟","把大蒜叶部分切成段，放入锅中，翻炒几下后，关火盖上盖子焖 1 分钟即可"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.715Z","createdAt":"2026-10-12T16:25:04.715Z","source":{"url":" ource":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E6%9D%BE%E4%BB%81%E7%8E%89%E7%B1%B3.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.763Z"},"category":"素菜"},{"id":"recipe_htc_1cti5sz","name":"椒盐玉米","baseServings":2,"ingredients":[{"foodId":"food_imp_azxvvp","amount":350,"unit":"g"},{"foodId":"food_imp_1q62p6q","amount":10,"unit":"g"},{"foodId":"food_imp_13s7up","amount":10,"unit":"g"}],"steps":["玉米粒都是剥好的，直接解冻即可，温水泡 15 分钟或者灶上开水煮 5 分钟。","拿出一个簸箕，将其假设为 BoxA，垫上吸油纸，倒进解冻好的玉米粒。","shaking shaking shaking! - 直到吸油纸全部变湿为止。","拿出第二个簸箕 BoxB，垫上吸油纸，将 BoxA 的玉米粒全部倒入 BoxB 中。","shaking shaking shaking! - 直到吸油纸全部变湿为止。","重复上述操作多次，直到玉米表面没有明显可见的水滴但保持湿润的状态。","倒入大量淀粉，能够完全盖住玉米粒。","shaking shaking shaking! - 直到淀粉裹住了玉米粒","开灶 - 放锅 - 倒入油 尽量铺满锅底 但不要太多。","油热 8 成，倒入裹上了淀粉的玉米粒。","中火先煎 30s，不要翻炒，不然淀粉会掉。","轻微翻炒 3 分钟即可出锅。","最重要的一步：撒上 3g 椒盐，撒上芝麻粒！","香喷喷的”椒盐玉米“就做好了"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.778Z","createdAt":"2026-10-12T16:25:04.778Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E6%A4%92%E7%9B%90%E7%8E%89%E7%B1%B3/%E6%A4%92%E7%9B%90%E7%8E%89%E7%B1%B3.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.778Z"},"category":"素菜"},{"id":"recipe_htc_dywjy9","name":"榄菜肉末四季豆","baseServings":2,"ingredients":[{"foodId":"food_imp_f0zvc7","amount":220,"unit":"g"},{"foodId":"food_pork_belly","amount":100,"unit":"g"},{"foodId":"food_imp_rs6b7v","amount":20,"unit":"g"},{"foodId":"food_garlic","amount":10,"unit":"g"},{"foodId":"food_imp_uype7w","amount":10,"unit":"g"}],"steps":["将四季豆洗净，并把筋撕干净，然后切成大小均匀的颗粒备用。","将大蒜拍碎剁成蒜末备用。","将小米辣切成大小均匀的颗粒备用。","将五花肉去皮，然后剁成肉末备用。","将锅烧热，然后加入 20ml 油滑锅，锅滑好之后将热油倒出，然后加入 10ml 冷油，这就是传说中热锅冷油，这么做主要是防止肉末粘锅。","如果家里没有晾油瓶的话，也可以不用滑锅，放入油之后，直接加入肉末开始煸炒，小火煸炒两分钟，炒出猪油。","肉末炒香之后加入蒜末，橄榄菜和小米辣，炒出香味。","加入四季豆开中火煸炒，四季豆至少要炒 5 分钟，一定要保证四季豆熟透，否则可能会食物中毒。","四季豆炒熟后加入 2ml 酱油从锅边淋入，然后加入 2g 盐、1g 鸡精、1g 胡椒粉和 0.5g 糖。","将调料翻炒均匀。","出锅，装盘。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.794Z","createdAt":"2026-10-12T16:25:04.794Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E6%A6%84%E8%8F%9C%E8%82%89%E6%9C%AB%E5%9B%9B%E5%AD%A3%E8%B1%86/%E6%A6%84%E8%8F%9C%E8%82%89%E6%9C%AB%E5%9B%9B%E5%AD%A3%E8%B1%86.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.794Z"},"category":"素菜"},{"id":"recipe_htc_10svnaz","name":"油醋爆蛋","baseServings":2,"ingredients":[{"foodId":"food_eggs","amount":4,"unit":"个"},{"foodId":"food_imp_uype7w","amount":10,"unit":"g"},{"foodId":"food_veg_oil","amount":35,"unit":"ml"},{"foodId":"food_scallion","amount":10,"unit":"g"},{"foodId":"food_garlic","amount":5,"unit":"g"},{"foodId":"food_imp_124i6bx","amount":15,"unit":"ml"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":10,"unit":"g"}],"steps":["鸡蛋不需打散，直接打入碗中备用","香葱切 3cm 长小段即可","蒜瓣和小米辣放入打蒜器，打成沫","将香醋、生抽、蚝油、白糖、水加入小碗，搅拌均匀作为糖醋料汁","油热倒入鸡蛋，等鸡蛋凝固之后铲成大块，倒入蒜沫、小米辣沫、倒入糖醋料汁","大火收汁、快出锅时加入葱段即可"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.828Z","createdAt":"2026-10-12T16:25:04.828Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E6%B2%B9%E9%86%8B%E7%88%86%E8%9B%8B.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.828Z"},"category":"素菜"},{"id":"recipe_htc_csrhq5","name":"洋葱炒鸡蛋","baseServings":2,"ingredients":[{"foodId":"food_eggs","amount":2,"unit":"个"},{"foodId":"food_onion","amount":50,"unit":"g"},{"foodId":"food_v il","amount":10,"unit":"ml"}],"steps":["鸡蛋加入牛奶以及 5ml 食用油搅拌均匀，备用","大火烧热平底锅 30s, 加入 5ml 食用油","烧 30s 转小火, 并且放入搅拌好的鸡蛋","在锅中静置 5 秒后，用锅铲将蛋液从边缘缓慢推向中间","翻炒至鸡蛋大致凝固后关火，装盘"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:04.904Z","createdAt":"2026-10-12T16:25:04.904Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E7%82%92%E6%BB%91%E8%9B%8B/%E7%82%92%E6%BB%91%E8%9B%8B.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.904Z"},"category":"素菜"},{"id":"recipe_htc_1bb1yo","name":"炒青菜","baseServings":1,"ingredients":[{"foodId":"food_bok_choy","amount":100,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"ml"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_garlic","amount":1,"unit":"个"}],"steps":["青菜掰成小瓣，用清水洗净，备用。","将蒜瓣剁碎，备用","中火或大火热锅后，锅内放入 10-15ml 食用油。再等待 30 秒让油温升高。","将准备好的青菜倒入锅中，翻炒至青菜变软。","放入剁碎的蒜瓣","倒入计算好的清水，水位应当完全浸润或即将没过青菜，加入食盐 ，继续翻炒 1 分钟。","最后加入白糖小火加热 2 分钟，加热时盖上锅盖。","盛盘。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:04.934Z","createdAt":"2026-10-12T16:25:04.934Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E7%82%92%E9%9D%92%E8%8F%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.934Z"},"category":"素菜"},{"id":"recipe_htc_t08t2h","name":"炸洋葱花","baseServings":2,"ingredients":[{"foodId":"food_onion","amount":1,"unit":"个"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_aeuftj","amount":120,"unit":"g"},{"foodId":"food_cornflour","amount":40,"unit":"g"},{"foodId":"food_dried_chili","amount":2,"unit":"g"},{"foodId":"food_imp_1g3ukbz","amount":1,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_veg_oil","amount":1200,"unit":"ml"}],"steps":["黄洋葱剥去外层干皮，切掉顶部 5mm，保留底部根盘不切","从顶部下刀，沿直径方向垂直切到距根盘 1cm 处停止，即不切断根盘","按同样方式每间隔 45 度切一刀，共切 16 刀，把整颗洋葱分成 16 瓣","把洋葱翻面，根盘朝上，同样方式在每两瓣之间补切 1 刀，共补 8 刀","把切好的洋葱根盘朝上放入冰水，浸泡 20 分钟","泡好后取出，根盘朝上静置 5 分钟沥干水分","取 40g 低筋面粉，均匀撒在洋葱的花瓣之间，边撒边把花瓣拨开，让每一层花瓣内侧都挂上干粉","将剩余 80g 低筋面粉、40g 玉米淀粉、2g 辣椒粉、1g 黑胡椒粉、3g 食盐混合均匀，备用","将 1 个鸡蛋与 100ml 冰水混合，搅打 30 秒至完全均匀，备用","把洋葱根盘朝上浸入蛋液，翻转 3 次，使每片花瓣正反面都沾上蛋液","把洋葱根盘朝上放入混合粉中，用手抓粉从中心向四周撒进花瓣缝隙，翻转 3 次","提起洋葱抖掉多余的粉，检查花瓣根部有无露白，露白处补撒混合粉","静置 2 分钟让挂粉回潮，此时外壳应呈现均匀的白色粉层","深锅倒入 1200ml 食用油，中火加热至 170℃","把洋葱根盘朝下放入油中，此时油面会剧烈起泡","保持 165℃ - 175℃ 油炸 3 分钟，期间用漏勺舀热油反复浇淋洋葱顶部","把洋葱翻面，根盘朝上继续油炸 2 分钟","待花瓣呈金黄色、外壳变硬时捞出，判断标准是洋葱能浮在油面且花瓣完全张开","放在漏勺上沥油 2 分钟","把洋葱根盘朝下放在盘子上，花瓣自然摊开","中心放 30ml 蘸酱"],"tags":["导入"],"status":"complete","publishedAt":"2026-10-12T16:25:04.950Z","createdAt":"2026-10-12T16:25:04.950Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E7%82%B8%E6%B4%8B%E8%91%B1%E8%8A%B1/%E7%82%B8%E6%B4%8B%E8%91%B1%E8%8A%B1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:04.950Z"},"category":"素菜"},{"id":"recipe_htc_1ftobex","name":"烤茄子","baseServings":2,"ingredients":[{"foodId":"food_imp_1u4vwvt","amount":1,"unit":"个"},{"foodId":"food_veg_oil","amount":20,"unit":"ml"},{"foodId":"food_soy_sauce","amount":4,"unit":"g"},{"foodId":"food_imp_uype7w","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_imp_9fe3b","amount":1,"unit":"g"},{"foodId":"food_imp_5vosw6","amount":0.5,"unit":"g"},{"foodId":"food_garlic","amount":3,"unit":"个"}],"steps":["将酱油、孜然、食用盐、蒜蓉和切碎的小米椒置于碗中，均匀搅拌备用","茄子洗净，用纸巾擦干表面的水分","用叉子在茄子的一侧扎 4-8 下","使用 15-25ml 的食用油涂满茄子表面","将烤箱温度设置为 200℃ ，预热 2 分钟","将茄子放入烤箱中层或者上层，烤制 12-15 分钟","取出茄子，用刀茄子上竖着划一个口子。口子居中，上下距 1-1.5cm","用小刀或者叉子伸入口子，竖着切割茄子内部","将口子微微掰开，倒入第一步准备的酱料","再次将茄子放入烤箱，将烤箱温度设置为 200℃ ，烤制 4-7 分钟","取出，关闭烤箱电源"],"tags":["导入","家常 :"个"},{"foodId":"food_imp_5vosw6","amount":3,"unit":"g"},{"foodId":"food_imp_166fixj","amount":2,"unit":"ml"},{"foodId":"food_soy_sauce","amount":8,"unit":"ml"},{"foodId":"food_imp_qq680p","amount":2,"unit":"ml"}],"steps":["两个鸡蛋放入碗中打散","加入食用盐 3g","盐起到了重要的增加底味和凝固作用","加入 2ml 白醋，去除鸡蛋的腥味","加入米醋也行，但米醋的颜色会使鸡蛋微微发黑","还可以加入料酒，同样具有去腥的作用，且没有醋的酸味","向碗中加入鸡蛋体积 1-1.5 倍的 70 度纯净水，并且搅拌均匀","1 倍的水鸡蛋更弹，1.5 倍的水鸡蛋更嫩","过滤蛋液，去掉蛋液中的浮沫","向任意一口锅中加入 300-500ml 清水，水烧开后，放入盛有鸡蛋液的碗","蒸碗要盖上一个盖子，倒扣一个有凹槽的铁碟子，或者使用保鲜膜来减少水汽进入，这是为了避免其变成蜂窝状","蒸煮步骤","开中火蒸10 分钟, 10 分钟之后关火再闷上5 分钟。","开大火蒸5 分钟，要保持锅中水一直处于沸腾状态，否则要延长时间。每隔2 分钟开盖一次释放水蒸气，开盖过晚蛋羹容易变成蜂窝状；开盖太早/频繁蒸的时间需要久一些。","如何判断已经熟了？","晃动碗，蛋羹不再处于液体状态，拥有类似果冻的 Q 弹状态即可出锅。","出锅","加入香油和生抽即可享用","也可用藤椒油代替香油，增加麻爽口感"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:05.480Z","createdAt":"2026-10-12T16:25:05.480Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E9%B8%A1%E8%9B%8B%E7%BE%B9/%E9%B8%A1%E8%9B%8B%E7%BE%B9.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:05.480Z"},"category":"素菜"},{"id":"recipe_htc_8dzikh","name":"鸡蛋花","baseServings":1,"ingredients":[{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_puht3d","amount":100,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_salt","amount":1,"unit":"g"}],"steps":["将鸡蛋打入碗中。","使用筷子或搅拌器，顺着一个方向搅打蛋液，直至蛋清与蛋黄完全混合均匀，颜色一致。","将糖或盐等调味料加入蛋液中，略微搅匀。","准备刚烧开的、100 ℃ 的沸水。","一边用筷子快速搅拌碗中的蛋液，一边将沸水以细流状冲入蛋液中。确保沸水与蛋液充分混合。","持续搅拌片刻，直至蛋液被完全烫熟，形成均匀的淡黄色蛋花。"],"tags":["导入","家常菜"],"status":"complete","publishedAt":"2026-10-12T16:25:05.495Z","createdAt":"2026-10-12T16:25:05.495Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E9%B8%A1%E8%9B%8B%E8%8A%B1/%E9%B8%A1%E8%9B%8B%E8%8A%B1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc4
