<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#084ccf">
<meta name="build" content="standalone">
<title>Dinning · 食谱与买菜（试用版）</title>
<style>:root {
  --bg: #eef7fe;
  --card: #ffffff;
  --ink: #0f2440;
  --muted: #5b7590;
  --line: #d5e8f8;
  --accent: #084ccf;
  --accent-soft: #e6effd; /* 主色浅底：选中态、待办标签 */
  --accent-deep: #0639a3; /* 主色深一档：顶栏渐变、强调 */
  --green: #2f6b4f;
  --red: #b3261e;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(15, 36, 64, .05), 0 6px 20px rgba(15, 36, 64, .07);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 16px;
  line-height: 1.7;
  padding-bottom: calc(min(20vw, 84px) + 16px);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(160deg, #1f63e6, var(--accent-deep));
  color: #fff;
  padding: 14px 16px;
}
.topbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
.build { margin-left: 8px; font-size: 11px; font-weight: 400; opacity: .72; letter-spacing: 0; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); }
.badge.good { background: #cfe9d8; color: #1d4a33; }
.badge.warn { background: #ffe6c7; color: #8a4b04; }
.badge.bad { background: #ffd9d6; color: #8c1d16; }

.view { max-width: 720px; margin: 0 auto; padding: 16px 14px 24px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card h2 { margin: 0 0 10px; font-size: 16px; color: var(--accent); }

.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.muted { color: var(--muted); font-size: 13px; }
.warn { color: var(--accent); }
.over-text { color: var(--red); }
.done { color: var(--green); }

button { font: inherit; cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 9px 16px; font-size: 14px; }
button.secondary { background: #fff; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 14px; }
button.mini { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); }
button.mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.mini.danger-mini { color: var(--red); border-color: #f0c7c3; }
button.danger { background: #fff; color: var(--red); border: 1px solid #f0c7c3; border-radius: 999px; padding: 9px 16px; font-size: 14px; margin-right: auto; }
.fridge-item { cursor: pointer; }
.log-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px dashed #e7f0f9; }
.log-item:last-child { border-bottom: none; }
.log-msg { font-size: 14px; }
.exp-expired { color: var(--red); font-weight: 600; }
.exp-soon { color: var(--accent); font-weight: 600; }
.conflict-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px dashed #e7f0f9; }
.conflict-item:last-child { border-bottom: none; }
.ing-row { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #e7f0f9; }
.ing-row:last-child { border-bottom: none; }
.store-row { display: flex; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #e7f0f9; }
.store-row:last-child { border-bottom: none; }
.store-row .ing-name { flex: 1; font-size: 14px; }
.store-row select { width: 8.5em; padding: 6px 8px; }
.ing-row .ing-name { flex: 1; font-size: 14px; min-width: 0; }
.ing-row input[type="number"], .ing-row input[type="text"] { width: 5.5em; padding: 6px 8px; }
.ing-row input.unit-input { width: 4em; }
.ing-row select.unit-input { width: 4.6em; flex: 0 0 auto; padding: 6px 8px; }
.ing-row input[type="number"] { width: 4.6em; }
.ing-row select { flex: 1; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; }
.chips::-webkit-scrollbar { display: none; }
.pick-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 10px; }
.pick-list:empty { display: none; }
.pick { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; text-align: left; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
.pick.active { border-color: var(--accent); background: var(--accent-soft); }
.pick .muted { font-size: 11.5px; }
.chip { flex: 0 0 auto; font-size: 12.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip .muted { color: inherit; opacity: .68; font-size: 11px; }
/* 日志可能很长，固定高度内部滚动，别把整页撑开 */
.log-list { max-height: min(46vh, 320px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.bar { height: 8px; background: #dfebf7; border-radius: 999px; overflow: hidden; margin: 6px 0 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #2f6b4f, #4f9a72); }
/* 预算条：已付那一段用琥珀色，还要买的那段绿色，超支整条变红（over 放最后，优先级最高） */
.bar i.paid { background: linear-gradient(90deg, #084ccf, #e0a05a); }
.bar i.estimate { background: linear-gradient(90deg, #2f6b4f, #4f9a72); }
.bar i.over { background: linear-gradient(90deg, #b3261e, #e05a4a); }
.legend { display: flex; gap: 14px; font-size: 12.5px; margin: 0 0 4px; }
.legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.legend .dot.paid { background: #d0703a; }
.legend .dot.estimate { background: #3f8663; }
.legend .dot.ok { background: var(--green); }
.legend .dot.soon { background: #d98324; }
.legend .dot.expired { background: var(--red); }
.legend .dot.unknown { background: #c9d9e9; }

/* 食材按新鲜度上色：左边一条色带，扫一眼就知道先吃哪个 */
.fridge-item { border-left: 3px solid transparent; padding-left: 9px; }
.fridge-item.fresh-ok { border-left-color: var(--green); }
.fridge-item.fresh-soon { border-left-color: #d98324; background: #fffaf2; }
.fridge-item.fresh-expired { border-left-color: var(--red); background: #fff6f5; }
.fridge-item.fresh-unknown { border-left-color: #dbe8f4; }

/* 一行单选（采购点 / 位置 / 日期类型）：点一下就是选中，不用先展开下拉 */
.radio-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.radio-row .chip { cursor: pointer; }
.field { display: block; margin: 10px 0 2px; }
.field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }

/* 冰箱库存的分组头：点一下折叠/展开 */
.group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
  margin: 10px 0 2px;
  padding: 8px 10px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  background: #eef7fe;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.group-head .muted { font-weight: 400; }
.over-line { color: var(--red); font-size: 13px; font-weight: 600; margin: 4px 0 0; }
.budget-row { justify-content: space-between; font-size: 13.5px; }

.days { display: flex; flex-direction: column; gap: 10px; }
.day-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
.day-card.today { border-color: var(--accent); }
.day-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.day-name { font-weight: 600; color: var(--accent); }
.today-tag { background: var(--accent-soft); color: var(--accent); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; }
.day-body { margin: 4px 0 8px; font-size: 15px; }
.day-actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* 本周拖动/对调：日期栏右边那个「⠿ 换」既是拖动把手，也是点选对调的入口 */
.day-head-right { margin-left: auto; display: flex; align-items: center; }
.drag-grip {
  font: inherit;
  font-size: 11.5px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--muted);
  touch-action: none; /* 这一小块不参与滚动，手指按住就能拖 */
  cursor: grab;
}
.drag-grip:active { cursor: grabbing; background: var(--accent-soft); }
.lock-note { font-size: 11px; padding: 3px 8px; }
.day-card.draggable .day-head { cursor: grab; }
.day-card.locked { background: #fbfdff; }
.day-card.dragging { opacity: .45; }
.day-card.drop-target { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }
.day-card.swap-armed { border-style: dashed; border-color: var(--accent); }
.day-card.swap-source { border-color: var(--accent); background: var(--accent-soft); }
.swap-row { margin: 0 0 8px; }
.swap-banner { border-color: var(--accent); background: var(--accent-soft); }
.swap-banner h2 { color: var(--accent); }
.drag-hint { margin: 10px 4px 0; }
.drag-ghost {
  position: fixed;
  z-index: 80;
  transform: translate(-50%, -50%);
  max-width: 70vw;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  padding: 7px 14px;
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(15, 36, 64, .3);
  pointer-events: none; /* 不然 elementFromPoint 只会拿到它自己 */
}
body.dragging-day { user-select: none; -webkit-user-select: none; }

.tag { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: #eaf2fa; color: #5b7590; margin-right: 6px; }
.tag.draft { background: #e6effd; color: var(--accent); }
.tag.off { background: transparent; color: #93a9c0; box-shadow: inset 0 0 0 1px #d5e8f8; }
/* 点一下就能补的动作标签（比如库存里的「待补价」） */
button.tag { border: none; font: inherit; font-size: 11.5px; cursor: pointer; }
.tag.todo { background: #e6effd; color: var(--accent); box-shadow: inset 0 0 0 1px #c9dcfb; }
.tag.star { background: #fff6d8; color: #8a6d1a; box-shadow: inset 0 0 0 1px #f0e0b0; }
/* 可点的菜名：点一下进「食材勾选」那一页 */
.link { color: var(--accent); border-bottom: 1px dashed currentColor; cursor: pointer; }

/* 份数滑块：手指能按得准，也不弹输入法 */
.slider-field { margin: 12px 0 6px; }
.slider-field b { color: var(--accent); }
.slider-field input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 30px;
  margin: 4px 0 0;
  background: transparent;
}
.slider-field input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
}
.slider-field input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -10px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
}
.slider-field input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
}
.slider-field input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
}
.slider-ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.tags { margin-top: 6px; }

.list-heading { font-size: 13px; color: var(--accent); letter-spacing: .5px; margin: 14px 0 6px; font-weight: 600; }
.plain-list { list-style: none; margin: 0; padding: 0; }
.shop-item, .fridge-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px dashed #e7f0f9; }
.shop-item:last-child, .fridge-item:last-child { border-bottom: none; }
.shop-main { flex: 1; min-width: 0; }
.shop-name { font-size: 15px; }
.shop-sub { font-size: 12.5px; }
.shop-item.bought .shop-name { color: #93a9c0; text-decoration: line-through; }

input[type="checkbox"] { width: 20px; height: 20px; margin: 4px 0 0; accent-color: var(--accent); }

.stepper { display: flex; gap: 6px; }

label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
label.checkline { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status-row { font-size: 14px; margin-bottom: 10px; }

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #fff;
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  height: min(20vw, 84px);
  border: none;
  border-right: 1px solid var(--line);
  background: #fff;
  color: var(--muted);
  font-size: 12.5px;
}
.tab:last-child { border-right: none; }
.tab.active { background: var(--accent); color: #fff; font-weight: 600; }


.modal-backdrop { position: fixed; inset: 0; background: rgba(43,39,36,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
.modal { background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; }
.modal h3 { margin: 0 0 12px; font-size: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.modal-body { font-size: 14px; }
.modal-body ul { padding-left: 18px; }

.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: rgba(43,39,36,.92); color: #fff; font-size: 13.5px; padding: 9px 16px; border-radius: 999px; z-index: 60; }

/* 「吃的日历」：7 列 = 一周（列序跟着设置里的周起点走） */
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 4px 0 10px; }
.cal-head b { font-size: 14px; white-space: nowrap; }
.cal-head .mini { font-size: 11.5px; padding: 4px 9px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cal-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-height: 42px;
  padding: 3px 1px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font: inherit;
  overflow: hidden;
}
.cal-cell .cal-num { font-size: 11.5px; line-height: 1.2; }
.cal-cell .cal-name { font-size: 9.5px; line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.cal-cell.out-month { opacity: .38; }
.cal-cell.cal-cooked { background: #eaf7f0; border-color: #bfe0cd; }
.cal-cell.cal-cooked .cal-name { color: var(--green); }
.cal-cell.cal-eating_out, .cal-cell.cal-skipped, .cal-cell.cal-leftovers { background: #fffaf2; border-color: #f0dcbb; }
.cal-cell.cal-missed { background: #fff6f5; border-color: #f0c7c3; }
.cal-cell.cal-missed .cal-name { color: var(--red); }
.cal-cell.cal-planned { background: var(--accent-soft); border-color: #c9dcfb; }
.cal-cell.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-cell.selected { border-color: var(--accent); border-width: 2px; }
.cal-week { margin-top: 2px; }
.cal-week-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 4px; border-bottom: 1px dashed #e7f0f9; cursor: pointer; font-size: 13.5px; }
.cal-week-row:last-child { border-bottom: none; }
.cal-week-row.selected { background: var(--accent-soft); border-radius: 8px; }
.cal-week-day { flex: 0 0 5.6em; color: var(--muted); font-size: 12.5px; }
.cal-week-what { flex: 1; min-width: 0; }

@media (min-width: 620px) {
  .modal-backdrop { align-items: center; }
  .modal { border-radius: 16px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>Dinning<span id="build-tag" class="build"></span></h1>
    <span id="sync-badge" class="badge">加载中</span>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="week">本周</button>
  <button class="tab" data-tab="shop">买菜</button>
  <button class="tab" data-tab="recipes">食谱</button>
  <button class="tab" data-tab="fridge">冰箱</button>
  <button class="tab" data-tab="me">我的</button>
</nav>

<div id="modal-root"></div>


<script>
  // 试用版没有服务器：把 schema 和初始食谱库直接内联进来
  window.__DINNING_SCHEMA__ = {
  "$schema": "http://json-schema.org/draft-07/schema#",
  "$id": "https://github.com/Telon-Y/Dinning/blob/main/schema/data.schema.json",
  "title": "Dinning data.json",
  "description": "食谱 + 买菜 + 库存的唯一数据文件格式。手机与电脑复用同一份 schema。",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schemaVersion",
    "settings",
    "foods",
    "recipes",
    "meals",
    "inventoryBatches",
    "purchases",
    "cookLogs",
    "stockLedger"
  ],
  "properties": {
    "schemaVersion": { "type": "integer", "const": 1 },
    "updatedAt": { "type": "string" },
    "settings": { "$ref": "#/definitions/settings" },
    "foods": { "type": "array", "items": { "$ref": "#/definitions/food" } },
    "recipes": { "type": "array", "items": { "$ref": "#/definitions/recipe" } },
    "meals": { "type": "array", "items": { "$ref": "#/definitions/meal" } },
    "inventoryBatches": { "type": "array", "items": { "$ref": "#/definitions/inventoryBatch" } },
    "purchases": { "type": "array", "items": { "$ref": "#/definitions/purchase" } },
    "cookLogs": { "type": "array", "items": { "$ref": "#/definitions/cookLog" } },
    "stockLedger": { "type": "array", "items": { "$ref": "#/definitions/ledgerEntry" } },
    "deletions": { "type": "array", "items": { "$ref": "#/definitions/deletion" } }
  },
  "definitions": {
    "pence": { "type": "integer", "minimum": 0 },
    "unit": {
      "type": "string",
      "enum": ["g", "kg", "ml", "l", "个", "包", "盒", "袋", "块", "把", "勺", "unknown"]
    },
    "baseUnit": { "type": "string", "enum": ["g", "ml", "个"] },
    "location": { "type": "string", "enum": ["fridge", "freezer", "pantry", "counter"] },
    "area": { "type": "string", "enum": ["meat", "fish", "veg", "fruit", "staple", "dairy", "seasoning", "other"] },
    "dateType": { "type": "string", "enum": ["use_by", "best_before", "unknown"] },
    "idString": {
      "type": "string",
      "minLength": 1,
      "maxLength": 64,
      "pattern": "^[A-Za-z0-9_.:-]+$"
    },
    "day": { "type": "string", "pattern": "^\\d{4}-\\d{2}-\\d{2}$" },
    "timestamp": { "type": "string", "minLength": 1 },
    "settings": {
      "type": "object",
      "additionalProperties": false,
      "required": ["household", "budget", "stores"],
      "properties": {
        "household": {
          "type": "object",
          "additionalProperties": false,
          "required": ["defaultServings"],

:1,"unit":"个"},{"foodId":"food_tomato","amount":3,"unit":"个"}],"steps":["虾解冻后彻底吸干水分，用盐、黑胡椒、柠檬皮屑抓匀","大锅烧水加大量盐，意面煮到 al dente，留一杯面汤","冷油下蒜片和干辣椒段，小火慢煸出香味，别炸焦","转大火下虾煎 1 分钟，倒白葡萄酒煮 1 分钟","下意面、面汤和橄榄油，大火翻炒至乳化；法棍抹黄油蒜末烤 3 分钟"],"tags":["快手","家常菜","正餐"],"status":"complete","category":"主食"},{"id":"recipe_mv5g8pwgygxtd","name":"椒盐猪扒","baseServings":2,"ingredients":[{"foodId":"food_pork_chop","amount":400,"unit":"g"},{"foodId":"food_garlic","amount":4,"unit":"个"},{"foodId":"food_ginger","amount":15,"unit":"g"},{"foodId":"food_scallion","amount":2,"unit":"个"},{"foodId":"food_cornflour","amount":40,"unit":"g"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_shaoxing","amount":15,"unit":"ml"},{"foodId":"food_sichuan_pepper","amount":5,"unit":"g"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_veg_oil","amount":60,"unit":"ml"},{"foodId":"food_rice","amount":150,"unit":"g"}],"steps":["猪扒用刀背两面拍松，边缘筋膜剪几刀防卷；加生抽、料酒、姜片、蒜末和一点盐腌 20 分钟","腌好后擦干表面，先蘸蛋液再裹一层薄生粉，抖掉多余的粉","花椒小火干锅焙香后碾碎，和盐按约 1:2 拌成椒盐","平底锅中火下油，猪扒每面煎 3–4 分钟至金黄熟透，取出静置 2 分钟","切条装盘，趁热撒椒盐和葱花，配米饭"],"tags":["快手","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:11:14.080Z","publishedAt":"2026-10-12T16:12:53.505Z","category":"荤菜"},{"id":"recipe_htc_owv90h","name":"可乐鸡翅","baseServings":2,"ingredients":[{"foodId":"food_imp_ttzwjv","amount":10,"unit":"个"},{"foodId":"food_imp_1ez6si2","amount":500,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":18,"unit":"g"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_ginger","amount":2,"unit":"个"},{"foodId":"food_shaoxing","amount":20,"unit":"ml"}],"steps":["鸡翅入锅，倒入冷水淹没。放生姜 1 片和料酒 10 ～ 20 毫升。大火煮开后，撇去浮沫，沥出水分","这一步针对冰鲜鸡翅，刚买来的鸡翅直接改刀用生抽进行腌制即可。","捞出鸡翅，可用刀将两边各划上两口改刀。生抽 10 克腌制鸡翅 10 分钟","锅重新小火起油，先将剩余姜片爆香，然后下入腌好的鸡翅。将鸡翅煎至金黄翻面，用炒菜勺子翻动一下鸡翅，与姜片一起翻炒 4～5 下。","鸡翅金黄，倒入可乐没过鸡翅，开大火将锅中可乐煮沸，然后撇去漂浮的黑色浮沫。此时加入葱结。","调味：加入食用盐 2 克，白糖 10 克，生抽 3 克调味。","等到葱结变黄，和姜片一起捞出，转中火继续慢煮可乐鸡翅。","等到可乐呈现挂丝状态，关小火让汁牢牢挂在鸡翅上。出锅，装盘。"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.534Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%8F%AF%E4%B9%90%E9%B8%A1%E7%BF%85.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.534Z"},"publishedAt":"2026-10-12T16:19:04.174Z","category":"荤菜"},{"id":"recipe_htc_1r1r5mb","name":"宫保鸡丁","baseServings":1,"ingredients":[{"foodId":"food_imp_1czt82d","amount":1,"unit":"个"},{"foodId":"food_imp_h64exi","amount":150,"unit":"g"},{"foodId":"food_ginger","amount":10,"unit":"g"},{"foodId":"food_dried_chili","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2,"unit":"g"},{"foodId":"food_salt","amount":2,"unit":"g"},{"foodId":"food_veg_oil","amount":30,"unit":"g"},{"foodId":"food_cornflour","amount":25,"unit":"g"},{"foodId":"food_shaoxing","amount":15,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":5,"unit":"g"},{"foodId":"food_imp_124i6bx","amount":5,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":2,"unit":"g"},{"foodId":"food_doubanjiang","amount":10,"unit":"g"},{"foodId":"food_imp_raj03c","amount":250,"unit":"g"},{"foodId":"food_imp_w5d9f","amount":5,"unit":"g"},{"foodId":"food_chicken_thigh","amount":1,"unit":"个"}],"steps":["手枪腿用剪刀去骨，鸡肉面用刀背拍打一遍，切条后切至 1.5cm 见方肉丁；泡于清水 10 分钟，捞出控干备用","取大葱葱绿与姜片 5g 于碗中，倒入 50g 开水备用；葱白切 1.5cm 圆粒备用；取花生放入微波炉高火 5 分钟焙干备用","鸡丁中加入盐 2g，老抽酱油 5g，料酒 15g，淀粉 15g 搅拌均匀，至微微发干；缓慢加入部分葱姜水，搅拌鸡丁至粘手；保鲜膜密封，放入冰箱腌制 1 小时","干辣椒切段；起锅，大火烧热转小火；放入干辣椒焙干至微微发糊，捞起备用；花椒焙干至有香味，捞起备用","转大火，倒入 20g 植物油，7 成热下入鸡丁，煎至上面开始发白，用锅铲翻面，煎 30s 后翻炒均匀","下入葱粒翻炒，加入余下葱姜水不够 100g 再加一点清水；盖上锅盖，转中小火焖 2 分钟；","转大火，下入熟花生，干辣椒和花椒；加入鸡精 2g，香醋 5g，白糖 2g，翻炒均匀；","淀粉 10g 加 50g 清水调成水淀粉，加入锅中，翻炒均匀，收汁到自己想要的浓度","关火，淋入芝麻油 10g，即可出锅","莴笋去皮切至 1cm 见方的小块，备用；","二荆条切成 1cm 长段；","手枪腿用剪刀去骨，鸡肉面用刀背拍打一遍，切条后切至 1.5cm 见方肉丁；泡于清水 10 分钟，捞出控干备用；","取大葱葱绿与姜片 5g 于碗中，倒入 50g 开水备用；葱白切 1.5cm 圆粒备用","鸡丁中加入盐 2g，老抽酱油 5g，料酒 15g，淀粉 15g 搅拌均匀，至微微发干；缓慢加入部分葱姜水，搅拌鸡丁至粘手；保鲜膜密封，放入冰箱腌制 1 小时","转中火，倒入 20g 植物油，放入生花生翻炒至其表面微微焦糊，捞起花生但是油留在锅内；","继续加热，7 成热下入鸡丁，放入豆瓣酱，翻炒大概 1 分钟；","加入备好的莴笋丁，继续翻炒 1 分钟；","下入葱粒翻炒，加入余下葱姜水不够 100g 再加一点清水；加入二荆条段；盖上锅盖，转中小火焖 2 分钟；","转大火，下入先前捞起来备用的花生，花椒；加入鸡精 2g，香醋 5g，白糖 2g，翻炒均匀；","淀粉 10g 加 50g 清水调成水淀粉，加入锅中，翻炒均匀，收汁到自己想要的浓度","关火，淋入芝麻油 10g 与油泼辣子 5g 再翻炒 10s，即可出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.550Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%AE%AB%E4%BF%9D%E9%B8%A1%E4%B8%81/%E5%AE%AB%E4%BF%9D%E9%B8%A1%E4%B8%81.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.550Z"},"publishedAt":"2026-10-12T16:19:04.174Z","category":"荤菜"},{"id":"recipe_htc_1ueuuik","name":"小炒肉","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":500,"unit":"g"},{"foodId":"food_imp_2jrak3","amount":4,"unit":"个"},{"foodId":"food_imp_uype7w","amount":4,"unit":"个"},{"foodId":"food_douchi","amount":10,"unit":"g"},{"foodId":"food_doubanjiang","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":10,"unit":"ml"},{"foodId":"food_cornflour","amount":10,"unit":"g"},{"foodId":"food_salt","amount":1,"unit":"g"},{"foodId":"food_scallion","amount":0.5,"unit":"个"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"}],"steps":["五花肉切片","把肉放入器皿内，加入淀粉、老抽、盐搅拌腌制半小时","葱切段","小米椒、朝天椒斜刀切好","热锅、倒油","油热后加入五花肉煸炒。炒至变色后盛出来","向锅中加蒜，煸出香味，加入豆豉，翻炒均匀","加入豆瓣酱翻炒均匀","加入炒好的五花肉继续的翻炒均匀","加入小米椒、朝天椒、葱段翻炒 40 秒","出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.561Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%B0%8F%E7%82%92%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.561Z"},"publishedAt":"2026-10-12T16:19:04.174Z","category":"荤菜"},{"id":"recipe_htc_c8fjy8","name":"孜然牛肉","baseServings":2,"ingredients":[{"foodId":"food_beef_mince","amount":250,"unit":"g"},{"foodId":"food_imp_1i2hntx","amount":2,"unit":"个"},{"foodId":"food_imp_9fe3b","amount":20,"unit":"g"},{"foodId":"food_imp_uype7w","amount":3,"unit":"个"},{"foodId":"food_soy_sauce","amount":20,"unit":"ml"},{"foodId":"food_cornflour","amount":10,"unit":"g"},{"foodId":"food_veg_oil","amount":15,"unit":"ml"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"}],"steps":["首先将小米椒切碎，和孜然粒一起放入捣药罐捣碎成颗粒，这样更入味。如果时间紧张可跳过捣碎步骤","青椒切头去籽，切成丝。葱切段。","牛肉提前解冻，过一边水洗干净，晾干或用厨用纸吸干，将牛肉顺着纹理切成片","然后进行腌肉，加入生抽，淀粉，油，均匀搅拌，静止 30 分钟。腌肉方法也可参考学习腌","热锅下油，放入葱，爆出香味后放入腌好的牛肉煸炒","牛肉变色后均匀放入孜然辣椒颗粒并炒熟","然后下入青椒丝，断生后放盐","大🔥炒 1 分钟后关火再翻炒 30 秒保证受热均匀即可出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.583Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%AD%9C%E7%84%B6%E7%89%9B%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.583Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"荤菜"},{"id":"recipe_htc_1wwxjt","name":"地三鲜","baseServings":2,"ingredients":[{"foodId":"food_imp_1u4vwvt","amount":200,"unit":"g"},{"foodId":"food_potato","amount":150,"unit":"g"},{"foodId":"food_imp_14bub4x","amount":3,"unit":"个"},{"foodId":"food_cornflour","amount":8,"unit":"g"}],"steps":["土豆、茄子、尖椒洗净。","土豆去皮。","茄子、土豆均切成 15g 的不规则的小块。","尖椒用手顺着纹路撕即可，撕成比土豆、茄子略大 25%的块。","尽可能除去青椒表面的水分，避免后续炸的时候炸水。考虑使用厨房纸或风干半小时。","葱切 0.5cm 小段，共取 5g。蒜剁碎成蒜蓉取 15g，分成两份，各 7.5g。姜切沫取 5g。","拿一个空碗，放入生抽 10ml、糖 10g、淀粉 8g，加入 80ml 清水，彻底搅拌均匀，作为调料碗，备用。","热锅，加入 150ml 油。","加入土豆，煎炸 3-4 分钟，以显示金黄色、筷子能轻松扎透为准。","捞出土豆，留下油。","加入茄子，煎炸 2-3 分钟，待其到 7 分熟，以茄子变软、边缘微焦且吐出多余油脂为准。","捞出茄子，留下油。","如果锅内已经没有流动的油，可以考虑补充 15ml 油。","加入尖椒块，煎炸 15 秒，边缘稍微起虎皮后，立刻捞出。倒出锅里的油。","重新热锅，重新加入 15ml 新底油。","放入葱 5g，姜 5g，蒜 7.5g。中小火爆香。","放入豆瓣酱 15ml。转小火，炒出红油和酱香味。","倒入调料碗。立刻转大火，高速搅拌避免糊锅！ 10 秒后汤汁就会开始冒泡并变得黏稠。","立刻放入之前准备好的全部土豆、茄子和尖椒。","翻炒 20 秒，让浓稠的酱汁均匀挂在食材上。","关火，撒入 7.5g 蒜。翻拌均匀，盛盘。"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.612Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E5%9C%B0%E4%B8%89%E9%B2%9C/%E5%9C%B0%E4%B8%89%E9%B2%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.612Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"素菜"},{"id":"recipe_htc_1s01z0h","name":"手撕包菜","baseServings":2,"ingredients":[{"foodId":"food_imp_bk21zo","amount":1,"unit":"个"},{"foodId":"food_pork_belly","amount":200,"unit":"g"},{"foodId":"food_imp_uype7w","amount":2,"unit":"个"},{"foodId":"food_veg_oil","amount":60,"unit":"ml"},{"foodId":"food_shaoxing","amount":5,"unit":"ml"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"},{"foodId":"food_imp_124i6bx","amount":5,"unit":"ml"},{"foodId":"food_imp_157q8t2","amount":2,"unit":"g"},{"foodId":"food_ginger","amount":2,"unit":"个"},{"foodId":"food_spring_garlic","amount":0.5,"unit":"个"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_garlic","amount":1,"unit":"个"}],"steps":["包菜对半切开，去掉中间白色部分【参见图一】","手撕包菜，碗中放入 2 g 盐，清洗包菜并沥干备用【参见图二】","姜片、蒜头、小米辣、蒜苗处理后备用【参见图三】","五花肉切片，清水清洗后备用","锅中加入 30 ml 食用油，倒入包菜翻炒，大火翻炒 1 分钟 后，加入 3 g 盐 ，继续翻炒 2 分钟 后取出备用","锅中加入 30 ml 食用油，倒入五花肉，大火翻炒 1 分钟","倒入姜片等材料，翻炒 1 分钟","倒入包菜翻炒后，加入 香醋、料酒、鸡精、料酒，大火继续翻炒，2 分钟 后出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.627Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E6%89%8B%E6%92%95%E5%8C%85%E8%8F%9C/%E6%89%8B%E6%92%95%E5%8C%85%E8%8F%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.628Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"素菜"},{"id":"recipe_htc_jy7v81","name":"凉拌黄瓜","baseServings":1,"ingredients":[{"foodId":"food_imp_ezw0nx","amount":200,"unit":"g"},{"foodId":"food_imp_135y1u2","amount":7.5,"unit":"ml"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"},{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_salt","amount":0.4,"unit":"g"},{"foodId":"food_imp_166fixj","amount":5,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":5,"unit":"ml"}],"steps":["用菜刀将黄瓜拍扁，再剁成长 3 厘米的碎块","将碎黄瓜装入碗中","将蒜拍碎切成碎末","将碗中放入 5 克白糖，搅拌均匀腌制 15 分钟","将醋，酱油，盐，蚝油和蒜依次倒入碗中搅拌均匀","将香油倒入碗中并均匀搅拌"],"tags":["导入","家常菜"],"status":"complete","createdAt":"2026-10-12T16:18:08.638Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/vegetable_dish/%E5%87%89%E6%8B%8C%E9%BB%84%E7%93%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.638Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"素菜"},{"id":"recipe_htc_1ri0khr","name":"西红柿鸡蛋汤","baseServings":2,"ingredients":[{"foodId":"food_tomato","amount":1,"unit":"个"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_imp_s10r9i","amount":5,"unit":"g"},{"foodId":"food_salt","amount":15,"unit":"g"},{"foodId":"food_imp_166fixj","amount":2,"unit":"个"}],"steps":["将西红柿洗净，切块。","葱姜蒜切碎。","鸡蛋打到碗中，用筷子搅拌均匀。","热锅，并放入 15 毫升的油，待能从油中看到冒出一丝烟时，放入葱姜蒜翻炒 30 秒。","放入西红柿翻炒 1 分钟。","倒入水，水的高度为锅内菜品高度的 1.2 倍，并放入盐。","待开锅后，将鸡蛋液放入，并用筷子将鸡蛋打散，放入味素和香油。","等待 30 秒，关火出锅。"],"tags":["导入","家常菜"],"status":"complete","createdAt":"2026-10-12T16:18:08.674Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/soup/%E8%A5%BF%E7%BA%A2%E6%9F%BF%E9%B8%A1%E8%9B%8B%E6%B1%A4.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.674Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"汤"},{"id":"recipe_htc_9bk8e2","name":"扬州炒饭","baseServings":2,"ingredients":[{"foodId":"food_rice","amount":500,"unit":"g"},{"foodId":"food_eggs","amount":2,"unit":"个"},{"foodId":"food_prawns","amount":10,"unit":"个"},{"foodId":"food_imp_1nt1ljs","amount":150,"unit":"g"},{"foodId":"food_imp_3v0nt5","amount":30,"unit":"g"},{"foodId":"food_carrot","amount":30,"unit":"g"},{"foodId":"food_imp_azxvvp","amount":30,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_veg_oil","amount":30,"unit":"ml"},{"foodId":"food_salt","amount":12,"unit":"g"}],"steps":["胡萝卜切丁 0.2cm*0.2cm*0.2cm，备用","午餐肉切丁 0.2cm*0.2cm*0.2cm，备用","葱分别取葱白和葱绿，各切成 0.25-0.5cm 的小段，分开备用","在碗中打入鸡蛋液，均匀搅拌，备用","将胡萝卜，青豆，玉米粒煮熟捞出，备用","将虾煮熟，捞出备用","热锅热油，可以参考学习炒与煎中的热锅双油","第二次倒油需使用 20-30ml 油，等到第二次凉油热了以后，缓慢倒入鸡蛋不要搅拌","鸡蛋凝固后立刻捞出，备用","将午餐肉，青豆，胡萝卜，玉米粒，虾倒入锅中翻炒 1-2 分钟，装盘备用","水冲一下锅，将杂物冲干净，保证锅内干净","热锅热油，将葱白放入爆香","调至小火，放入米饭，用铲子快速砸击米饭并翻炒，保证米饭均匀沾到油且粒粒分明","倒入鸡蛋，继续砸击，使鸡蛋碎开并与米饭充分混合","转大火，倒入其他所有备用配料，快速翻炒 1-2 分钟","撒入盐，并翻炒至充分混合","撒入葱绿，翻炒 1 分钟","关火，装盘"],"tags":["导入","家常菜","正餐"],"status":"complete","createdAt":"2026-10-12T16:18:08.691Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/staple/%E6%89%AC%E5%B7%9E%E7%82%92%E9%A5%AD/%E6%89%AC%E5%B7%9E%E7%82%92%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:18:08.691Z"},"publishedAt":"2026-10-12T16:19:04.175Z","category":"主食"},{"id":"recipe_htc_43hn10","name":"蒸水蛋","baseServings":2,"ingredients":[{"foodId":"food_eggs","amount":2,"unit":"个"},{"foodId":"food_salt","amount":2,"unit":"g"}],"steps":["鸡蛋打入碗中，打散","取其他容器，倒入 1.5 倍于蛋液的温水，将盐倒入水中化开","将盐水倒入鸡蛋液中，顺时针或逆时针单方向搅拌均匀，气泡之类的可以用舀出丢弃，过筛则口感更加。","使用锡纸包裹盛蛋液的碗，置入提前带盖并加入 3cm 深度水的锅中","中火烧至水开，转最小的火继续蒸 4 分钟"],"tags":["导入"],"status":"complete" amount":2,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":6,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":3.5,"unit":"g"},{"foodId":"food_cornflour","amount":10,"unit":"g"},{"foodId":"food_scallion","amount":15,"unit":"g"},{"foodId":"food_imp_q1obm4","amount":20,"unit":"g"}],"steps":["将鳝鱼切成三段后切成细丝","加入 0.5 g 胡椒粉、3 g 料酒搅拌均匀，再加入 5 g 香油腌制","热油滑锅","加入植物油，烧到 6 成热","加入一半蒜末和全部姜末，翻炒几下","加入鳝丝，中火爆炒 30 秒","边缘淋入 10 g 料酒，翻炒几下","加入生抽，炒匀","加入蚝油、老抽，翻炒几下","加入食用盐、白糖、3 g 胡椒粉，炒匀","淀粉和水混合为水淀粉，倒入锅中，收汁至浓稠","装盘，撒上蒜蓉、葱花","另起锅烧热，加入猪油，烧至七成热，浇在鳝丝上"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.723Z","createdAt":"2026-10-12T16:24:59.723Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E5%93%8D%E6%B2%B9%E9%B3%9D%E4%B8%9D.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.723Z"},"category":"水产"},{"id":"recipe_htc_ns2a1h","name":"小龙虾","baseServings":2,"ingredients":[{"foodId":"food_veg_oil","amount":70,"unit":"ml"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":1,"unit":"个"},{"foodId":"food_imp_pzcj3l","amount":3,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":20,"unit":"g"},{"foodId":"food_dried_chili","amount":5,"unit":"g"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_imp_494k48","amount":30,"unit":"g"},{"foodId":"food_imp_1ljqx7e","amount":30,"unit":"g"},{"foodId":"food_imp_1lxgttf","amount":500,"unit":"ml"},{"foodId":"food_soy_sauce","amount":30,"unit":"ml"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_imp_1xlp45d","amount":1000,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":1,"unit":"个"}],"steps":["小龙虾刷干净去虾线，葱切 2cm 葱段，姜蒜切末。","烧油，油微热, 下香叶、八角、桂皮、青花椒、花椒、子弹头辣椒。","香料出香气之后下锅葱姜蒜","葱姜蒜爆香后，加入郫县豆瓣、黄豆酱，炒出红油。","下小龙虾，翻炒至变色。","加入啤酒，等啤酒烧开后加入生抽，盐。","将小龙虾完全煮熟后出锅。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.737Z","createdAt":"2026-10-12T16:24:59.737Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E5%B0%8F%E9%BE%99%E8%99%BE/%E5%B0%8F%E9%BE%99%E8%99%BE.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.737Z"},"category":"水产"},{"id":"recipe_htc_b829k9","name":"干煎阿根廷红虾","baseServings":2,"ingredients":[{"foodId":"food_imp_i0orpy","amount":2,"unit":"个"},{"foodId":"food_imp_1gb1a1e","amount":5,"unit":"g"},{"foodId":"food_imp_1hlrfb1","amount":20,"unit":"ml"},{"foodId":"food_soy_sauce","amount":1,"unit":"ml"},{"foodId":"food_imp_e0kjvc","amount":3,"unit":"个"},{"foodId":"food_imp_12bynah","amount":1,"unit":"个"},{"foodId":"food_onion","amount":10,"unit":"g"},{"foodId":"food_ginger","amount":10,"unit":"g"},{"foodId":"food_garlic","amount":10,"unit":"g"}],"steps":["阿根廷红虾解冻，最好是提前 1 天从速冻取出放到冷藏里自然解冻，能更好保持风味和口感。可买已经开背去虾线的，节省了不少时间","解冻好的红虾洗净擦干备用，注意这里一定要沥干水分，赶时间可以用厨房用纸吸干水分","生姜切片，洋葱切小方块，香菜洗干净后，叶茎分离，把香菜叶切碎，大蒜压碎切成小块碎末","大火热锅，热锅后倒入两调羹橄榄油，等油温升高后，放入生姜片，洋葱块和香菜茎煸炒","1 分钟后取出生姜，洋葱和香菜茎，弃用","调中大火，放入红虾开始煎，注意所有虾需要单面都完整接触平底锅，煎 2 分钟，同时给每只虾刷上一层油","待底面虾壳有微微焦黄时翻面，并撒入大蒜碎末，轻微晃动平底锅使得受热均匀","1 分钟后添加 20ml 白葡萄酒","再煎 1 分钟后调中小火，均匀撒上一层盐和黑胡椒","给每只虾滴上一滴生抽","撒上香菜叶，装盘","切好柠檬片，摆放到盘边即可"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.752Z","createdAt":"2026-10-12T16:24:59.752Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E5%B9%B2%E7%85%8E%E9%98%BF%E6%A0%B9%E5%BB%B7%E7%BA%A2%E8%99%BE/%E5%B9%B2%E7%85%8E%E9%98%BF%E6%A0%B9%E5%BB%B7%E7%BA%A2%E8%99%BE.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.752Z"},"category":"水产"},{"id":"recipe_htc_sfwmn6","name":"水煮鱼","baseServings":3,"ingredients":[{"foodId":"food_imp_167zm0m","amount":500,"unit":"g"},{"foodId":"food_doubanjiang","amount":40,"unit":"g"},{"foodId":"food_douchi","amount":10,"unit":"g"},{"foodId":"food_imp_1k75cfy","amount":10,"unit":"ml"},{"foodId":"food_imp_1a433w1","amount":25,"unit":"ml"},{"foodId":"food_imp_1q92hdi","amount":3,"unit":"g"},{"foodId":"food_garlic","amount":2,"unit":"个"},{"foodId":"food_salt","amount":5,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":2,"unit":"g"},{"foodId":"food_imp_u8p1dh","amount":1,"unit":"个"}],"steps":["准备：巴沙鱼若是从冷冻柜里取出，需要放室温自然解冻 5 小时再做切片处理。","切片：巴沙鱼撇成薄片， 5cm 长，3cm 宽。","腌制：将切好片的巴沙鱼放入大不锈钢碗中","加入 30g 豆瓣酱，3g 盐，10ml 藤椒油，3g 白胡椒粉","用手抓匀后加入 5ml 菜籽油收尾封住口味","常温静置至少 30 分钟入味。","备菜：大蒜切成蒜末。以 300g 花菜，200g 生菜为例，将花菜与生菜洗净。","焯水与炒菜：花菜开水锅焯水备用；将生菜洗净晾干，炒熟备用。","炒豆瓣酱：热锅冷油，加入 10g 豆瓣酱，10g 豆豉，加入蒜末，中火慢炒。","汆鱼片：加入 150ml 热水，水很快开后加入腌制好的鱼片，轻轻翻动让鱼片在水中散开，加入 2g 盐和 2g 糖调味。水再次沸腾后即可盛盘。","盛盘：先将熟的蔬菜盛至大碗中，然后将热的鱼片盛在蔬菜上面，浇上锅中剩余热汤即可！"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.785Z","createdAt":"2026-10-12T16:24:59.785Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E6%B0%B4%E7%85%AE%E9%B1%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.785Z"},"category":"水产"},{"id":"recipe_htc_fjljej","name":"油焖大虾","baseServings":2,"ingredients":[{"foodId":"food_prawns","amount":10,"unit":"个"},{"foodId":"food_sichuan_pepper","amount":5,"unit":"g"},{"foodId":"food_scallion","amount":50,"unit":"g"},{"foodId":"food_ginger","amount":20,"unit":"g"},{"foodId":"food_imp_1acma4z","amount":30,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_uqqghn","amount":10,"unit":"g"}],"steps":["剪虾枪到根上，虾须虾爪都剪掉，沙包挑掉，开背虾线挑出来，洗净备用","炸料油","油温三成热放花椒，油热离火，放葱姜葱稍微变黄沥油 。","下油，虾摆放整齐，两面变色后轻轻摁虾头","放姜米","黄酒 30g","水两小碗","盐 3g","冰糖 10 克","大火烧开转小火盖盖子闷","皮亮虾弯就可以起锅，虾摆盘","收汁 汤汁剩余 1/4 时。","浇汁","完成","!油焖大虾-预览图-1","开吃✅"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.796Z","createdAt":"2026-10-12T16:24:59.796Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E6%B2%B9%E7%84%96%E5%A4%A7%E8%99%BE/%E6%B2%B9%E7%84%96%E5%A4%A7%E8%99%BE.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.796Z"},"category":"水产"},{"id":"recipe_htc_c3z5ho","name":"烤鱼","baseServings":2,"ingredients":[{"foodId":"food_imp_1czt82d","amount":0.5,"unit":"个"},{"foodId":"food_veg_oil","amount":20,"unit":"ml"},{"foodId":"food_shaoxing","amount":10,"unit":"ml"},{"foodId":"food_imp_5vosw6","amount":5,"unit":"g"},{"foodId":"food_imp_tk77zc","amount":2,"unit":"个"},{"foodId":"food_garlic","amount":8,"unit":"个"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_dried_chili","amount":10,"unit":"个"},{"foodId":"food_imp_1ue1i7w","amount":4,"unit":"个"},{"foodId":"food_celery","amount":2,"unit":"个"},{"foodId":"food_onion","amount":0.5,"unit":"个"},{"foodId":"food_imp_4l1eae","amount":1,"unit":"个"},{"foodId":"food_imp_5sq3ew","amount":1500,"unit":"g"}],"steps":["草鱼从背部切开，两面沿着鱼的背部往下划几刀，不要划到鱼肚皮，不然不易定型","可以用热水浇在鱼身上洗去粘液或者用刷子在流动水龙头下面不停的刷洗，直到摸着没有黏糊糊的手感。","把鱼放到容器中，加入料酒，10g 白胡椒粉，5g 食盐抹匀腌制二十分钟入味。","把半根大葱切成一块一块，大蒜粒中间切开，和八角香叶桂皮放在一个容器中","干辣椒段中间一分为二切开并和灯笼椒装在一个容器中","芹菜切小段","豆芽焯水","千张焯水切成丝","洋葱切成丝。","烤制鱼","家里有烤箱的可以在烤盘刷上底油，鱼皮朝下，直到烤制两面金黄，然后撒上孜然粉","如果没有烤箱，可以热锅热油，锅的两边撒上 2g 食盐，下入草鱼开始煎，刚下入的时候不要着急翻动，等一面定型后再翻面，煎制两面金黄，撒上孜然粉，出锅装在盘子里准备。","锅中撒上 20ml 食用油，等到油热后，把大葱大蒜八角香叶倒入炒香","加上一包火锅底料的一半和 15-20g 豆瓣酱，炒出红油","加入 5g 白糖，10g 食盐，5ml 生抽调味，倒入和食材齐平的清水煮开","依次下入芹菜段，豆芽，千张丝，不用煮熟，稍微烫一下后铺上洋葱丝，放上烤鱼","加入干辣椒，灯笼椒，青花椒","另一个锅烧油，油热后浇在刚加入的辣椒上面激发出香味","最后撒上熟花生米，葱花，白芝麻，香菜","煮 5-6 分钟，美味即成。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.814Z","createdAt":"2026-10-12T16:24:59.814Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquat oodId":"food_imp_1czt82d","amount":30,"unit":"g"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_shaoxing","amount":25,"unit":"g"},{"foodId":"food_imp_1mh9525","amount":1500,"unit":"g"}],"steps":["将鱼清洗干净，确保无鱼鳞等异物","将鱼头朝左，鱼肚朝下，右手持刀。刀竖直切下 1cm，按紧鱼身往左片 3-4cm，再将鱼片中间轻轻划一刀","将鱼放进盆里，然后将大姜切片，大葱切段","用吃奶的力气将大葱大姜里的汁水挤到盆中","加入 20g 盐，25g 料酒，然后给鲤鱼搓个澡，涂抹均匀","!腌制","找个干净的盆，加入 100g 面粉、200g 淀粉、180g 水、5g 盐，用手将其搅拌均匀，面糊此时粘稠呈可拉丝状态，然后打入一个鸡蛋，再次搅匀","等待 30 分钟","将鱼放在案板上，用干毛巾将鱼身上的水擦干","将盆冲洗干净，用干毛巾擦干","起锅烧油，加入 1L 的油，将油温烧至 7 成热， 200-240 度","捏起鱼的尾巴，将鱼头沉入锅底，用勺子往鱼的身上淋热油，待面糊成型后，将鱼慢慢放入锅中，拿锅铲轻轻铲起鱼的头部，然后垫上笊篱。防止底部炸糊。","准备一个盛鱼的盘子，放在锅的旁边。","用锅铲从鱼身处轻轻铲入，两个工具配合鱼翻个身。再炸两分钟，还是同样的方式","将锅中的油倒入擦干的盆中，放置一边，然后将锅刷干净","将 50g 清水、40g 番茄酱、20g 白糖、10g 白醋放入小碗中，搅拌均匀","再准备一个小碗加入 10g 淀粉、10g 水，搅拌成水淀粉","开大火将锅烧热，然后倒入之前准备的料汁，大火烧开，转小火","加入调好的水淀粉，边倒边搅拌，然后 20 秒后关火","将熬好的糖醋汁用勺子均匀地浇在鱼身上，可以加点香菜或葱花点缀，糖醋鲤鱼就做好了","!糖醋鲤鱼-预览图-2"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.876Z","createdAt":"2026-10-12T16:24:59.876Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E7%B3%96%E9%86%8B%E9%B2%A4%E9%B1%BC/%E7%B3%96%E9%86%8B%E9%B2%A4%E9%B1%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.876Z"},"category":"水产"},{"id":"recipe_htc_1awrrn7","name":"红烧鱼","baseServings":2,"ingredients":[{"foodId":"food_garlic","amount":3,"unit":"个"},{"foodId":"food_dried_chili","amount":2,"unit":"个"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_imp_135y1u2","amount":5,"unit":"ml"},{"foodId":"food_soy_sauce","amount":5,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"},{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_imp_uype7w","amount":1,"unit":"个"},{"foodId":"food_imp_1wu37ej","amount":1,"unit":"个"}],"steps":["姜蒜准备好，切碎","干辣椒切碎，和姜蒜一起","加入 30-50ml 油，等待锅热...","放入擦干水分的鱼，然后晃动锅，用热油煎鱼，注意这过程一定要小火","将鱼翻面，重复上面油煎过程","放入姜蒜辣 剪刀把虾身开背，去除虾线。","提前搅拌好芥末酱汁：酱油、蚝油、芥末、盐、糖，搅拌均匀！","洗好香菜，切段备用。","罗氏虾沥干水，锅中加入油，直接放入罗氏虾，中火，外表煎至金黄，捞出。","下入蒜蓉，大火，利用煎虾剩下的油继续煎炒蒜蓉，等到锅中白雾冒出，蒜蓉已经煎出香味，下虾和黄油，让虾充分吸收黄油香味","下入调好的酱汁，继续大火煮沸，翻炒虾，至酱汁收汁，加入酒","在等酱汁稍微收汁，加入香菜翻炒两下，即可出锅。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:24:59.953Z","createdAt":"2026-10-12T16:24:59.953Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/aquatic/%E8%8A%A5%E6%9C%AB%E9%BB%84%E6%B2%B9%E7%BD%97%E6%B0%8F%E8%99%BE/%E8%8A%A5%E6%9C%AB%E9%BB%84%E6%B2%B9%E7%BD%97%E6%B0%8F%E8%99%BE.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:24:59.953Z"},"category":"水产"},{"id":"recipe_htc_18ir7dz","name":"葱油桂鱼","baseServings":2,"ingredients":[{"foodId":"food_scallion","amount":1,"unit":"个"},{"foodId":"food_imp_uype7w","amount":2,"unit":"个"},{"foodId":"food_ginger","amount":50,"unit":"g"},{"foodId":"food_shaoxing","amount":25,"unit":"g"},{"foodId":"food_veg_oil","amount":15,"unit":"g"},{"foodId":"food_salt","amount":8,"unit":"g"},{"foodId":"food_imp_33ryoj","amount":10,"unit":"g"},{"foodId":"food_imp_bqtekb","amount":500,"unit":"g"}],"steps":["去菜市场买已经处理好的鱼，将鱼身表面的所有鳞片刮干净","用厨房用纸将鱼肚子里的贴骨血和黑膜擦干净","用菜刀在鱼身表面来回刮几次，将鱼身的黏液刮掉，进一步去除腥味，然后用清水将鱼内外冲洗干净","将鱼平放在砧板，使用厨房纸将鱼内外的水分擦干，然后鱼头朝左，尾朝右，从鱼鳃边开始，每隔 3cm 纵向划一刀，深度达到鱼的脊椎骨即可，另一面使用同样的处理方式","将鱼平放在盆中，确保盘中没有多余水分","取一块 50g 姜，用削皮刀把表面的皮去除并洗干净，然后切成厚度为 3mm 的姜片","将小米辣洗干净、去蒂，切成厚度为 2mm 的小圆片","将小葱洗干净，去除根须，切成 3cm 的小段，稍微粗一点的小葱，可以沿着小葱生长的方向沿中间劈开","加入 8g 盐，25g 料酒到盆中，带上一次性手套，然后对鱼进行全身按摩 1 分钟，确保鱼身每个部位都均匀涂抹了盐和料酒","按摩好鱼后，在鱼身的每一个刀口中塞入一片姜片，鱼肚子中放入 3 片姜片，腌制 10 分钟","在鱼腌制期间，在蒸锅中加入 5L 清水，烧开后，在蒸锅上放上蒸笼","鱼腌制好后，会析出水分，将多余水分和腌制用料酒、姜片倒掉，用清水冲洗干净鱼身和鱼肚，用厨房纸擦干鱼身和鱼肚","将鱼平放在蒸鱼盘中，重新在鱼身、鱼肚刀口处塞入姜片","然后将蒸鱼盘放入蒸笼中，盖上盖子，中火蒸 20 分钟","期间水蒸气会附着整个鱼和盘子上，凝结后形成鱼汤，出锅后千万不要倒掉这个汤，这个汤汁是鲜味精华","用防烫夹将蒸鱼盘夹出，在鱼身和鱼周围淋上 10g 蒸鱼豉油","然后在鱼身和周围均匀撒上小葱段和小米辣","在铁锅中倒入 15g 植物油，用中小火慢熬 5 分钟，不要用大火，否则油会挥发很快","将出锅后的热油均匀地慢慢地淋在鱼身上，鲜掉眉毛的葱油桂鱼就出炉啦！"],"tags": ，直至棉花糖融化并与无盐黄油均匀融合","20g 奶粉加入锅中，使用刮刀搅拌，奶粉与黄油棉花糖混合物搅拌均匀后立即关火","准备好的所有混合坚果与饼干趁热加入锅中，使用刮刀搅拌","搅拌到温度下降到手可以接触的温度后，戴上一次塑料手套，在锅中搓揉或者双手拿起拉扯，让饼干混合坚果与棉花糖黄油奶粉混合物分散均匀。","将上述步骤混合物压入模具中，边角压实，擀面杖擀平，未满的一边用手尽量压成直边","室温放凉，完全冷却后脱模，按照模具纹路切块，或切成自己喜欢的大小，撒上剩余奶粉，尽量使雪花酥每面都沾上奶粉"],"tags":["导入"],"status":"complete","publishedAt":"2026-10-12T16:25:00.921Z","createdAt":"2026-10-12T16:25:00.921Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/dessert/%E9%9B%AA%E8%8A%B1%E9%85%A5/%E9%9B%AA%E8%8A%B1%E9%85%A5.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:00.921Z"},"category":"甜点"},{"id":"recipe_htc_r7i8tr","name":"魔芋蛋糕","baseServings":2,"ingredients":[{"foodId":"food_imp_1ohestb","amount":50,"unit":"g"},{"foodId":"food_imp_1v6732","amount":10,"unit":"g"},{"foodId":"food_imp_1q4x0n7","amount":10,"unit":"g"},{"foodId":"food_imp_sv5q7o","amount":1,"unit":"g"},{"foodId":"food_eggs","amount":3,"unit":"个"}],"steps":["在准备蛋糕糊之前，可以开始预热烤箱至 350 ℉以节省时间","从冰箱中取出新鲜的鸡蛋","准备两个容器并擦干，分别盛放蛋清与蛋黄","对盛放蛋清的容器，可稍有水珠，但不能有任何油；盛放蛋黄的容器不能有水珠","打蛋，手工或利用分蛋器，将蛋清与蛋黄分离到两个容器中。","分离过程中蛋黄不能破碎，蛋清中不能混有任何蛋黄，否则会严重影响打发。","蛋清中加入 1g 塔塔粉","打蛋器高速，打发蛋白至*粗大气泡的状态*，加入 50g 赤藓糖醇","打蛋器中低速，打发蛋白至*干性发泡*的状态","此时蛋白打发程度已符合要求","打蛋器应尽量贴近容器底部，防止出现上面浮着的表层打发，底部仍然是液体的情况）","把分离的蛋黄加入打发的蛋清中，打蛋器中低速搅拌均匀","蛋清中加入 10g 可可粉和 10g 魔芋粉，先用餐刀翻拌，这是由于如果直接用打蛋器搅拌会造成粉末飞溅","翻拌手法是","先用右手拿刮刀从搅拌盆中心插入面糊底部","向 8 点钟方向刮去直到碰到盆壁，顺势舀起面糊提到空中，然后再移回盆中心将面糊放入盆内","左手握住搅拌盆从 9 点钟方向转到 7 点钟方向，刚好旋转了 60 度，就完成了 1 次循环","速度是 1 秒钟 2 下","此方法出自《小岛老师的蛋糕教室》。用接地气的话说就是，像炒菜一样翻炒。","翻拌结束后，打蛋器低速搅拌均匀","模具铺好烘焙纸，贴合底部与内壁","将蛋糕糊倒入模具，然后用餐刀抹平，再然后震荡几下避免大气泡","烘烤 25 分钟","烤好后，戴好隔热手套取出","将模具从高处落下，震出其中的热气","模具倒扣 10 分钟，使蛋糕冷却","没有冷却的蛋糕立刻脱模会损伤蛋糕","此操作可能会烫手，注意戴好隔热手套","脱模，餐刀切块食用"],"tags":["导入"],"status":"complete","publishedAt":"2026-10-12T16:25:00.935Z","createdAt":"2026-10-12T16:25:00.935Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/desse ps://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.398Z"},"category":"荤菜"},{"id":"recipe_htc_1xqf7yn","name":"卤菜","baseServings":3,"ingredients":[{"foodId":"food_imp_1ryoo5d","amount":1,"unit":"个"},{"foodId":"food_imp_1ljqx7e","amount":15,"unit":"ml"},{"foodId":"food_doubanjiang","amount":15,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":15,"unit":"ml"},{"foodId":"food_imp_1mwwyz7","amount":15,"unit":"ml"},{"foodId":"food_onion","amount":0.5,"unit":"个"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_garlic","amount":40,"unit":"g"},{"foodId":"food_dried_chili","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":180,"unit":"ml"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":30,"unit":"g"},{"foodId":"food_imp_12vdhar","amount":500,"unit":"g"},{"foodId":"food_imp_1lxgttf","amount":1,"unit":"个"}],"steps":["牛腱子提前浸泡在冷水中 3 小时以上，去除血水","准备糖色：锅中加入 30g 白糖，小火加热至糖完全融化并呈现棕褐色，加入 150ml 热水，搅拌均匀备用","将洋葱切块，生姜和大蒜拍碎，干辣椒掰断备用","在锅中加入足量的水，放入卤料包、洋葱、生姜、大蒜、干辣椒，大火烧开","加入黄豆酱、豆瓣酱、蚝油和南腐乳各 15ml，搅拌均匀","倒入准备好的糖色，混合均匀","加入生抽 120ml 和老抽 60ml，搅拌均匀","加入 10-15g 盐调味","倒入 1 罐啤酒，再次烧开","牛腱子放入锅中焯水 2-3 分钟，捞出并用热水冲洗干净表面的浮沫","将焯水后的牛腱子放入已烧开的卤水中，确保卤水没过所有肉类","盖上高压锅盖，上汽后继续烹饪 25-30 分钟","烹饪完成后，不要开盖保温，自然冷却并浸泡一晚上","将卤好的肉取出放入冰箱冷藏，使其成型","食用前取出切片，可直接食用或凉拌","卤水重复使用方法：每次卤完肉后，将卤水过滤，去除所有固体内容物，重新烧开杀菌，冷却后可冷藏或冷冻保存。使用时按原配方比例重新添加调味料。","卤水保存得当可以使用很长时间，且越老越香。","重要提示：如卤制素菜，必须另取一部分卤水，单独使用，并且卤制完素菜的卤水不可重复使用。","将蒜末、葱花、白芝麻、辣椒粉按 1:1:1:1 的比例混合，依个人口味加小米辣，热植物油中加入少量芝麻油或藤椒油，分次泼在调料上，再加入生抽、醋、蚝油各 10ml，5ml 糖，味精/鸡精，最后 15ml 卤汤混合均匀。","凉拌时可搭配拍黄瓜、木耳、油炸花生米、香菜等配菜。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.417Z","createdAt":"2026-10-12T16:25:01.417Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%8D%A4%E8%8F%9C/%E5%8D%A4%E8%8F%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf "amount":10,"unit":"个"},{"foodId":"food_garlic","amount":25,"unit":"g"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":1,"unit":"个"},{"foodId":"food_imp_uqqghn","amount":20,"unit":"g"},{"foodId":"food_imp_1q92hdi","amount":6,"unit":"g"},{"foodId":"food_imp_d0rxnp","amount":6,"unit":"g"}],"steps":["带皮五花肉切成 $0.7cm\\times 0.7cm \\times 2.5cm$ 的细长条","红葱头、大蒜切末备用","鸡蛋煮熟剥壳，并用刀划破蛋白，备用。","大火热锅，锅内放入 15 ml 食用油，让油滑满锅底即可。","放油的目的是防止五花肉刚下锅时粘锅。等待 5s 使油温稍微升高。","放入五花肉条，翻炒至肉色稍微变白，沿锅边淋入米酒 10ml 。继续翻炒至五花肉不再出油。","将切好的红葱头加入锅中，翻炒 1 分钟爆出油葱香味。","将切好的红葱头加入锅中，翻炒 30 秒。","把猪肉推到旁边，放入冰糖加热到融化冒泡变成焦糖，再把猪肉一起翻拌，让焦糖均匀附着。","加入生抽炒出香气。","呛入米酒 25 ml ，水加到淹过猪肉，加入白胡椒粉、五香粉、八角、香叶、水煮蛋，沸腾后转小火卤 1 小时。","注意: 不同酱油的咸淡不一，卤的时候务必试味道，太甜加酱油，太咸加点糖或水调整。","小火炖煮过程中，每隔 15 分钟 搅拌检查一次，防止粘锅。","如发现过干，则可加入 100ml 清水继续炖煮。","1 小时后，开大火收汁直到酱汁浓稠，呈现有光泽的琥珀色，即完成。","炖煮结束后，乘一碗米饭，将软烂的卤肉浇在米饭上，并加上卤蛋，开始享用。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.462Z","createdAt":"2026-10-12T16:25:01.462Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%8F%B0%E5%BC%8F%E5%8D%A4%E8%82%89%E9%A5%AD/%E5%8F%B0%E5%BC%8F%E5%8D%A4%E8%82%89%E9%A5%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.462Z"},"category":"荤菜"},{"id":"recipe_htc_aezkox","name":"咖喱肥牛","baseServings":2,"ingredients":[{"foodId":"food_imp_lb8cxy","amount":1,"unit":"个"},{"foodId":"food_milk","amount":50,"unit":"ml"},{"foodId":"food_onion","amount":100,"unit":"g"},{"foodId":"food_carrot","amount":150,"unit":"g"},{"foodId":"food_potato","amount":200,"unit":"g"},{"foodId":"food_imp_1xgbbhe","amount":300,"unit":"g"},{"foodId":"food_curry_roux","amount":2,"unit":"个"}],"steps":["洋葱切成条状、胡萝卜以及土豆切成块状，备用","烧一锅开水，水沸时将肥牛卷下锅，捞出血沫后放在一边沥水，备用","热锅，锅内放入 10ml - 15ml 食用油，等待 10 秒让油温升高","放入洋葱，翻炒至洋葱变软变透明","放入土豆以及胡萝卜翻炒 2 分钟","加入冷水至淹没所有食材即可","将香叶、咖喱块投入锅中，盖上锅盖，待水沸腾后将火调小然后等待直至土豆块以及胡萝卜块炖至软烂","加入肥牛卷以及牛奶，盖上锅盖再小火煮 2-3 分钟即可出锅"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.492Z","createdAt":"2026-10-12T16:25:01.492Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%92%96%E5%96%B1%E8%82%A5%E7%89%9B/%E5%92%96%E5%96%B1%E8%82%A5%E7%89%9B.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.492Z"},"category":"荤菜"},{"id":"recipe_htc_msixxk","name":"商芝肉","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":500,"unit":"g"},{"foodId":"food_imp_q4yy02","amount":50,"unit":"g"},{"foodId":"food_scallion","amount":10,"unit":"g"},{"foodId":"food_ginger","amount":2,"unit":"g"},{"foodId":"food_imp_tk77zc","amount":3,"unit":"个"},{"foodId":"food_imp_cnd0rf","amount":15,"unit":"g"},{"foodId":"food_imp_135y1u2","amount":5,"unit":"g"},{"foodId":"food_shaoxing","amount":15,"unit":"g"},{"foodId":"food_imp_1yrbk38","amount":1.5,"unit":"g"},{"foodId":"food_soy_sauce","amount":10,"unit":"g"},{"foodId":"food_eggs","amount":15,"unit":"g"},{"foodId":"food_salt","amount":1,"unit":"g"},{"foodId":"food_imp_9fbbly","amount":200,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"g"},{"foodId":"food_imp_4jw64v","amount":2000,"unit":"g"}],"steps":["将肉刮洗干净，入煮锅煮至六成熟，捞出趁热用蜂蜜、醋涂抹肉皮。","炒锅内放入熟猪油，用旺火烧至八成熟，将肉块皮朝下投入，炸至呈金红色时，捞入凉肉煮锅中泡软，放在案板上，切成三寸长、两分厚的片，仍然皮朝下，整齐装入蒸碗内。","将 5 克大葱切成 2.4 cm 长的段，5 克切成 2.4 cm 长的斜形片。姜去皮洗净，1.5 克切成片，5 克切成末，摊的鸡蛋皮切成 2.4 cm 长的等腰三角形片。","商芝入沸水锅中煮软捞出，去除老茎、杂质，淘洗干净，切成 3 cm 长的段，放入碗中,加酱油、精盐、熟猪油拌匀，盖在肉片上，另将鸡汤放入一小碗中，加酱油、精盐、料酒搅匀，浇入蒸碗，再放入姜片、葱段、八角上笼用旺火蒸半小时后，转用小火继续蒸一小时三十分钟，熟烂后取出，拣去姜、葱、八角，倒、过滤原汁，将肉扣入汤盘。","炒锅内，放入鸡汤，加入原汁，用旺火烧沸，下入姜末、葱片、味精后搅匀，投入摊鸡蛋皮，淋芝麻油，浇入汤盘即成。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.508Z","createdAt":"2026-10-12T16:25:01.508Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%95%86%E8%8A%9D%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.508Z"},"category":"荤菜"},{"id":"recipe_htc_1ij576d","name":"啤酒鸭","baseServings":2,"ingredients":[{"foodId":"food_imp_hqtqcj","amount":0.5,"unit":"个"},{"foodId":"food_imp_1lxgttf","amount":800,"unit":"ml"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_ginger","amount":5,"unit":"个"},{"foodId":"food_garlic","amount":12,"unit":"个"},{"foodId":"food_imp_uqqghn","amount":10,"unit":"g"},{"foodId":"food_dried_chili","amount":5,"unit":"个"},{"foodId":"food_shaoxing","amount":30,"unit":"ml"},{"foodId":"food_salt","amount":8,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":5,"unit":"g"},{"foodId":"food_imp_1xm7x1r","amount":4,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":3,"unit":"个"},{"foodId":"food_imp_lb8cxy","amount":3,"unit":"个"},{"foodId":"food_doubanjiang","amount":20,"unit":"g"}],"steps":["把鸭子切成 3 cm 小块，鸭肉冷水下锅，加姜片、料酒，焯一遍水，盛出沥干水分，备用。","炒锅烧热，放入 100ml 食用油，大火待油烧开，鸭肉入锅翻炒至上色。","待鸭肉完全变色，将鸭肉拨到锅的一边，倒入豆瓣酱和糖，小火翻炒出香味和糖色。","加入丁香、八角、香叶、干辣椒、生抽、老抽、蒜，翻炒出香味。","倒入啤酒，没过鸭肉，加入盐、鸡精，然后中火将鸭子烧 30 分钟。","出锅盛盘，上桌食用。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.524Z","createdAt":"2026-10-12T16:25:01.524Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%95%A4%E9%85%92%E9%B8%AD/%E5%95%A4%E9%85%92%E9%B8%AD.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.524Z"},"category":"荤菜"},{"id":"recipe_htc_txml9d","name":"土豆炖排骨","baseServings":3,"ingredients":[{"foodId":"food_imp_1euzvk8","amount":750,"unit":"g"},{"foodId":"food_potato","amount":300,"unit":"g"},{"foodId":"food_ginger","amount":30,"unit":"g"},{"foodId":"food_scallion","amount":25,"unit":"g"},{"foodId":"food_shaoxing","amount":25,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":10,"unit":"g"},{"foodId":"food_dried_chili","amount":5,"unit":"g"},{"foodId":"food_imp_tk77zc","amount":1,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":1,"unit":"g"},{"foodId":"food_imp_pzcj3l","amount":1,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"ml"},{"foodId":"food_imp_kh9r1f","amount":5,"unit":"ml"},{"foodId":"food_imp_1ljqx7e","amount":5,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_veg_oil","amount":20,"unit":"ml"}],"steps":["处理土豆： 将 300g 土豆去皮，切成不规则的滚刀块 。切好后立刻泡入一盆清水中，隔绝氧气防止表面氧化发黑，备用。","处理葱姜： 将 30g 姜全部切成薄片。将 25g 小葱处理好：15g 挽成一个葱结，剩余 10g 切成细小葱花备用。","封装酱汁碗： 拿一个小碗，依次加入 10ml 生抽、5ml 老抽、5ml 蚝油、5ml 黄豆酱，彻底搅拌均匀，放在灶台触手可及处备用。","封装香料碟： 拿一个小碟，放入 5g 干辣椒、1g 八角、1g 花椒、1g 桂皮，以及刚才切好的 15g 姜片，备用。","开启异步水程： 按下电热水壶开关，开始烧制 700ml 开水。。","冷水焯水： 将 750g 肋排冷水下锅，加入 15g 葱结、15g 姜片、15ml 料酒。大火煮沸后，继续保持沸腾焯水 2 分钟，逼出内部血沫。","热洗冷防： 捞出排骨，必须用热水将排骨表面残留的浮沫清洗干净。","绝对脱水： 洗净的排骨必须用厨房纸彻底吸干表面水分，装盘放在炒锅旁边备用。","炒制糖色： 热锅凉油，加入 20ml 食用油。将 10g 白糖倒入锅中，中小火不停搅拌。翻炒至白糖完全融化冒泡，并呈现红棕色的焦糖色 。","上色煎制： 迅速加入彻底脱水的 750g 排骨，转中大火翻炒。煎制 2-3 分钟，至排骨两面微微金黄，且均匀裹满焦糖色。","一键爆香： 在锅中拨出一小块空地，直接倒入【香料碟】。利用锅底的热油爆香 10 秒，激发出香料的脂溶性香气。","一键调味： 顺着热锅边缘淋入剩余的 10ml 料酒激发出锅气。紧接着直接倒入【酱汁碗】，翻炒 30 秒，让酱料完全包裹排骨并炒出浓郁酱香。","加水长炖： 此时电热水壶已沸腾，直接加入 700ml 滚烫的开水，大火烧开。随后盖上锅盖，转小火持续焖煮 40 分钟。","加入土豆： 40 分钟后打开锅盖，将泡在水里的 300g 土豆捞出沥干，下入锅中。重新盖上锅盖，继续小火焖煮 15-20 分钟，直到用筷子能轻松扎透土豆块。","调味收汁： 打开锅盖，加入 3g 盐。转大火开始翻炒收汁，需要 3-5 分钟。直到汤汁变得浓稠，均匀地挂在排骨和土豆上即可关火。","点缀出锅： 盛盘出锅，在表面均匀撒上预处理好的 10g 葱花作为 UI 点缀即可。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.555Z","createdAt":"2026-10-12T16:25:01.555Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%9C%9F%E8%B1%86%E7%82%96%E6%8E%92%E9%AA%A8/%E5%9C%9F%E8%B1%86%E7%82%96%E6%8E%92%E9%AA%A8.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.555Z"},"category":"荤菜 :150,"unit":"g"},{"foodId":"food_salt","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":60,"unit":"g"},{"foodId":"food_shaoxing","amount":25,"unit":"g"},{"foodId":"food_garlic","amount":50,"unit":"g"},{"foodId":"food_ginger","amount":10,"unit":"g"},{"foodId":"food_imp_tk77zc","amount":3,"unit":"个"},{"foodId":"food_imp_pzcj3l","amount":5,"unit":"g"},{"foodId":"food_scallion","amount":200,"unit":"g"}],"steps":["将肘子刮洗干净，肘头朝外、肘把朝里、肘皮朝下放在案板上。","用刀在正中由肘头向肘把沿着腿骨将皮剖开，剔去腿骨两边的肉，底部骨与肉相连，使骨头露出，然后将两节腿骨由中间用刀背砸断。","肘子放入煮锅煮至七成熟捞出，用干净抹布擦干水，趁热用红酱油涂抹肉皮。","取蒸锅一个，锅底放入八角、桂皮，先将肘把的关节处用手掰断，不伤外皮，再将肘皮朝下装进蒸锅内，装锅时根据肘子体型，将肘把贴住锅边窝着装进锅内，成为圆形。","撒入精盐，用消过毒的干净纱布盖在肉上，再将甜面酱、葱、红豆腐乳、红酱油、白酱油、姜、蒜等在纱布上抹开，用旺火蒸三小时。","蒸完取出，揭去纱布，扣入盘中，拣去八角，上桌时另带葱段和甜面酱小碟。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.803Z","createdAt":"2026-10-12T16:25:01.803Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%B8%A6%E6%8A%8A%E8%82%98%E5%AD%90.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.803Z"},"category":"荤菜"},{"id":"recipe_htc_1wyubk9","name":"干煸仔鸡","baseServings":2,"ingredients":[{"foodId":"food_chicken_thigh","amount":400,"unit":"g"},{"foodId":"food_potato","amount":200,"unit":"g"},{"foodId":"food_imp_1i2hntx","amount":60,"unit":"g"},{"foodId":"food_garlic","amount":10,"unit":"g"},{"foodId":"food_salt","amount":3,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":3,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":2,"unit":"g"},{"foodId":"food_soy_sauce","amount":7,"unit":"g"},{"foodId":"food_shaoxing","amount":5,"unit":"g"},{"foodId":"food_cornflour","amount":20,"unit":"g"},{"foodId":"food_doubanjiang","amount":40,"unit":"g"},{"foodId":"food_imp_1fxvmfu","amount":30,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":2,"unit":"g"}],"steps":["鸡腿去骨，鸡腿肉用刀背砸一砸，切成 2cm 的块。","鸡腿肉中加入盐、鸡精、胡椒粉、生抽、老抽、料酒，抓拌至粘手时加入淀粉拌匀，加入食用油防止粘连，腌制 30 分钟。","土豆去皮，切成 2cm 的块，沸水煮 5 分钟后捞出，控干水分，防止油炸时爆锅。","青椒去籽，切成 2cm 小片，放在笊篱中备用。","锅中加入宽油，油温烧至 180℃ 时，下入土豆块炸 3 分钟后捞出。","待油温再次升高到 180℃时，下入鸡块炸 2 分钟后捞出。","待油温再次升高到 180℃时，下入鸡块复炸 1 分钟后捞出。","待油温再次升高到 180℃时，下入土豆块复炸 1 分钟后，将锅中的油和土豆块经过笊篱过滤倒出，让笊篱上的青椒片断生。","锅中加入 5ml 食用油，小火煸炒蒜瓣至发黄，下入红油豆瓣酱煸炒出香，下入白糖炒融化，下入花椒碎，加 40ml 清水，不停搅拌至酱汁粘稠。","下入炸好的鸡块、土豆块、青椒片，搅拌均匀后出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.821Z","createdAt":"2026-10-12T16:25:01.821Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E5%B9%B2%E7%85%B8%E4%BB%94%E9%B8%A1/%E5%B9%B2%E7%85%B8%E4%BB%94%E9%B8%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.821Z"},"category":"荤菜"},{"id":"recipe_htc_1mo05d5","name":"广式萝卜牛腩","baseServings":4,"ingredients":[{"foodId":"food_imp_c89quh","amount":500,"unit":"g"},{"foodId":"food_imp_puaytl","amount":1,"unit":"个"},{"foodId":"food_ginger","amount":8,"unit":"个"},{"foodId":"food_garlic","amount":5,"unit":"个"},{"foodId":"food_imp_wvpycd","amount":1,"unit":"个"},{"foodId":"food_imp_tk77zc","amount":2,"unit":"个"},{"foodId":"food_dried_chili","amount":2,"unit":"个"},{"foodId":"food_imp_lb8cxy","amount":2,"unit":"个"},{"foodId":"food_imp_1jet1hb","amount":1,"unit":"个"},{"foodId":"food_imp_13gumeg","amount":30,"unit":"g"},{"foodId":"food_imp_kh9r1f","amount":15,"unit":"g"},{"foodId":"food_soy_sauce","amount":30,"unit":"g"},{"foodId":"food_imp_uqqghn","amount":10,"unit":"g"},{"foodId":"food_salt","amount":5,"unit":"g"}],"steps":["萝卜滚到切块备用","牛腩整块焯水，加入 2 片姜和一把葱结，等水开之后煮 5-10 分钟，然后捞出切件","将牛腩切块，切成自己喜欢的大小","准备焖牛腩的酱料，将南乳、柱侯酱、酱油、蚝油、糖、盐按上面的量调和","热锅下油，将姜蒜爆香，放入牛腩，炒至干身，加入调好的酱料，炒香，如果喜欢色泽浓一点的可以加一点老抽润色一下","调料充分混合之后倒入热水","将牛腩换到汤锅中，放入桂皮、八角、香叶和干辣椒，焖大概 2 个小时","牛腩焖到半软之后加入白萝卜继续焖 30 分钟","等到萝卜焖软之后就完成，一锅浓香的萝卜牛腩就完成了"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.835Z","createdAt":"2026-10-1 oodId":"food_imp_169x0ru","amount":50,"unit":"g"},{"foodId":"food_imp_kh9r1f","amount":20,"unit":"g"},{"foodId":"food_soy_sauce","amount":65,"unit":"g"},{"foodId":"food_imp_d20cm0","amount":20,"unit":"g"}],"steps":["先把辅料备好：","碗 1：姜切成 1.5cm\\*1.5cm 的小块，半头蒜剥好皮，如果有小米辣切成 1cm 小段","碗 2：放入 2 片香叶，0.5g 花椒，2 个八角，3 个干辣椒，3 个丁香， 2 片甘草","碗 3: 放入 2 块南乳","碗 4: 放入 15g 豆瓣酱","碗 5: 放入 10g 冰糖","碗 6：倒入花雕酒 10g 和白酒 10g","碗 7：加入 50g 柱候酱，20g 蚝油，20g 叉烧酱，5g 老抽，60g 生抽","牛肉不用切，直接冷水下锅，开大火焯水，水沸腾时将牛肉捞出","冲洗牛肉表面的杂质后，切成 4cm\\*4cm\\*4cm 的大块，控干水后放入碗中备用","大火，热锅下油，把碗 1倒入锅中，炒香","中小火，倒入碗 2，翻炒均匀，大概 30 秒","中小火，放入碗 3，用锅铲把南乳压碎","中小火，放入碗 4，翻炒均匀，大概 30 秒","中小火，放入碗 5，炒至融化","中小火，下入牛腩，炒至牛肉上色","大火，沿锅边淋入碗 6，快速翻炒，炒至牛肉表面略微焦褐","倒入碗 7，快速翻炒，留意底层汁水，炒至不停冒小气泡，汤汁略微浓稠","将锅内全部食材转移至另一个炖煮锅或高压锅，加水淹过食材","根据使用的锅来选择炖肉的时间：","a. 普通炖煮锅：小火炖煮 3 个小时","b. 高压锅：压 40 分钟","时间到后开盖调味，如果不够咸加盐或生抽，不够甜则同理加糖","调好味道后便可以把牛腩先捞出","如果要吃萝卜土豆，则削皮切成 2cm 厚片倒入锅中煮 10 - 15 分钟，如果是高压锅则在加压煮 5 分钟","煮好后捞出萝卜土豆和牛腩放一起","把汤汁过滤淋入碗中"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.945Z","createdAt":"2026-10-12T16:25:01.945Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%9F%B1%E5%80%99%E7%89%9B%E8%85%A9/%E6%9F%B1%E5%80%99%E7%89%9B%E8%85%A9.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.945Z"},"category":"荤菜"},{"id":"recipe_htc_1prygzd","name":"梅菜扣肉","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":200,"unit":"g"},{"foodId":"food_imp_120n76c","amount":30,"unit":"g"},{"foodId":"food_imp_d0rxnp","amount":2,"unit":"g"},{"foodId":"food_veg_oil","amount":300,"unit":"ml"},{"foodId":"food_imp_1fxvmfu","amount":5,"unit":"g"},{"foodId":"food_soy_sauce","amount":50,"unit":"ml"},{"foodId":"food_imp_uype7w","amount":1,"unit":"个"},{"foodId":"food_garlic","amount":10,"unit":"g"},{"foodId":"food_imp_5vosw6","amount":2,"unit":"g"},{"foodId":"food_imp_157q8t2","amount":2,"unit":"g"}],"steps":["梅菜放到清水中，浸泡 1 小时","锅中倒入 50 ml 食用油，将整个五花肉猪皮朝下，放到锅中 1 分钟 ，取出挂掉猪皮 【可选】","锅中加入开水，放入五花肉，大火煮 20 分钟 ，取出五花肉","在五花肉表面涂抹均匀老抽、五香粉、白砂糖，放置 15 分钟","起锅烧油，加入五花肉，中火油炸直至两面金黄色","起锅烧油，倒入梅菜，加上小米椒、蒜蓉、鸡精、食用盐后翻炒，直至炒干梅干菜水分","五花肉切片,放在大碗中，散上梅干菜","中火蒸 45 分钟","拿个盘子倒盖在五花肉大碗中，将五花肉倒在盘子中"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.975Z","createdAt":"2026-10-12T16:25:01.975Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%A2%85%E8%8F%9C%E6%89%A3%E8%82%89/%E6%A2%85%E8%8F%9C%E6%89%A3%E8%82%89.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:01.975Z"},"category":"荤菜"},{"id":"recipe_htc_1evmgdf","name":"椒盐排条","baseServings":2,"ingredients":[{"foodId":"food_imp_lkxjcs","amount":4,"unit":"个"},{"foodId":"food_salt","amount":1,"unit":"g"},{"foodId":"food_imp_1q62p6q","amount":10,"unit":"g"},{"foodId":"food_imp_1fgd3w","amount":100,"unit":"ml"},{"foodId":"food_imp_1ezzi84","amount":80,"unit":"g"},{"foodId":"food_cornflour","amount":80,"unit":"g"},{"foodId":"food_imp_f45oho","amount":2,"unit":"g"},{"foodId":"food_veg_oil","amount":10,"unit":"g"},{"foodId":"food_eggs","amount":1,"unit":"个"}],"steps":["大排洗干净，剔骨，用刀面拍松，切成厚片，再改成粗条。","加入椒盐粉，搅匀，待到出胶质了分次加入葱姜水，放入冰箱腌制 20 分钟。","制作炸糊。放入 80 g 面粉，20 g 淀粉，2 - 3 g 吉士粉，盐 1 g。","打入一个鸡蛋，搅拌，再分次加入水 100 g ，再加 10 g 油，反复搅拌。直到炸糊完全调开，略粘稠即可。","取出剩余的 60 g 淀粉，取出排条，裹上一层淀粉，再裹上面糊。","锅中加入油，能没过食材即可，加热到 150 ℃ - 160 ℃ 。下入排条炸成浅金黄色后捞出。刚下入排条时可能会有粘连，不要动。待排条定型后可用筷子翻动，即可分开。","待油温再次升高到 150 ℃ - 160 ℃ 时，下入排条复炸至金黄色后捞出。","撒上椒盐粉，搅拌均匀后出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:01.991Z","createdAt":"2026-10-12T16:25:01.991Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%A4%92%E7%9B%90%E6%8E%92%E6%9D%A1.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311 imp_157q8t2","amount":1.5,"unit":"g"},{"foodId":"food_soy_sauce","amount":5,"unit":"g"},{"foodId":"food_imp_5vosw6","amount":5,"unit":"g"},{"foodId":"food_imp_9d46eh","amount":2,"unit":"g"},{"foodId":"food_shaoxing","amount":3,"unit":"g"},{"foodId":"food_eggs","amount":1,"unit":"个"},{"foodId":"food_potato","amount":7,"unit":"g"},{"foodId":"food_veg_oil","amount":280,"unit":"g"},{"foodId":"food_imp_1a433w1","amount":200,"unit":"g"},{"foodId":"food_imp_cua33z","amount":100,"unit":"g"},{"foodId":"food_imp_1mqtvb","amount":1,"unit":"个"},{"foodId":"food_imp_1fxvmfu","amount":1,"unit":"g"},{"foodId":"food_dried_chili","amount":20,"unit":"g"},{"foodId":"food_sichuan_pepper","amount":5,"unit":"g"}],"steps":["里脊肉改刀成小块，再切成 2 毫米薄片，放入碗中，加入清水清洗两遍来去除血水和杂质，捞出挤干水分备用。","碗中加入食用盐 1.5g，胡椒粉 1g，生抽酱油 5g，料酒 3g，然后朝着一个方向搅拌 2 分钟，使其入味。","另外准备一个碗，加入一个鸡蛋清，加入 7g 土豆淀粉，一个方向搅拌均匀，倒入肉中","再次一个方向搅拌均匀","最后再加入 30g 植物油轻轻搅拌。","绿豆芽 100g，凤尾 1 根，芹菜 3 根切成小段，蒜苗 2 根拍散切成小段。","大蒜 20g 剁碎，生姜小块剁碎，红泡椒 20g 剁碎。","小米辣干辣椒 15g，青花椒 3g，锅内加入油滑锅，油稍许热了将多余的倒出备用留 50g 底油，下入干辣椒、花椒，开小火炒香，切记不要炒糊，倒出在菜板上剁细。","锅烧热，放入 100g 植物油烧至 6 成热，加入 2g 青花椒、干辣椒爆香，配菜下锅，加入 1g 食用盐，炒至断生，盛入碗中垫底备用。","锅洗干净，加入 150g 植物油烧至 6 成热，加入制作好的姜蒜红泡椒，爆香后加入豆瓣 10g，开小火把豆瓣爆香炒出红油即可。","加入 800 毫升清水，大火烧开，转小火调味，加入食用盐 2.5g，鸡精 1.5g，1g 白砂糖提鲜，1g 胡椒粉，5g 水淀粉将汤汁收浓稠一点。","汤汁开后，开小火将腌制好的肉片分开依次下锅，然后开中火将肉片烫熟，用锅铲轻轻推动一下避免粘连，待汤汁烧开，肉片熟后捞出放入碗中配菜上，再将原汤倒入。","碗中均匀撒上刀口辣椒、蒜蓉和葱花。","锅洗干净，加入 200g 菜籽油，烧至 7 成热，然后一次性均匀泼在碗中肉片上，美味完成。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.022Z","createdAt":"2026-10-12T16:25:02.022Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%B0%B4%E7%85%AE%E8%82%89%E7%89%87.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.022Z"},"category":"荤菜"},{"id":"recipe_htc_1acephl","name":"淄博烧烤","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":200,"unit":"g"},{"foodId":"food_imp_37h7xy","amount":5,"unit":"个"},{"foodId":"food_imp_1czt82d","amount":1,"unit":"个"},{"foodId":"food_imp_qn1vs8","amount":20,"unit":"g"},{"foodId":"food_imp_e3us72","amount":15,"unit":"g"}],"steps":["五花肉切成厚度不超过 2cm 长的块，并串成串。","大葱切成 5cm 长的葱段，备用","芝麻酱加 10ml 温水调稀，与甜面酱混合均匀，备用","点燃炭火，等待炭火烧至通红无明火状态","将五花肉串均匀摆在在烤网上，烤至*底面焦黄出油*后翻面","继续烤制 2 - 3 分钟，至*两面焦黄、边缘微焦*后取下","取一张小薄面饼平铺，抹上 3 - 4g 混合酱料","放上烤好的肉片和 1 - 2 段大葱，卷起即可食用"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.054Z","createdAt":"2026-10-12T16:25:02.054Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%B7%84%E5%8D%9A%E7%83%A7%E7%83%A4/%E6%B7%84%E5%8D%9A%E7%83%A7%E7%83%A4.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.054Z"},"category":"荤菜"},{"id":"recipe_htc_vk02tl","name":"清蒸鳜鱼","baseServings":2,"ingredients":[{"foodId":"food_imp_1lskz8l","amount":500,"unit":"g"},{"foodId":"food_scallion","amount":2,"unit":"个"},{"foodId":"food_soy_sauce","amount":30,"unit":"g"},{"foodId":"food_dried_chili","amount":1,"unit":"个"},{"foodId":"food_ginger","amount":3,"unit":"个"},{"foodId":"food_veg_oil","amount":20,"unit":"ml"},{"foodId":"food_imp_1czt82d","amount":1,"unit":"个"}],"steps":["食材处理：","鳜鱼从腹部切开，去除鱼鳃和内脏，打去鱼鳞，用到在表皮上刮去粘液","鳜鱼身上打上花刀，放姜片，有条件的可以放点猪油，装盘在下面垫一个筷子，便于蒸制时受热均匀","大葱划开后去除中间的芯，只保留外面两层","小葱划开备用","红椒去除辣椒籽和里层辣椒肉备用","将准备好的大葱、小葱、辣椒码在一起，切成丝泡在水里备用","炒制过程：","锅里加水，水量大一些，水热后放入鳜鱼，盖上锅盖，大火蒸制 8 - 10 分钟，蒸鱼四字窍门：汽大火足","蒸鱼过程，另起一个过热油，油需要烧到冒烟","蒸制结束后，倒掉蒸鱼的水，去除姜片，放上葱丝，浇上热油","在倒入生抽或蒸鱼豉油即可上桌"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.069Z","createdAt":"2026-10-12T16:25:02.069Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E6%B8%85%E8%92%B8%E9%B3%9C%E9%B1%BC/%E6%B8%85%E8%92%B8%E9%B3%9C%E9%B1%BC.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa 辣椒粉、孜然粒、烧烤撒料、孜然粉、白芝麻，翻炒均匀。","加入糖和盐，翻炒均匀。","翻炒均匀后即可关火，盛盘。"],"tags":["导入","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.145Z","createdAt":"2026-10-12T16:25:02.145Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%85%8E%E7%83%A4%E7%BE%8A%E6%8E%92/%E7%85%8E%E7%83%A4%E7%BE%8A%E6%8E%92.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.145Z"},"category":"荤菜"},{"id":"recipe_htc_1179xn8","name":"猪肉烩酸菜","baseServings":2,"ingredients":[{"foodId":"food_pork_belly","amount":1500,"unit":"g"},{"foodId":"food_imp_1m2fdug","amount":1000,"unit":"g"},{"foodId":"food_imp_1czt82d","amount":1,"unit":"个"},{"foodId":"food_ginger","amount":100,"unit":"g"},{"foodId":"food_garlic","amount":4,"unit":"个"},{"foodId":"food_salt","amount":10,"unit":"g"},{"foodId":"food_soy_sauce","amount":15,"unit":"g"},{"foodId":"food_imp_d0rxnp","amount":10,"unit":"g"},{"foodId":"food_shaoxing","amount":20,"unit":"ml"},{"foodId":"food_imp_omoqrx","amount":2,"unit":"个"}],"steps":["大葱切段；生姜 50 克切段， 50 克切末；大蒜切末，备用。","全部酸菜切丝，用水冲洗 2 ～ 3 遍备用。","排骨和五花肉入锅，倒入冷水淹没。放入全部葱段， 50 克生姜段和料酒 20 毫升。大火煮开后，等待 5 分钟。关火，将排骨和五花肉捞出，冷水冲洗掉浮沫，备用","煮好的五花肉切片或者切块，备用。","将之前的锅洗干净，并且擦干。","锅中加入油，开中火，放入姜蒜末爆香，放入五花肉和排骨。将五花肉和排骨煎至金黄，倒入 10 克五香粉和 15 克 生抽酱油，用铲子翻动 1 ～ 2 分钟。","将冲洗好的酸菜丝加入锅中，翻炒 3 分钟。","倒入纯净水至刚好没过食材，加入 2 颗大料，转大火，直到锅中水沸腾。转中火，盖锅盖焖煮。","等待 1.5 ～ 2 小时，直至五花肉软烂","掀开锅盖，开大火收汤，翻动锅中食材直至锅中剩余水分只覆盖锅底，转小火，准备调味。","调味：加入食用盐 10 克，搅拌均匀。","关火，出锅。"],"tags":["导入","家常菜","正餐"],"status":"complete","publishedAt":"2026-10-12T16:25:02.192Z","createdAt":"2026-10-12T16:25:02.192Z","source":{"url":"https://raw.githubusercontent.com/Anduin2017/HowToCook/master/dishes/meat_dish/%E7%8C%AA%E8%82%89%E7%83%A9%E9%85%B8%E8%8F%9C.md","repository":"https://github.com/Anduin2017/HowToCook","commit":"3dfa950f6daf0a5b311fc46619f1b559bac980c4","license":"Unlicense","retrievedAt":"2026-10-12T16:25:02.192Z"},"
