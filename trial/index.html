        paidPending
          ? `<p class="muted">${isCurrent ? "本周" : "这一周"}有 ${paidPending} 笔采购还没填实付金额（库存已经算进去了），预算要等补上价才准。</p>`
          : ""
      }
      ${
        list.budget.unpricedCount
          ? `<p class="muted">还有 <b class="warn">${list.budget.unpricedCount}</b> 项没有参考价（没算进上面的金额）。点每天那道菜后面的「参考 £x」能看到它摊了哪几样。</p>`
          : ""
      }
      <div class="actions">
        ${isPast ? "" : '<button class="mini primary" data-action="optimize-week">一键优化排期</button>'}
        ${isPast ? "" : '<button class="mini" data-action="suggest-week">推荐一周菜单</button>'}
        <button class="mini" data-action="calendar-open">📅 吃的日历</button>
      </div>
      <p class="muted">${
        isPast
          ? "这一周已经过去了：点每天那道菜能看到当时的安排，也能补记「做过了 / 外食 / 跳过」。"
          : `「一键优化排期」会按冰箱里的到期日把${isCurrent ? "这一周" : ` ${weekName}`}重排一遍：快坏的往前提，来不及的换掉；外食 / 跳过 / 已做完的天不动。「吃的日历」留着每周真正吃过什么。`
      }</p>
    </section>
    ${
      soon.length
        ? `<section class="card">
            <h2>快到期（${soon.length}）</h2>
            <p class="muted">先吃这些，点一下可以改日期或删掉。</p>
            <ul class="plain-list">
              ${soon
                .map((b) => {
                  const f = foodsById.get(b.foodId);
                  const info = expiryInfo(b, today);
                  return `<li class="fridge-item fresh-${info.level}" data-action="inv-edit" data-id="${esc(b.id)}">
                    <div class="shop-main">
                      <div class="log-msg">${esc(f ? f.name : b.foodId)} <span class="${expClass(info)}">${esc(expiryLabel(info))}</span></div>
                      <div class="shop-sub muted">${esc(LOC_LABEL[b.location] || b.location)}${b.quantityState === "exact" ? ` · ${esc(String(b.quantity))}${esc(b.unit || "")}` : ""}${b.date ? ` · ${esc(b.date)}` : ""}</div>
                    </div>
                  </li>`;
                })
                .join("")}
            </ul>
          </section>`
        : ""
    }
    ${
      state.swapFrom
        ? `<section class="card swap-banner">
            <b>对调：${WEEKDAY_LABEL[weekdayIndex(state.swapFrom)]} ${state.swapFrom.slice(5)}</b>
            <p class="muted">点另一天的「⇄ 换到这天」就完成对调（拖到空白天就是挪过去）。</p>
            <div class="actions"><button class="mini" data-action="swap-cancel">取消</button></div>
          </section>`
        : ""
    }
    <section class="days">${days}</section>
    <p class="muted drag-hint">按住某天右上角的「⠿ 换」拖动，可以直接跟别的天对调；点它则是「点选对调」模式。</p>`;
}

function renderShop(state) {
  const data = state.data;
  const r = rangeOf(data);
  const list = buildShoppingList({ meals: data.meals, recipes: data.recipes, foods: data.foods, batches: data.inventoryBatches, range: r, stores: data.settings.stores });
  const storeNames = new Map((data.settings.stores || []).map((s) => [s.id, s.name]));
  const purchasedByFood = new Map();
  for (const p of data.purchases) {
    if (inWeek(p.purchasedAt.slice(0, 10), r)) purchasedByFood.set(p.foodId, p);
  }

  // 「已买」= 本周需求已被库存覆盖，而不是「本周有购买记录」。
  // 否则把库存删掉后，这一项会因为购买记录还在而卡在「已买」里，既不用买也买不了。
  const toBuy = list.items.filter((i) => i.shortfall > 0);
  const bought = list.items.filter((i) => i.shortfall <= 0 && purchasedByFood.has(i.foodId));
  const covered = list.items.filter((i) => i.shortfall <= 0 && !purchasedByFood.has(i.foodId));
  const total = toBuy.length + bought.length;
  const pct = total > 0 ? Math.round((bought.length / total) * 100) : 100;

  const renderRow = (i) => {
    const p = purchasedByFood.get(i.foodId);
    const settled = i.shortfall <= 0;
    const done = settled && !!p;
    const parts = [];
    if (i.available > 0) parts.push(`库存 ${i.available}${i.unit}`);
    parts.push(`缺口 ${i.shortfall}${i.unit}`);
    if (i.packs) parts.push(`买 ${i.packs} × ${i.packLabel || ""}${i.leftover ? ` → 剩 ${i.leftover}${i.unit}` : ""}`);
    if (i.storeId) parts.push(storeNames.get(i.storeId) || i.storeId);
    const price = i.estPence != null ? `约 ${formatPence(i.estPence)}` : "待补价";
    return `<li class="shop-item${done ? " bought" : ""}">
      <input type="checkbox" data-action="buy-item" data-key="${esc(i.key || i.foodId)}" ${done ? "checked disabled" : ""}>
      <div class="shop-main">
        <div class="shop-name">${esc(i.name)} <span class="muted">需 ${i.need}${i.unit}</span></div>
        <div class="shop-sub muted">${esc(parts.join(" · "))} · ${i.estPence != null ? esc(price) : `<span class="warn">${esc(price)}</span>`}</div>
        ${
          i.expiredSkipped
            ? `<div class="shop-sub"><span class="warn">冰箱里有 ${i.expiredSkipped} 批已过 use-by（包装日期），这次用不上</span></div>`
            : ""
        }
        ${
          i.expiresBeforeUse
            ? `<div class="shop-sub"><span class="warn">冰箱里那批按估算日期会在做这顿之前到期（估算，不是包装日期）—— 尽量提前用掉</span></div>`
            : ""
        }
        ${p ? `<div class="shop-sub">${done ? "" : '<span class="warn">本周买过，但库存已不在，需要再买</span> '}<button class="mini" data-action="edit-purchase" data-purchase="${esc(p.id)}">改分量 / 价格</button> <button class="mini danger-mini" data-action="undo-purchase" data-purchase="${esc(p.id)}">撤销</button> <span class="muted">已买 ${p.quantity}${p.unit}${p.amountPence == null ? " · 金额待补全" : " · " + formatPence(p.amountPence)}</span></div>` : ""}
      </div>
    </li>`;
  };

  const groups = new Map();
  for (const it of toBuy) {
    if (!groups.has(it.area)) groups.set(it.area, []);
    groups.get(it.area).push(it);
  }
  const groupHtml = [...groups.entries()]
    .map(([area, items]) => `<div class="list-heading">${AREA_LABEL[area] || area}</div><ul class="plain-list">${items.map(renderRow).join("")}</ul>`)
    .join("");

  const paid = data.purchases.filter((p) => inWeek(p.purchasedAt.slice(0, 10), r)).reduce((s, p) => s + (p.amountPence || 0), 0);
  const budget = data.settings.budget.weeklyPence;
  const overEstimate = list.budget.estimatedPence > budget;
  const overPaid = paid > budget;
  const overNote = overPaid
    ? `已付超出预算 ${formatPence(paid - budget)}`
    : overEstimate
      ? `预计超出预算 ${formatPence(list.budget.estimatedPence - budget)}`
      : "";

  return `
    <section class="card">
      <div class="row between"><h2>买菜清单</h2><span class="muted">已买 ${bought.length} / ${total}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row budget-row"><span>预计 <b class="${overEstimate ? "over-text" : ""}">${formatPence(list.budget.estimatedPence)}</b> / 预算 ${formatPence(budget)}</span><span class="${overPaid ? "over-text" : "muted"}">已付 ${formatPence(paid)}</span></div>
      ${overNote ? `<p class="over-line">${overNote}</p>` : ""}
      <p class="muted">勾一下就算买了：生成购买记录并入库，价格可以回头补。</p>
    </section>
    <section class="card">${toBuy.length ? groupHtml : '<p class="muted">本周要买的都买齐了。</p>'}</section>
    ${bought.length ? `<section class="card"><div class="list-heading">已买</div><ul class="plain-list">${bought.map(renderRow).join("")}</ul></section>` : ""}
    ${covered.length ? `<section class="card"><div class="list-heading">已有库存，不用买</div><ul class="plain-list">${covered.map((i) => `<li class="shop-item"><div class="shop-main"><div class="shop-name">${esc(i.name)} <span class="muted">需 ${i.need}${i.unit} · 库存 ${i.available}${i.unit}</span></div></div></li>`).join("")}</ul></section>` : ""}
    ${list.warnings.length ? `<section class="card"><div class="list-heading">注意</div>${list.warnings.map((w) => `<p class="muted">${esc(w)}</p>`).join("")}</section>` : ""}`;
}

function renderRecipes(state) {
  const data = state.data;
  const drafts = data.recipes.filter((r) => r.status === "draft");
  const done = data.recipes.filter((r) => r.status !== "draft");
  const q = (state.recipeQuery || "").trim();
  const curCat = state.recipeCategory || "";
  const limit = state.recipeLimit || 30;
  const { items: shown, total: matchedCount } = browseRecipes(done, { query: q, category: curCat, limit });
  const chips = [
    `<button class="chip${curCat ? "" : " active"}" data-action="pick-category" data-cat="">全部 <span class="muted">${done.length}</span></button>`,
    ...RECIPE_CATEGORIES.map((c) => {
      const n = done.filter((r) => (r.category || "其他") === c).length;
      if (!n) return "";
      return `<button class="chip${curCat === c ? " active" : ""}" data-action="pick-category" data-cat="${esc(c)}">${esc(c)} <span class="muted">${n}</span></button>`;
    })
  ].join("");

  const draftRows = drafts
    .map((r) => {
      const filled = r.ingredients.length > 0;
      return `<li class="log-item">
        <div class="shop-main">
          <div class="log-msg">${esc(r.name)} <span class="tag draft">待完善</span></div>
          <div class="shop-sub muted">${r.createdAt ? `记于 ${esc(String(r.createdAt).slice(0, 10))} · ` : ""}${
        filled ? `电脑已补全 ${r.ingredients.length} 样食材、${r.steps.length} 个步骤` : "等电脑补全食材和做法"
      }</div>
        </div>
        <div class="stepper">
          ${filled ? `<button class="mini primary" data-action="publish-recipe" data-id="${esc(r.id)}">确认发布</button>` : ""}
          <button class="mini" data-action="open-recipe" data-id="${esc(r.id)}">看</button>
          <button class="mini danger-mini" data-action="delete-recipe" data-id="${esc(r.id)}">删除</button>
        </div>
      </li>`;
    })
    .join("");

  const cards = shown
    .map((r) => {
      const cost = recipeCostPence(r, data.foods, r.baseServings);
      return `<div class="card">
        <div class="row between"><b><span class="link" data-action="edit-recipe-ingredients" data-id="${esc(r.id)}">${esc(r.name)}</span></b></div>
        <div class="muted">${r.baseServings} 人份 · ${r.ingredients.length} 样食材 · 参考成本 ${formatPence(cost.pence)}${cost.unpriced ? `（${cost.unpriced} 项无价）` : ""}</div>
        <div class="tags">${(r.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}${
          isMealDish(r) ? "" : '<span class="tag off">不参与推荐</span>'
        }</div>
        <div class="actions">
          <button class="mini" data-action="open-recipe" data-id="${esc(r.id)}">看做法</button>
          <button class="mini primary" data-action="add-to-week" data-id="${esc(r.id)}">加入本周</button>
        </div>
      </div>`;
    })
    .join("");

  return `
    <section class="card">
      <div class="row between"><h2>食谱库</h2><button class="mini primary" data-action="add-recipe">+ 添加食谱</button></div>
      <p class="muted">共 ${data.recipes.length} 道。手机上记个菜名就行，电脑补全食材和做法后你确认发布。</p>
      <input id="recipe-search" value="${esc(q)}" placeholder="🔍 搜菜名 / 类目 / 标签，比如：鸡、主食、家常菜">
      <div class="chips">${chips}</div>
    </section>
    ${
      drafts.length
        ? `<section class="card">
            <div class="row between">
              <div class="list-heading">待完善（${drafts.length}）</div>
              ${
                drafts.filter((r) => r.ingredients.length > 0).length > 1
                  ? `<button class="mini primary" data-action="publish-all-drafts">全部确认发布</button>`
                  : ""
              }
            </div>
            <ul class="plain-list">${draftRows}</ul>
            <p class="muted">在电脑上补全后，这里会出现「确认发布」。</p>
          </section>`
        : ""
    }
    ${
      done.length
        ? `<div class="list-heading" style="margin-left:4px">${
            `${curCat ? esc(curCat) : "全部"}${q ? ` · 搜索「${esc(q)}」` : ""}：${matchedCount} 道`
          }${matchedCount > shown.length ? `，先显示 ${shown.length} 道` : ""}</div>`
        : ""
    }
    ${cards || (drafts.length ? "" : '<section class="card"><p class="muted">还没有食谱。</p></section>')}
    ${
      matchedCount > shown.length
        ? `<section class="card"><button class="mini primary" data-action="show-more-recipes">显示更多（还有 ${matchedCount - shown.length} 道）</button></section>`
        : ""
    }`;
}

function renderFridge(state) {
  const data = state.data;
  const today = todayISO(data.settings.budget.timezone);
  const foodsById = new Map(data.foods.map((f) => [f.id, f]));
  // 冰箱里还有货的批次：吃完的（精确库存扣到 0）一律当不存在 ——
  // 页面显示、到期提醒、「还没填参考价」都按这一份算。
  const inFridge = data.inventoryBatches.filter(hasStock);
  const showLimit = 5; // 冰箱页只留 5 条，全部推荐进二级页
  const { items: allSuggestions, total: sugTotal } = suggestRecipes(data, { limit: Math.max(showLimit, 40), today });
  // 本周已经定了的菜，能做的就带星标置顶
  const weekRangeNow = rangeOf(data);
  const STILL_TO_COOK = new Set(["planned", "cooking"]);
  const plannedIds = new Set(
    data.meals
      .filter((m) => m.recipeId && STILL_TO_COOK.has(m.state) && inWeek(m.date, weekRangeNow))
      .map((m) => m.recipeId)
  );
  const suggestions = [...allSuggestions]
    .sort((a, b) => (plannedIds.has(b.recipeId) ? 1 : 0) - (plannedIds.has(a.recipeId) ? 1 : 0))
    .slice(0, showLimit);
  // 库存里有、但没有参考价的食材（只算还在冰箱里的那些，吃完的不算）
  const stockedIds = [...new Set(inFridge.map((b) => b.foodId))];
  // 标记过「库存·没花钱」的食材不催补价：这东西本来就没有价格可言
  const noMoneyFoodIds = new Set((data.purchases || []).filter((p) => p.storeId === "stock").map((p) => p.foodId));
  const noMoneyBatch = (b) => noMoneyFoodIds.has(b.foodId);
  const needPriceIds = new Set(inFridge.filter((b) => !noMoneyBatch(b)).map((b) => b.foodId));
  const unpricedFoods = stockedIds
    .filter((id) => needPriceIds.has(id))
    .map((id) => foodsById.get(id))
    .filter((f) => f && !(f.packSizes || []).some((p) => p.pricePence != null))
    .sort((a, b) => (a.name > b.name ? 1 : -1));
  const sugRows = suggestions
    .map(
      (s) => `<li class="fridge-item" data-action="edit-recipe-ingredients" data-id="${esc(s.recipeId)}">
        <div class="shop-main">
          <div class="log-msg">${plannedIds.has(s.recipeId) ? '<span class="tag star">⭐ 本周定了</span> ' : ""}${esc(
        s.name
      )} <span class="muted">${s.category ? esc(s.category) + " · " : ""}已备 ${s.full}${
        s.partial ? ` + 部分 ${s.partial}` : ""
      } / ${s.full + s.partial + s.missing.length} 样</span></div>
          <div class="shop-sub muted">${
            s.missing.length ? `还缺：${esc(s.missing.map((m) => m.name).join("、"))}` : "食材都齐了"
          }${
            s.missingSeasoning && s.missingSeasoning.length
              ? `${s.missing.length ? "；" : ""}调料可能缺：${esc(s.missingSeasoning.map((m) => m.name).join("、"))}`
              : ""
          }${s.warnUsed.length ? ` · 能顺手用掉：${esc(s.warnUsed.join("、"))}` : ""}</div>
        </div>
        <div class="stepper">
          <button class="mini primary" data-action="add-to-week" data-id="${esc(s.recipeId)}">加入本周</button>
          <button class="mini" data-action="open-recipe" data-id="${esc(s.recipeId)}">做法</button>
        </div>
      </li>`
    )
    .join("");
  // 一条库存 → 界面上一行；同一样食材的多批合成一行显示（数量相加），
  // 点开才是每一批的明细。数据层永远保留每一批，采购/消耗/撤销才对得上账。
  const foodRow = (foodId, list) => {
      const b = list[0];
      const f = foodsById.get(b.foodId);
      const exact = list.filter((x) => x.quantityState === "exact");
      const total = exact.reduce((s, x) => s + (Number(x.quantity) || 0), 0);
      const qty =
        exact.length === list.length
          ? `${Math.round(total * 100) / 100}${b.unit}${list.length > 1 ? `（${list.length} 批）` : ""}`
          : `档位：${b.level || "unknown"}`;
      const priced = !!(f && (f.packSizes || []).some((p) => p.pricePence != null)) || noMoneyBatch(b);
      const pack = f ? (f.packSizes || []).find((p) => p.pricePence != null) : null;
      // 颜色按最快到期的那批算
      const soonest = list
        .map((x) => ({ x, info: expiryInfo(x, today) }))
        .sort((a, c) => (a.info.days == null ? 1 : c.info.days == null ? -1 : a.info.days - c.info.days))[0];
      const info = soonest.info;
      const parts = [];
      parts.push([...new Set(list.map((x) => LOC_LABEL[x.location] || x.location))].join("/"));
      const dated = list.filter((x) => x.date);
      if (dated.length) {
        const earliest = dated.sort((a, c) => String(a.date).localeCompare(String(c.date)))[0];
        const dt = earliest.dateType === "use_by" ? "use-by" : earliest.dateType === "best_before" ? "best-before" : "";
        parts.push(`${esc(dt)} ${esc(earliest.date)}${dated.length > 1 ? " 起" : ""}`);
      }
      parts.push(`<span class="${expClass(info)}">${esc(expiryLabel(info))}</span>`);
      if (info.estimated) parts.push("估算");
      if (list.some((x) => x.opened)) parts.push("已开封");
      if (pack && pack.size > 0) parts.push(`参考 ${unitPriceText(pack.pricePence / pack.size, pack.unit)}`);
      return `<li class="fridge-item fresh-${info.level}" data-action="food-batches" data-food="${esc(foodId)}">
        <div class="shop-main">
          <div class="shop-name">${esc(f ? f.name : b.foodId)} <span class="muted">${qty}</span>${
            priced ? "" : ' <button class="tag todo" data-action="set-ref-price" data-food="' + esc(b.foodId) + '">待补价</button>'
          }</div>
          <div class="shop-sub muted">${parts.join(" · ")}</div>
        </div>
        <button class="mini" data-action="food-batches" data-food="${esc(foodId)}">${
          list.length > 1 ? `${list.length} 批 ›` : "明细 ›"
        }</button>
      </li>`;
  };

  // 库存按类目分组，每组可折叠；组内先按食材合并，再按到期日排
  const AREA_ORDER = ["meat", "fish", "veg", "fruit", "dairy", "staple", "seasoning", "other"];
  const grouped = new Map();
  for (const b of sortByExpiry(inFridge, today)) {
    const f = foodsById.get(b.foodId);
    const area = (f && f.area) || "other";
    if (!grouped.has(area)) grouped.set(area, []);
    grouped.get(area).push(b);
  }
  const byFood = (list) => {
    const map = new Map();
    for (const b of list) {
      if (!map.has(b.foodId)) map.set(b.foodId, []);
      map.get(b.foodId).push(b);
    }
    return [...map.entries()];
  };
  const hidden = state.fridgeHidden || {};
  const rows = [...grouped.entries()]
    .sort((a, b) => AREA_ORDER.indexOf(a[0]) - AREA_ORDER.indexOf(b[0]))
    .map(([area, list]) => {
      const foods = byFood(list);
      const urgent = list.filter((b) => ["expired", "soon"].includes(expiryInfo(b, today).level)).length;
      return `<button class="group-head" data-action="fridge-group" data-area="${esc(area)}">
          <span>${esc(AREA_LABEL[area] || area)} <span class="muted">${foods.length} 样</span></span>
          <span class="muted">${urgent ? `<span class="warn">${urgent} 样快到期/已过期</span> · ` : ""}${hidden[area] ? "▸" : "▾"}</span>
        </button>${
          hidden[area] ? "" : `<ul class="plain-list">${foods.map(([foodId, rows]) => foodRow(foodId, rows)).join("")}</ul>`
        }`;
    })
    .join("");

  return `
    <section class="card">
      <div class="row between"><h2>冰箱</h2><div><button class="mini" data-action="food-prices">食材价格</button> <button class="mini primary" data-action="inv-add">+ 加食材</button></div></div>
      <p class="muted">顺手记一下储备量，买菜清单会自动扣掉这些。</p>
    </section>
    <section class="card">
      <h2>用现有食材能做什么</h2>
      <p class="muted">按冰箱现存的食材挑的（按 ${data.settings.household.defaultServings} 人份算），优先消耗快过期的；点菜名改食材，右侧可以直接加进本周。</p>
      ${
        sugRows
          ? `<ul class="plain-list">${sugRows}</ul>
             <p class="muted">带 ⭐ 的是本周还没做的菜，能做就先把它们做掉，省得食材放着坏。</p>`
          : '<p class="muted">现有食材还凑不出一道菜，先去买菜，或者把冰箱里的量记进来。</p>'
      }
      ${
        sugTotal > showLimit
          ? `<div class="actions"><button class="mini" data-action="all-suggestions">看全部 ${sugTotal} 道推荐</button></div>`
          : ""
      }
    </section>
    <section class="card">${
      unpricedFoods.length
        ? `<p class="muted">有 ${unpricedFoods.length} 样还没填参考价（${unpricedFoods
            .slice(0, 6)
            .map((f) => esc(f.name))
            .join("、")}${unpricedFoods.length > 6 ? "…" : ""}）——填了之后预算和推荐才准。点名字后面的「待补价」就能填，也可以点上面的「食材价格」一次看全。</p>`
        : ""
    }${
      rows
        ? `<div class="row between">
             <p class="legend muted" style="margin:0"><span><i class="dot ok"></i>还新鲜</span><span><i class="dot soon"></i>快到期</span><span><i class="dot expired"></i>已过期</span><span><i class="dot unknown"></i>日期未确认</span></p>
           </div>
           ${
             inFridge.some((b) => !b.date)
               ? `<p class="muted">有 ${inFridge.filter((b) => !b.date).length} 条没填日期（所以是灰的）。
                  <button class="mini" data-action="fill-expiry">按保鲜期一键估算到期日</button></p>`
               : ""
           }
           <ul class="plain-list">${rows}</ul>`
        : '<p class="muted">还没有库存记录。</p>'
    }</section>`;
}

function renderSettings(state) {
  const data = state.data;
  const c = state.config;
  const servings = data ? data.settings.household.defaultServings : 2;
  const budgetP = data ? data.settings.budget.weeklyPence : 5000;
  const trial = typeof window !== "undefined" && window.__DINNING_STANDALONE__;

  return `
    ${renderConflicts(state)}
    ${
      trial
        ? `<section class="card">
             <h2>试用版</h2>
             <p class="muted">这是一个单文件试用版：食谱库已经内置，所有改动只存在这台设备上，不会同步、也不会传到任何仓库。想长期用的话，建议自己建一个空的私有仓库 + Token 填到下面，数据就跟着你走。</p>
           </section>`
        : ""
    }
    <section class="card">
      <h2>同步</h2>
      <div class="status-row">状态：<b>${esc(state.status)}</b></div>
      ${state.message ? `<p class="muted">${esc(state.message)}</p>` : ""}
      ${state.sha ? `<p class="muted">远端版本：${esc(String(state.sha).slice(0, 10))}</p>` : ""}
      ${data ? `<p class="muted">本地数据：食谱 ${data.recipes.length} · 菜单 ${data.meals.length} · 库存 ${data.inventoryBatches.length} · 购买 ${data.purchases.length}</p>` : ""}
      ${state.conflicts && state.conflicts.length ? `<p class="warn">有 ${state.conflicts.length} 处冲突等待处理（已保留双方）</p>` : ""}
      ${state.pending ? `<p class="warn">有未推送的改动：${esc((state.labels || []).join("；") || "改动")}</p>` : ""}
      <div class="grid2">
        <label>Owner<input id="cfg-owner" value="${esc(c.owner)}"></label>
        <label>Repo<input id="cfg-repo" value="${esc(c.repo)}"></label>
        <label>Branch<input id="cfg-branch" value="${esc(c.branch)}"></label>
        <label>Path<input id="cfg-path" value="${esc(c.path)}"></label>
      </div>
      <label>Token<input id="cfg-token" type="password" value="${esc(c.token)}"></label>
      <div class="actions">
        <button class="secondary" data-action="save-config">保存配置</button>
        <button class="primary" data-action="sync-read">读取远端</button>
        <button class="primary" data-action="sync-write">写入远端</button>
      </div>
    </section>
    <section class="card">
      <h2>操作日志</h2>
      <p class="muted">每次自动写入远端都会留一条记录，可以回到其中任意一版。</p>
      <div class="actions"><button class="secondary" data-action="load-log">${state.log ? "刷新日志" : "加载日志"}</button></div>
      ${
        state.log
          ? state.log.length
            ? `<ul class="plain-list log-list">${state.log
                .map(
                  (c) => `<li class="log-item">
                    <div class="shop-main">
                      <div class="log-msg">${esc(c.message)}</div>
                      <div class="shop-sub muted">${esc((c.date || "").replace("T", " ").slice(0, 16))} · ${esc(c.short)}</div>
                    </div>
                    <button class="mini" data-action="restore-commit" data-sha="${c.sha}">回到这版</button>
                  </li>`
                )
                .join("")}</ul>`
            : `<p class="muted">还没有记录。</p>`
          : ""
      }
    </section>
    <section class="card">
      <h2>备份与恢复</h2>
      <p class="muted">存档会压缩并混淆成一串文本，复制走存好；读档时整段粘贴回来即可。替换数据前，会先把当前数据在本机备份一份。</p>
      <div class="actions">
        <button class="secondary" data-action="make-save">生成存档文本</button>
        <button class="secondary" data-action="load-save">粘贴读档</button>
      </div>
      ${
        state.backup
          ? `<p class="muted">本机备份：${esc(String(state.backup.at || "").replace("T", " ").slice(0, 16))} · ${esc(state.backup.summary)}</p>
             <div class="actions"><button class="mini" data-action="restore-backup">恢复这份备份</button></div>`
          : `<p class="muted">还没有本机备份（读档或恢复时会自动生成）。</p>`
      }
    </section>
    <section class="card">
      <h2>设置</h2>
      <label>用餐人数
        <select id="set-servings">${[1, 2, 3, 4].map((n) => `<option value="${n}"${n === servings ? " selected" : ""}>${n} 人</option>`).join("")}</select>
      </label>
      <label>每周预算（£）<input id="set-budget" type="number" min="0" step="1" value="${(budgetP / 100).toFixed(0)}"></label>
      ${
        (data ? data.settings.stores : []).length
          ? `<div class="list-heading">常去的店</div><ul class="plain-list">${(data.settings.stores || [])
              .map(
                (s) => `<li class="store-row">
                  <span class="ing-name">${esc(s.name)}</span>
                  <select data-store-role="${s.id}">
                    <option value="main"${s.role === "topup" ? "" : " selected"}>大采购</option>
                    <option value="topup"${s.role === "topup" ? " selected" : ""}>顺手补货</option>
                  </select>
                </li>`
              )
              .join("")}</ul>
            <p class="muted">决定买菜清单里这一项算「大采购」还是「顺手补货」，也决定买东西时默认去哪家。</p>`
          : ""
      }
      <div class="actions"><button class="primary" data-action="save-settings">保存设置</button></div>
    </section>`;
}

// 「吃的日历」：月历 + 选中那天 + 那一周。
// 只读，事实源是做饭记录（history.js），所以「排了没做」会标出来，不会当成吃过。
// 周起点、时区都跟着设置走，和「本周」是同一套口径 —— 不然「上周」会有两种说法。
function calendarBody(state, { month = null, day = null } = {}) {
  const data = state.data;
  const budget = (data.settings && data.settings.budget) || {};
  const tz = budget.timezone || "UTC";
  const weekStartsOn = budget.weekStartsOn || "saturday";
  const today = todayISO(tz);
  const cur = /^\d{4}-\d{2}$/.test(String(month || "")) ? month : today.slice(0, 7);
  const year = Number(cur.slice(0, 4));
  const mon = Number(cur.slice(5, 7));
  const selected = /^\d{4}-\d{2}-\d{2}$/.test(String(day || "")) ? day : today;
  const grid = monthGrid(data, { year, month: mon, weekStartsOn, timeZone: tz, today });
  const events = cookedEvents(data, { timeZone: tz });
  const week = weekHistory(data, { weekStart: weekStartISO(selected, weekStartsOn), weekStartsOn, timeZone: tz, today });

  const DOW = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  const startIdx = Math.max(0, DOW.indexOf(weekStartsOn));
  const dows = Array.from({ length: 7 }, (_, i) => WEEKDAY_LABEL[(startIdx + i) % 7]).map((w) => `<div class="cal-dow">${w}</div>`).join("");

  const KIND_SHORT = { eating_out: "外食", skipped: "跳过", leftovers: "剩菜", missed: "没做", planned: "定了", future: "", empty: "", outside: "" };
  const cells = grid.cells
    .map((c) => {
      const cls = ["cal-cell", `cal-${c.kind}`, c.inMonth ? "" : "out-month", c.date === today ? "today" : "", c.date === selected ? "selected" : ""]
        .filter(Boolean)
        .join(" ");
      const label = c.kind === "cooked" ? (c.names[0] || "吃过") + (c.eaten.length > 1 ? ` +${c.eaten.length - 1}` : "") : KIND_SHORT[c.kind] || "";
      const title = c.kind === "cooked" ? c.names.join("、") : KIND_SHORT[c.kind] || "";
      return `<button class="${cls}" data-action="cal-pick" data-date="${c.date}" title="${esc(title)}">
        <span class="cal-num">${c.dayNumber}</span><span class="cal-name">${esc(label)}</span>
      </button>`;
    })
    .join("");

  const timeOf = (iso) =>
    iso
      ? new Intl.DateTimeFormat("zh-CN", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso))
      : "";
  const cookedDates = cookedDatesByRecipe(events);

  const selDay = week.days.find((d) => d.date === selected) || {
    date: selected,
    weekday: WEEKDAY_LABEL[weekdayIndex(selected)],
    kind: "empty",
    eaten: []
  };
  const emptyNote =
    selDay.kind === "eating_out"
      ? "这天外食"
      : selDay.kind === "skipped"
        ? "这天跳过"
        : selDay.kind === "leftovers"
          ? "这天吃剩菜"
          : selDay.kind === "missed"
            ? `这天排了没做${selDay.planned ? `（原定：${esc(selDay.planned.name)}）` : ""}`
            : selDay.kind === "planned"
              ? `这天定的是${selDay.planned ? ` ${esc(selDay.planned.name)}` : "一道菜"}，还没到`
              : selDay.date > today
                ? "还没到这周"
                : "这天没安排";
  const dayRows = selDay.eaten.length
    ? selDay.eaten
        .map((e) => {
          const prev = lastCookedBefore(cookedDates.get(e.recipeId), e.date);
          // 按钮按在这天，但真正下厨可能是另一天（提前做 / 第二天才补记）—— 两个日期都写出来
          const when = e.cookedAt
            ? e.cookedDate && e.cookedDate !== e.date
              ? `${e.cookedDate.slice(5)} ${timeOf(e.cookedAt)} 下的厨，记在 ${e.date.slice(5)} 这顿`
              : `${timeOf(e.cookedAt)} 做的`
            : `按 ${e.date} 这天的排期记的`;
          return `<li class="log-item"><div class="shop-main">
            <div class="log-msg">${esc(e.name || "（这道菜已经找不到了）")}${e.servings ? ` <span class="muted">${e.servings} 人份</span>` : ""}</div>
            <div class="shop-sub muted">${esc(when)} · ${prev ? `上次做：${prev.slice(5)}` : "以前没做过"}</div>
          </div></li>`;
        })
        .join("")
    : `<li class="muted">${emptyNote}</li>`;

  const s = week.stats;
  const parts = [];
  if (s.cooked) parts.push(`做了 ${s.cooked} 顿`);
  if (s.eatingOut) parts.push(`外食 ${s.eatingOut} 天`);
  if (s.skipped) parts.push(`跳过 ${s.skipped} 天`);
  if (s.leftovers) parts.push(`剩菜 ${s.leftovers} 天`);
  if (s.missed) parts.push(`排了没做 ${s.missed} 天`);
  if (s.planned) parts.push(`还没到 ${s.planned} 天`);
  if (s.empty + s.future) parts.push(`没安排 ${s.empty + s.future} 天`);

  const weekRows = week.days
    .map((d) => {
      const what = d.eaten.length
        ? d.eaten.map((e) => esc(e.name || "（找不到的菜）")).join("、")
        : d.kind === "eating_out"
          ? '<span class="tag">外食</span>'
          : d.kind === "skipped"
            ? "跳过"
            : d.kind === "leftovers"
              ? '<span class="tag">吃剩菜</span>'
              : d.kind === "missed"
                ? `<span class="warn">没做</span>${d.planned ? ` <span class="muted">原定 ${esc(d.planned.name)}</span>` : ""}`
                : d.kind === "planned"
                  ? `<span class="muted">${d.planned ? esc(d.planned.name) : "定了菜"}（还没到）</span>`
                  : '<span class="muted">—</span>';
      return `<li class="cal-week-row${d.date === selected ? " selected" : ""}" data-action="cal-pick" data-date="${d.date}"><span class="cal-week-day">${esc(
        d.weekday
      )} ${d.date.slice(5)}</span><span class="cal-week-what">${what}</span></li>`;
    })
    .join("");

  const prevM = shiftMonth(year, mon, -1);
  const nextM = shiftMonth(year, mon, 1);

  return `
    <p class="muted">按你的时区（${esc(tz)}）算「哪天吃的」：只算真正做过的，排了没做会标成「没做」，不会当成吃过。</p>
    <div class="cal-head">
      <button class="mini" data-action="cal-prev">‹ ${esc(monthLabel(prevM.year, prevM.month))}</button>
      <b>${esc(monthLabel(year, mon))}</b>
      <button class="mini" data-action="cal-next">${esc(monthLabel(nextM.year, nextM.month))} ›</button>
      <button class="mini" data-action="cal-today">今天</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
    <p class="legend muted"><span><i class="dot ok"></i>做过</span><span><i class="dot soon"></i>外食/跳过</span><span><i class="dot expired"></i>没做</span><span><i class="dot unknown"></i>没安排</span></p>
    <div class="list-heading">${esc(selDay.weekday)} ${selected.slice(5)}</div>
    <ul class="plain-list">${dayRows}</ul>
    <div class="row between">
      <div class="list-heading">这一周 ${week.weekStart.slice(5)} ~ ${week.weekEnd.slice(5)}</div>
      <button class="mini" data-action="cal-goto" data-date="${week.weekStart}">去这一周排 ›</button>
    </div>
    <p class="muted">${parts.join(" · ") || "这周什么都没有"}</p>
    <ul class="plain-list cal-week">${weekRows}</ul>`;
}

// ===== src\rules\pricebook.js =====
// 食材价格一览：哪些食材有参考价、哪些还是「待补价」，以及它在冰箱里的存量。
// 纯函数，界面只负责画。
function buildPriceBook(data, { query = "", filter = "all", limit = 40 } = {}) {
  const foods = (data && data.foods) || [];
  const batches = (data && data.inventoryBatches) || [];
  // 标过「库存·没花钱」的食材：本来就没有价格可言，不算「待补价」
  const noMoneyIds = new Set(((data && data.purchases) || []).filter((p) => p.storeId === "stock").map((p) => p.foodId));

  const stockByFood = new Map();
  for (const b of batches) {
    // 吃完的批次不算「冰箱里有」：否则「只看有库存的」会把已经吃完的食材列出来
    if (b.quantityState !== "exact" || !hasStock(b)) continue;
    const cur = stockByFood.get(b.foodId) || { qty: 0, unit: b.unit };
    cur.qty += Number(b.quantity) || 0;
    stockByFood.set(b.foodId, cur);
  }

  const all = foods.map((food) => {
    const packs = food.packSizes || [];
    const pack = packs.find((p) => p.pricePence != null) || packs[0] || null;
    const priced = !!(pack && pack.pricePence != null);
    const stock = stockByFood.get(food.id) || null;
    const unitPricePence = priced && pack.size > 0 ? pack.pricePence / pack.size : null;
    return { food, pack, priced, stock, unitPricePence, noMoney: !priced && noMoneyIds.has(food.id) };
  });

  const q = String(query || "").trim().toLowerCase();
  const matched = all.filter((r) => {
    if (filter === "noprice" && (r.priced || r.noMoney)) return false;
    if (filter === "priced" && !r.priced) return false;
    if (filter === "instock" && !r.stock) return false;
    if (!q) return true;
    return (
      r.food.name.toLowerCase().includes(q) ||
      (r.food.aliases || []).some((a) => String(a).toLowerCase().includes(q))
    );
  });

  // 待补价的排前面（那才是要动手的），其余按名字
  const sorted = [...matched].sort(
    (a, b) => Number(a.priced) - Number(b.priced) || (a.food.name > b.food.name ? 1 : a.food.name < b.food.name ? -1 : 0)
  );

  return {
    rows: sorted.slice(0, limit),
    total: sorted.length,
    counts: {
      all: all.length,
      priced: all.filter((r) => r.priced).length,
      noprice: all.filter((r) => !r.priced && !r.noMoney).length,
      nomoney: all.filter((r) => r.noMoney).length,
      instock: all.filter((r) => r.stock).length
    }
  };
}

// ===== src\rules\similar.js =====
// 菜名查重：完全重名、包含关系（可乐鸡翅 / 可乐鸡翅根）、以及字形相近（番茄炒蛋 / 西红柿炒蛋）。

// 常见同义写法先归一化，否则「西红柿」和「番茄」算不出相似
const SYNONYMS = [
  [/西红柿|蕃茄/g, "番茄"],
  [/马铃薯/g, "土豆"],
  [/青椒|尖椒|柿子椒/g, "椒"],
  [/鸡蛋|蛋$/g, "蛋"],
  [/白砂糖|白糖/g, "糖"],
  [/酱油/g, "生抽"]
];

function normalizeName(name) {
  let s = String(name == null ? "" : name).toLowerCase();
  s = s.replace(/的做法|做法|菜谱|recipe/g, "");
  for (const [re, to] of SYNONYMS) s = s.replace(re, to);
  return s.replace(/[\s·・、,，.。!！?？"'“”‘’()（）\[\]【】\-_/\\]/g, "");
}

function bigrams(s) {
  const out = new Set();
  for (let i = 0; i < s.length - 1; i++) out.add(s.slice(i, i + 2));
  return out;
}

function similarity(a, b) {
  const x = normalizeName(a);
  const y = normalizeName(b);
  if (!x || !y) return 0;
  if (x === y) return 1;
  if (x.includes(y) || y.includes(x)) return 0.85;
  const gx = bigrams(x);
  const gy = bigrams(y);
  if (!gx.size || !gy.size) return 0;
  let hit = 0;
  for (const g of gx) if (gy.has(g)) hit += 1;
  return (2 * hit) / (gx.size + gy.size);
}

// level: same（就是同一道）/ close（很接近）/ similar（有点像）
function findSimilarRecipes(recipes, name, { limit = 5, threshold = 0.5 } = {}) {
  const out = [];
  for (const r of recipes) {
    const score = similarity(name, r.name);
    if (score < threshold) continue;
    out.push({
      recipe: r,
      score: Math.round(score * 100) / 100,
      level: score >= 1 ? "same" : score >= 0.8 ? "close" : "similar"
    });
  }
  out.sort((a, b) => b.score - a.score || (a.recipe.name > b.recipe.name ? 1 : -1));
  return out.slice(0, limit);
}

// ===== src\rules\plan.js =====
// 一周推荐菜单：从菜谱库里挑出这一周的正餐。
// 偏好顺序：用掉现成食材多、能顺手消耗快过期的、便宜、不重样；
// 最后用真实采购估算（扣掉库存）校一遍周预算，超了就换成更便宜的。
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 只从"能当一顿饭"的类目里挑：饮品、甜点、调料、半成品不算正餐
const DINNER_CATEGORIES = new Set(["荤菜", "素菜", "水产", "主食", "汤", "早餐", "其他"]);

function suggestWeek(data, { range, today, servings, budgetPence, seed = 1 } = {}) {
  const target = servings || (data.settings && data.settings.household ? data.settings.household.defaultServings : 2);
  const budget = budgetPence == null ? data.settings.budget.weeklyPence : budgetPence;
  const pool = buildRecipePool(data, { servings: target, today });

  if (!pool.length) {
    return { picks: [], estimatePence: 0, budgetPence: budget, note: "菜谱库里还没有可用的菜" };
  }

  const rnd = mulberry32(seed);
  const shuffled = pool
    .map((c) => ({ ...c, sortKey: c.score + rnd() * 6 }))
    .sort((a, b) => b.sortKey - a.sortKey);

  const days = (range && range.days) || [];
  const used = new Set();
  let prevCat = "";
  const chosen = [];
  for (const date of days) {
    const pick =
      shuffled.find((c) => !used.has(c.recipeId) && c.category !== prevCat) ||
      shuffled.find((c) => !used.has(c.recipeId));
    if (!pick) break;
    used.add(pick.recipeId);
    chosen.push({ ...pick, date });
    prevCat = pick.category;
  }

  // 越"新鲜"的越靠前：叶子菜、鲜肉先吃，干货冷冻留到后面
  chosen.sort((a, b) => b.fresh - a.fresh);
  let final = chosen.map((p, i) => ({ ...p, date: days[i] || p.date }));

  const mealsOf = (ps) =>
    ps.map((p) => ({
      id: `plan_${p.date}`,
      date: p.date,
      slot: "dinner",
      state: "planned",
      recipeId: p.recipeId,
      actualServings: target
    }));
  const listOf = (ps) =>
    buildShoppingList({
      meals: mealsOf(ps),
      recipes: data.recipes,
      foods: data.foods,
      batches: data.inventoryBatches,
      range,
      stores: data.settings.stores
    });
  const estimateOf = (ps) => listOf(ps).budget.estimatedPence;

  for (let guard = 0; guard < 15; guard += 1) {
    const est = estimateOf(final);
    if (est <= budget) break;
    const victim = [...final].sort((a, b) => b.cost - a.cost)[0];
    const usedIds = new Set(final.map((p) => p.recipeId));
    const alt = shuffled
      .filter((c) => !usedIds.has(c.recipeId) && c.cost < victim.cost)
      .sort((a, b) => b.score - a.score)[0];
    if (!alt) break;
    const next = final.map((p) => (p.recipeId === victim.recipeId ? { ...alt, date: p.date } : p));
    if (estimateOf(next) >= est) break;
    final = next;
  }

  const estimatePence = estimateOf(final);
  const unpricedCount = listOf(final).budget.unpricedCount;
  return {
    picks: final,
    estimatePence,
    budgetPence: budget,
    unpricedCount,
    note:
      unpricedCount > 0
        ? `其中 ${unpricedCount} 项还没有参考价，金额不准，买菜时补上就准了`
        : estimatePence > budget
          ? `预计超预算 ${((estimatePence - budget) / 100).toFixed(2)} 英镑`
          : ""
  };
}

// 单日推荐：只给某一天挑一道菜，偏好和一周推荐完全一致。
// 已经排在本周别的日子的菜往后退（不想连着吃同一道），当前这天原本的菜也排除掉。
function suggestDay(data, { date, today, servings, seed = 1, exclude = [], limit = 6 } = {}) {
  const target = servings || (data.settings && data.settings.household ? data.settings.household.defaultServings : 2);
  const pool = buildRecipePool(data, { servings: target, today });
  if (!pool.length) return { items: [], servings: target, date, note: "菜谱库里还没有可用的菜" };

  const skip = new Set(exclude);
  const mine = `meal_${date}_dinner`;
  const plannedElsewhere = new Set(
    (data.meals || []).filter((m) => m.recipeId && m.id !== mine).map((m) => m.recipeId)
  );
  const current = (data.meals || []).find((m) => m.id === mine);
  if (current && current.recipeId) skip.add(current.recipeId);

  const rnd = mulberry32(seed);
  const items = pool
    .filter((c) => !skip.has(c.recipeId))
    .map((c) => ({
      ...c,
      alreadyPlanned: plannedElsewhere.has(c.recipeId),
      sortKey: c.score - (plannedElsewhere.has(c.recipeId) ? 25 : 0) + rnd() * 6
    }))
    .sort((a, b) => b.sortKey - a.sortKey)
    .slice(0, limit);

  return { items, servings: target, date, note: "" };
}

// 把某一道菜放到某一天之后，本周采购会变成多少钱（扣掉库存），用来在采用前看预算。
function estimateWithPick(data, { range, date, servings, recipeId }) {
  const mealId = `meal_${date}_dinner`;
  const meals = [
    ...(data.meals || []).filter((m) => m.id !== mealId),
    { id: mealId, date, slot: "dinner", state: "planned", recipeId, actualServings: servings }
  ];
  const list = buildShoppingList({
    meals,
    recipes: data.recipes,
    foods: data.foods,
    batches: data.inventoryBatches,
    range,
    stores: data.settings.stores
  });
  const budget = data.settings.budget.weeklyPence;
  return {
    estimatePence: list.budget.estimatedPence,
    budgetPence: budget,
    unpricedCount: list.budget.unpricedCount,
    over: list.budget.estimatedPence > budget
  };
}

// 候选池：一周推荐、单日推荐、一键优化排期共用，保证三处口味一致。
function buildRecipePool(data, { servings, today }) {
  const foodsById = new Map(data.foods.map((f) => [f.id, f]));
  const stock = stockByFood(data, { onDate: today });

  const warnFoods = new Set();
  for (const b of data.inventoryBatches || []) {
    if (!hasStock(b)) continue; // 吃完的批次没什么可「顺手消耗」的，不算加分项
    const info = expiryInfo(b, today);
    if (info.level === "soon") warnFoods.add(b.foodId);
    // best-before 过了只是品质差一点，还能吃；use-by 过了就不能再推荐了
    else if (info.level === "expired" && b.dateType !== "use_by") warnFoods.add(b.foodId);
  }

  const pool = [];
  for (const r of data.recipes) {
    if (r.status !== "complete" || !r.ingredients.length) continue;
    if (!isMealDish(r)) continue; // 只有「家常菜 + 正餐」才参与推荐
    if (r.category && !DINNER_CATEGORIES.has(r.category)) continue;
    const scale = servings / r.baseServings;
    let covered = 0;
    let warnHit = 0;
    let fresh = 0;
    const missing = [];
    const missingSeasoning = [];
    const warnUsed = [];
    for (const ing of r.ingredients) {
      const f = foodsById.get(ing.foodId);
      let need = ing.amount * scale;
      let unit = ing.unit;
      if (f) {
        const c = convert(f, need, ing.unit, f.baseUnit);
        if (c.certain) {
          need = c.value;
          unit = f.baseUnit;
        }
      }
      const s = stock.get(ing.foodId);
      const enough = !!(s && s.unit === unit && s.qty >= need);
      if (enough) {
        covered += 1;
        if (warnFoods.has(ing.foodId)) warnUsed.push(f ? f.name : ing.foodId);
      } else if (need > 0) {
        const have = s && s.unit === unit ? s.qty : 0;
        const row = {
          foodId: ing.foodId,
          name: f ? f.name : ing.foodId,
          unit,
          short: Math.round((need - have) * 10) / 10
        };
        (f && f.area === "seasoning" ? missingSeasoning : missing).push(row);
      }
      if (warnFoods.has(ing.foodId)) warnHit += 1;
      const life = (f && f.shelfLifeDays) || {};
      if (f && f.area !== "seasoning" && life.fridge != null && life.freezer == null) fresh += 1;
    }
    const costInfo = recipeCostPence(r, data.foods, servings);
    const pricedShare = r.ingredients.length ? (r.ingredients.length - costInfo.unpriced) / r.ingredients.length : 0;
    // 参考价不全的菜，成本不可信，就别参与"越便宜越优先"的打分
    const reliableCost = pricedShare >= 0.6;
    const cost = costInfo.pence;
    pool.push({
      recipeId: r.id,
      name: r.name,
      category: r.category || "",
      cost,
      reliableCost,
      covered,
      warnHit,
      warnUsed: [...new Set(warnUsed)],
      missing,
      missingSeasoning,
      fresh,
      servings,
      // 家常菜通常 5-8 样食材；太少像小菜，太多像大菜，两头都降一点
      score:
        covered * 10 + warnHit * 30 - (reliableCost ? cost / 30 : 0) - Math.abs(r.ingredients.length - 6) * 1.2
    });
  }
  return pool;
}

// ===== src\rules\optimize.js =====
// 一键优化排期：把「今天及以后、还没做」的菜重排一遍，让容易坏的先做。
//
// 为什么要有这个：排骨排在周五，可它 use-by 是周三 —— 到那天肉已经坏了。
// 规则（都是从这条教训推出来的）：
//   · 只动「今天及以后 + 还没做（planned / cooking / 空白）」的天。
//     已经做完 / 外食 / 跳过 / 吃剩菜 是你自己定的，一律不碰。
//   · 每道菜按它要用的库存算一个「最晚哪天做」：
//       use_by（包装上印的日期）是硬期限 —— 排在它后面就必须往前挪，挪不动就换菜；
//       best_before 和估算出来的日期只算「尽量提前」—— 挪得动就挪，挪不动不硬来
//       （best-before 过了只是品质差一点，为它把整周翻一遍不值当）。
//   · 往前挪优先跟那天对调（两边都不迟到），其次占空白天，都不行才换菜。
//   · 空出来的天和本来空着的天，用「用得上冰箱现成食材、顺手消耗快过期的」补上。
//   · 最后校一遍周预算：超了就把最贵的换成便宜的（不破坏期限）。
//   · 再顺手抢救一下：这几天就要到期、可一周里没有哪道菜用得上的食材，
//     换一道用得上的菜进来（只换「完全没有期限压力」的那道，最多两道）。
//
// 这个函数是纯的：只读 data，返回一份排期方案，不动 data；落地由 model.js 的
// applyOptimizedWeek 负责，所以能先给用户看一遍再决定。
// 「还没做、还能改」的状态：只有这两种状态的天才参与重排
const COOKING_STATES = ["planned", "cooking"];
const RESCUE_DAYS = 3; // 这几天内到期的食材，想办法顺手用掉
const RESCUE_MAX = 2; // 一次最多抢救两道，别把整周换掉
const RESCUE_MARGIN = 12; // 抢救的那道菜要比被换掉的分高出这么多才动手

const md = (iso) => (iso ? String(iso).slice(5) : "");
const KIND_RANK = { keep: 0, new: 1, replace: 2, move: 3, swap: 4 };

// 一批库存是不是「已经坏了、不能再吃」。
// 只有包装上印的 use-by 才算数：估算日期只是猜的，过了也只提醒，不当硬事实。
function isSpoiled(batch, today) {
  return !!(
    batch &&
    hasStock(batch) &&
    batch.date &&
    batch.dateType === "use_by" &&
    batch.dateSource !== "estimate" &&
    batch.date < today
  );
}

// 冰箱里已经坏掉、还没扔的批次（「一键优化」会提议顺手扔掉的就是这些）
function spoiledBatches(data, today) {
  return (data.inventoryBatches || [])
    .filter((b) => isSpoiled(b, today))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

// 一道菜「最晚哪天做」：
//   hard = 用得到的库存里最早的 use_by（包装日期）
//   soft = 用得到的库存里最早的 best_before / 估算日期
// 已经过期的批次不算期限（那是「没了」，不是「快到期」），由 spoiledFor 负责。
function dishDeadline(recipe, { foodsById, batchesByFood, today }) {
  const per = new Map();
  for (const ing of (recipe && recipe.ingredients) || []) {
    const food = foodsById.get(ing.foodId);
    if (!food || food.area === "seasoning") continue; // 调料放得久，不参与排期
    for (const b of batchesByFood.get(ing.foodId) || []) {
      if (!hasStock(b) || !b.date || b.dateType === "unknown") continue;
      if (b.date < today) continue;
      const hard = b.dateType === "use_by" && b.dateSource !== "estimate";
      const cur = per.get(ing.foodId);
      if (!cur || b.date < cur.date) per.set(ing.foodId, { name: food.name, date: b.date, hard });
      else if (b.date === cur.date && hard) cur.hard = true;
    }
  }
  let hard = null;
  let soft = null;
  const hardFoods = [];
  const softFoods = [];
  for (const x of per.values()) {
    if (x.hard) {
      if (!hard || x.date < hard) {
        hard = x.date;
        hardFoods.length = 0;
      }
      if (x.date === hard) hardFoods.push(x.name);
    } else {
      if (!soft || x.date < soft) {
        soft = x.date;
        softFoods.length = 0;
      }
      if (x.date === soft) softFoods.push(x.name);
    }
  }
  return { hard, soft, due: hard || soft, hardFoods, softFoods };
}

// 这道菜的主料是不是已经全坏了：冰箱里只剩过期的（use_by 包装日期），
// 一点能用的都不剩。这种菜排在哪天都做不成，得换掉（或者去买新的）。
function spoiledFor(recipe, { foodsById, batchesByFood, today }) {
  const bad = [];
  for (const ing of (recipe && recipe.ingredients) || []) {
    const food = foodsById.get(ing.foodId);
    if (!food || food.area === "seasoning") continue;
    const list = (batchesByFood.get(ing.foodId) || []).filter(hasStock);
    const spoiled = list.filter((b) => isSpoiled(b, today));
    if (!spoiled.length) continue;
    const usable = list.filter((b) => !isSpoiled(b, today));
    if (!usable.length) bad.push({ foodId: ing.foodId, name: food.name, date: spoiled[0].date });
  }
  return bad;
}

function optimizeWeek(data, { range, today, servings, budgetPence, fillEmpty = true, rescue = true } = {}) {
  const target = servings || (data.settings && data.settings.household ? data.settings.household.defaultServings : 2);
  const budget = budgetPence == null ? data.settings.budget.weeklyPence : budgetPence;
  const foodsById = new Map((data.foods || []).map((f) => [f.id, f]));
  const recipesById = new Map((data.recipes || []).map((r) => [r.id, r]));
  const batchesByFood = new Map();
  for (const b of data.inventoryBatches || []) {
    if (!batchesByFood.has(b.foodId)) batchesByFood.set(b.foodId, []);
    batchesByFood.get(b.foodId).push(b);
  }
  const ctx = { foodsById, batchesByFood, today };
  const deadlineOf = (recipeId) => {
    const r = recipesById.get(recipeId);
    return r ? dishDeadline(r, ctx) : { hard: null, soft: null, due: null, hardFoods: [], softFoods: [] };
  };
  const pool = buildRecipePool(data, { servings: target, today });
  const poolById = new Map(pool.map((p) => [p.recipeId, p]));
  // 主料全坏了的菜不参与「补位」：它这次做不成，别又给排回来
  const brokenIds = new Set();
  for (const r of data.recipes || []) if (spoiledFor(r, ctx).length) brokenIds.add(r.id);

  // ---- 1. 分天：今天以前的不动；今天及以后只认「还没做」的和空白的 ----
  const days = (range && range.days) || [];
  const pastDays = days.filter((d) => d < today);
  const openSlots = []; // {date, meal, state}
  const locked = []; // 外食 / 跳过 / 吃剩菜 / 已做完：不碰
  for (const d of days) {
    if (d < today) continue;
    const meal = (data.meals || []).find((m) => m.date === d) || null;
    const state = meal ? meal.state : null;
    if (!meal || COOKING_STATES.includes(state)) openSlots.push({ date: d, meal, state });
    else locked.push({ date: d, meal, state });
  }

  const lockedIds = new Set(locked.filter((s) => s.meal && s.meal.recipeId).map((s) => s.meal.recipeId));
  const assign = new Map(openSlots.map((s) => [s.date, null])); // 日期 -> 这道菜（null = 空着）
  const slotState = new Map(openSlots.map((s) => [s.date, s.meal && s.meal.recipeId ? "planned" : "orig-empty"]));
  const events = new Map(); // 日期 -> {kind, from, reasons[]}
  const stalePlan = []; // 原来排的菜已经不在可用食谱里（删了 / 还没补全）

  const note = (date, ev) => {
    const cur = events.get(date);
    if (!cur) {
      events.set(date, { kind: ev.kind, from: ev.from || null, reasons: ev.reason ? [ev.reason] : [] });
      return;
    }
    // override：这天「原来的菜挪走了、又补了一道新的」，主体是新的那道
    if (ev.override || KIND_RANK[ev.kind] > KIND_RANK[cur.kind]) {
      cur.kind = ev.kind;
      if (ev.from) cur.from = ev.from;
    }
    if (ev.reason) cur.reasons.push(ev.reason);
  };

  const asCand = (p, extra) => ({
    recipeId: p.recipeId,
    name: p.name,
    category: p.category,
    cost: p.cost,
    reliableCost: p.reliableCost,
    score: p.score,
    covered: p.covered,
    warnHit: p.warnHit,
    warnUsed: p.warnUsed,
    missing: p.missing,
    home: null,
    servings: target,
    hard: null,
    soft: null,
    due: null,
    hardFoods: [],
    softFoods: [],
    ...extra
  });

  // ---- 2. 先看现在这一周都排了什么 ----
  const planned = [];
  for (const s of openSlots) {
    const meal = s.meal;
    if (!meal || !meal.recipeId) continue;
    const p = poolById.get(meal.recipeId);
    const r = recipesById.get(meal.recipeId);
    if (!p) {
      stalePlan.push({ date: s.date, recipeId: meal.recipeId, name: r ? r.name : meal.recipeId });
      slotState.set(s.date, "needs-dish");
      note(s.date, {
        kind: "replace",
        from: { date: s.date, recipeId: meal.recipeId, name: r ? r.name : meal.recipeId },
        reason: r ? "这道菜已经不在可推荐的食谱里（被删了 / 还是草稿），重新排一道" : "原来的食谱找不到了，重新排一道"
      });
      continue;
    }
    const dl = deadlineOf(p.recipeId);
    const cand = asCand(p, {
      home: s.date,
      servings: meal.actualServings != null ? meal.actualServings : target,
      origin: "planned",
      hard: dl.hard,
      soft: dl.soft,
      due: dl.due,
      hardFoods: dl.hardFoods,
      softFoods: dl.softFoods
    });
    assign.set(s.date, cand);
    planned.push(cand);
  }

  const assignedIds = () => {
    const ids = new Set(lockedIds);
    for (const c of assign.values()) if (c) ids.add(c.recipeId);
    return ids;
  };
  const placedIds = new Set();

  // 把某天的菜往前挪：优先对调（occupant 挪回 c.home），其次空白天。
  // 只往 c.due 那天或更早挪。
  const findTarget = (c, { swapWith = "free" } = {}) => {
    const eligible = [...assign.keys()].filter((d) => d !== c.home && (!c.due || d <= c.due));
    for (let i = eligible.length - 1; i >= 0; i -= 1) {
      const d = eligible[i];
      const occ = assign.get(d);
      if (!occ) return { date: d, occupant: null };
      if (placedIds.has(occ.recipeId)) continue; // 已经由这次优化放好的，别再搬
      if (occ.home !== d) continue;
      if (c.home == null) continue; // 过期的菜没有「原来的天」可以还给对方
      if (swapWith === "zero" && (occ.hard || occ.soft)) continue; // 抢救/软期限只动完全没有期限压力的
      if (occ.hard && occ.hard < c.home) continue; // 对调之后对面会迟到，那就算了
      return { date: d, occupant: occ };
    }
    return null;
  };

  // 落位：返回实际上把哪道菜放到了哪天（对调时对方也跟着落位）
  const place = (c, target, reason) => {
    const { date: t, occupant } = target;
    assign.set(t, c);
    placedIds.add(c.recipeId);
    if (occupant) {
      assign.set(c.home, occupant);
      placedIds.add(occupant.recipeId);
      note(t, { kind: "swap", from: { date: c.home, name: c.name }, reason });
      note(c.home, {
        kind: "swap",
        from: { date: t, name: occupant.name },
        reason: `跟 ${md(t)} 的「${c.name}」对调`
      });
      return;
    }
    assign.set(c.home, null);
    slotState.set(c.home, "vacated");
    note(t, { kind: "move", from: { date: c.home, name: c.name }, reason });
    note(c.home, {
      kind: "move",
      from: { date: t, name: c.name },
      reason: `这天的菜挪到 ${md(t)} 去了`
    });
  };

  const why = (c, tier) => {
    const foods = tier === "hard" ? c.hardFoods : c.softFoods;
    const date = tier === "hard" ? c.hard : c.soft;
    const kind = tier === "hard" ? "use-by" : "到期日";
    const from = c.home ? `原定 ${md(c.home)}，` : "";
    return `${from}${foods.join("、")} 的 ${kind} 是 ${md(date)}，排在那之后就坏了`;
  };

  // ---- 3. 主料已经坏了的菜：做不成了，先腾出位置换掉 ----
  for (const c of planned) {
    const r = recipesById.get(c.recipeId);
    const bad = spoiledFor(r, ctx);
    if (!bad.length) continue;
    assign.set(c.home, null);
    placedIds.delete(c.recipeId);
    slotState.set(c.home, "needs-dish");
    note(c.home, {
      kind: "replace",
      from: { date: c.home, recipeId: c.recipeId, name: c.name },
      reason: `${bad.map((b) => b.name).join("、")} 已经坏了（use-by ${md(bad[0].date)}），这道做不成，换一道`
    });
  }

  // ---- 4. 硬期限来不及的：往前挪（对调优先）；实在挪不动才换菜 ----
  const hardLate = planned
    .filter((c) => c.hard && c.home && c.hard < c.home && assign.get(c.home) === c)
    .sort((a, b) => (a.hard < b.hard ? -1 : a.hard > b.hard ? 1 : 0));
  for (const c of hardLate) {
    const target = findTarget(c);
    if (target) {
      place(c, target, `提前：${why(c, "hard")}`);
      continue;
    }
    assign.set(c.home, null);
    placedIds.delete(c.recipeId);
    slotState.set(c.home, "needs-dish");
    note(c.home, {
      kind: "replace",
      from: { date: c.home, recipeId: c.recipeId, name: c.name },
      reason: `${why(c, "hard")}，这周挪不出更早的位置，换一道`
    });
  }

  // ---- 5. 软期限（best-before / 估算日期）尽量提前：只占空白天，或跟毫无期限压力的菜对调 ----
  const softLate = planned
    .filter((c) => !c.hard && c.soft && c.home && c.soft < c.home && assign.get(c.home) === c)
    .sort((a, b) => (a.soft < b.soft ? -1 : a.soft > b.soft ? 1 : 0));
  for (const c of softLate) {
    const target = findTarget(c, { swapWith: "zero" });
    if (target) place(c, target, `尽量提前：${why(c, "soft")}`);
  }

  // ---- 6. 今天以前没做成的菜：还能吃就顺到后面去，别浪费 ----
  const overdue = [];
  for (const d of pastDays) {
    const meal = (data.meals || []).find((m) => m.date === d);
    if (!meal || !meal.recipeId || !COOKING_STATES.includes(meal.state)) continue;
    const p = poolById.get(meal.recipeId);
    const r = recipesById.get(meal.recipeId);
    if (!r) continue;
    const bad = spoiledFor(r, ctx);
    if (bad.length) {
      overdue.push({ date: d, meal, name: r.name, action: "spoiled", bad });
      continue;
    }
    if (!p || lockedIds.has(p.recipeId)) {
      overdue.push({ date: d, meal, name: r.name, action: "left" });
      continue;
    }
    const dl = deadlineOf(p.recipeId);
    if (dl.hard && dl.hard < today) {
      overdue.push({ date: d, meal, name: r.name, action: "spoiled", bad: [{ name: dl.hardFoods.join("、"), date: dl.hard }] });
      continue;
    }
    overdue.push({
      date: d,
      meal,
      name: r.name,
      action: "left",
      cand: asCand(p, {
        home: null,
        servings: meal.actualServings != null ? meal.actualServings : target,
        origin: "overdue",
        hard: dl.hard,
        soft: dl.soft,
        due: dl.due,
        hardFoods: dl.hardFoods,
        softFoods: dl.softFoods
      })
    });
  }
  const movedPast = [];
  // 没做成的菜往哪儿放：只占空白天，不去挤别人已经排好的（想换可以自己在「本周」拖动对调）。
  // 硬期限是硬约束；best-before 那种软期限只在有得挑的时候照顾一下 —— 排在软期限之后
  // 意味着可能得补买新鲜的，但总比这顿白排了强。
  const findHomeForOverdue = (c) => {
    const empty = [...assign.keys()].filter((d) => !assign.get(d) && (!c.hard || d <= c.hard));
    if (!empty.length) return null;
    const inTime = c.due ? empty.filter((d) => d <= c.due) : [];
    const usable = inTime.length ? inTime : empty; // 有得挑就照顾软期限，没有就只能往后放
    return usable[usable.length - 1];
  };
  for (const o of overdue) {
    if (!o.cand) continue;
    const target = findHomeForOverdue(o.cand);
    if (!target) continue;
    assign.set(target, o.cand);
    placedIds.add(o.cand.recipeId);
    note(target, {
      kind: "new",
      reason: `${md(o.date)} 没做成的「${o.name}」顺到这天，别浪费`
    });
    o.action = "moved";
    o.to = target;
    movedPast.push(o.date);
  }

  // ---- 7. 补空：被换掉的天一定要补；本来空着的天看你要不要排满 ----
  const mustFill = new Set(
    [...slotState.entries()].filter(([d, st]) => st === "needs-dish" && assign.get(d) == null).map(([d]) => d)
  );
  const fillDays = [...assign.keys()].filter((d) => assign.get(d) == null && (mustFill.has(d) || fillEmpty));
  const pickFor = (d) => {
    const used = assignedIds();
    let best = null;
    let bestKey = -Infinity;
    for (const p of pool) {
      if (used.has(p.recipeId) || brokenIds.has(p.recipeId)) continue;
      const dl = deadlineOf(p.recipeId);
      if (dl.hard && dl.hard < d) continue; // 硬期限已经来不及的，不排
      // 这几天就要到期的食材优先（顺手消耗）；排在软期限之后的降一点分（品质会差）
      const urgency = dl.soft && dl.soft <= addDaysLocal(d, RESCUE_DAYS) ? 1 : 0;
      const stale = dl.soft && dl.soft < d ? 1 : 0;
      const key = p.score + urgency * 8 - stale * 15;
      if (key > bestKey) {
        bestKey = key;
        best = { p, dl };
      }
    }
    return best;
  };
  for (const d of fillDays) {
    const best = pickFor(d);
    const prev = events.get(d);
    if (!best) {
      note(d, { kind: prev && prev.kind !== "keep" ? prev.kind : "empty", reason: "没有合适的菜可以排" });
      continue;
    }
    const cand = asCand(best.p, {
      home: d,
      origin: "new",
      hard: best.dl.hard,
      soft: best.dl.soft,
      due: best.dl.due,
      hardFoods: best.dl.hardFoods,
      softFoods: best.dl.softFoods
    });
    assign.set(d, cand);
    placedIds.add(cand.recipeId);
    if (prev && prev.kind === "replace") {
      // 「被换掉」的原因已经写好了，新菜名由这一天的结果带出来
      continue;
    }
    // 这天的菜挪走了、又补一道新的：主体算「新排的」，别让用户以为还是原来那道
    const vacated = prev && prev.kind === "move";
    note(d, {
      kind: "new",
      override: vacated,
      from: vacated && prev.from ? { date: prev.from.date, name: prev.from.name } : null,
      reason:
        slotState.get(d) === "orig-empty"
          ? "这天本来空着，排一道用得上冰箱现成食材的"
          : prev && prev.from
            ? `「${prev.from.name}」挪到 ${md(prev.from.date)} 去了，补一道用得上冰箱现成食材的`
            : "补一道用得上冰箱现成食材的"
    });
  }

  // ---- 8. 预算：超了就把最贵的换成更便宜的（不破坏期限） ----
  const mealsNow = (drop) => {
    const dropSet = new Set(drop);
    const out = (data.meals || []).filter((m) => !dropSet.has(m.date) && !assign.has(m.date));
    for (const [date, c] of assign) {
      if (!c) continue;
      out.push({
        id: `meal_${date}_dinner`,
        date,
        slot: "dinner",
        state: "planned",
        recipeId: c.recipeId,
        actualServings: c.servings,
        servingsConfirmed: true
      });
    }
    return out;
  };
  const estimateOf = (drop) =>
    buildShoppingList({
      meals: mealsNow(drop),
      recipes: data.recipes,
      foods: data.foods,
      batches: data.inventoryBatches,
      range,
      stores: data.settings.stores
    });
  const drop = [...movedPast];
  for (let guard = 0; guard < 20; guard += 1) {
    const est = estimateOf(drop).budget.estimatedPence;
    if (est <= budget) break;
    const entries = [...assign.entries()].filter(([, c]) => c);
    if (!entries.length) break;
    const [day, victim] = entries.sort((a, b) => b[1].cost - a[1].cost)[0];
    const used = assignedIds();
    const alt = pool
      .filter((p) => !used.has(p.recipeId) && !brokenIds.has(p.recipeId) && p.reliableCost && p.cost < victim.cost)
      .map((p) => ({ p, dl: deadlineOf(p.recipeId) }))
      .filter(({ dl }) => !dl.hard || dl.hard >= day)
      .sort((a, b) => b.p.score - a.p.score)[0];
    if (!alt) break;
    const cand = asCand(alt.p, {
      home: day,
      origin: "new",
      hard: alt.dl.hard,
      soft: alt.dl.soft,
      due: alt.dl.due,
      hardFoods: alt.dl.hardFoods,
      softFoods: alt.dl.softFoods
    });
    assign.set(day, cand);
    if (estimateOf(drop).budget.estimatedPence >= est) {
      assign.set(day, victim); // 换了没便宜下来，就别折腾
      break;
    }
    placedIds.add(alt.p.recipeId);
    note(day, {
      kind: "replace",
      from: { date: day, recipeId: victim.recipeId, name: victim.name },
      reason: `超预算：把 ${victim.name} 换成便宜一点的 ${alt.p.name}`
    });
  }

  // ---- 9. 顺手抢救：这几天到期、但一周里没人用得上的食材 ----
  const rescueNotes = [];
  if (rescue) {
    const usesFood = (cand, foodId) => {
      const r = recipesById.get(cand.recipeId);
      return !!(r && r.ingredients.some((i) => i.foodId === foodId));
    };
    const soonFoods = [];
    for (const [foodId, list] of batchesByFood) {
      const food = foodsById.get(foodId);
      if (!food || food.area === "seasoning") continue;
      const soon = list
        .filter((b) => hasStock(b) && b.date && b.dateType !== "unknown" && b.date >= today)
        .map((b) => ({ b, info: expiryInfo(b, today) }))
        .filter((x) => x.info.level === "soon")
        .sort((a, b) => (a.b.date < b.b.date ? -1 : 1))[0];
      if (!soon) continue;
      const inPlan = [...assign.values()].some((c) => c && usesFood(c, foodId));
      if (inPlan) continue;
      const recipe = pool
        .filter((p) => !assignedIds().has(p.recipeId) && !brokenIds.has(p.recipeId))
        .map((p) => ({ p, r: recipesById.get(p.recipeId), dl: deadlineOf(p.recipeId) }))
        .filter(({ r }) => r && r.ingredients.some((i) => i.foodId === foodId))
        .sort((a, b) => b.p.score - a.p.score)[0];
      if (!recipe) continue;
      soonFoods.push({ foodId, name: food.name, date: soon.b.date, recipe: recipe.p, dl: recipe.dl });
    }
    for (const item of soonFoods.slice(0, RESCUE_MAX)) {
      // 被换掉的那道：必须完全没有期限压力（不然就是拆东墙补西墙）
      const victims = [...assign.entries()]
        .filter(([d, c]) => c && c.home === d && !c.hard && !c.soft && (!item.dl.hard || item.dl.hard >= d))
        .sort((a, b) => a[1].score - b[1].score);
      const victim = victims[0];
      if (!victim) continue;
      const [day, old] = victim;
      if (item.recipe.score <= old.score + RESCUE_MARGIN) continue;
      assign.set(
        day,
        asCand(item.recipe, {
          home: day,
          origin: "new",
          hard: item.dl.hard,
          soft: item.dl.soft,
          due: item.dl.due,
          hardFoods: item.dl.hardFoods,
          softFoods: item.dl.softFoods
        })
      );
      placedIds.add(item.recipe.recipeId);
      note(day, {
        kind: "replace",
        from: { date: day, recipeId: old.recipeId, name: old.name },
        reason: `顺手消耗：${item.name} ${md(item.date)} 到期，这周没有菜用得上，换成 ${item.recipe.name}`
      });
      rescueNotes.push(`${item.name}（${md(item.date)} 到期）`);
    }
  }

  // ---- 10. 汇总：结果 + 每一处改动的原因 ----
  const list = estimateOf(drop);
  const out = [];
  for (const d of [...assign.keys()].sort()) {
    const c = assign.get(d);
    const ev = events.get(d);
    out.push({
      date: d,
      recipeId: c ? c.recipeId : null,
      name: c ? c.name : null,
      category: c ? c.category : "",
      servings: c ? c.servings : target,
      cost: c ? c.cost : 0,
      hard: c ? c.hard : null,
      soft: c ? c.soft : null,
      due: c ? c.due : null,
      dueFoods: c ? [...c.hardFoods, ...c.softFoods] : [],
      covered: c ? c.covered : 0,
      warnHit: c ? c.warnHit : 0,
      kind: ev ? ev.kind : c ? "keep" : "empty",
      from: ev ? ev.from : null,
      reasons: ev ? ev.reasons : []
    });
  }
  const counts = { keep: 0, move: 0, swap: 0, replace: 0, new: 0, empty: 0 };
  for (const row of out) counts[row.kind] = (counts[row.kind] || 0) + 1;

  const spoiled = spoiledBatches(data, today).map((b) => {
    const f = foodsById.get(b.foodId);
    return {
      batchId: b.id,
      foodId: b.foodId,
      name: f ? f.name : b.foodId,
      date: b.date,
      quantity: b.quantity,
      unit: b.unit
    };
  });
  // 按估算日期已经过期、可包装上没印日期的：不能替你判断还能不能吃，
  // 但得摆出来（「排骨坏了」这种事，用户心里其实清楚，只是缺个提示）。
  const suspect = (data.inventoryBatches || [])
    .filter((b) => hasStock(b) && b.date && b.dateType === "use_by" && b.dateSource === "estimate" && b.date < today)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .map((b) => {
      const f = foodsById.get(b.foodId);
      return { batchId: b.id, foodId: b.foodId, name: f ? f.name : b.foodId, date: b.date, quantity: b.quantity, unit: b.unit };
    });
  const changed = out.filter((r) => r.kind !== "keep" && r.kind !== "empty");
  const noteText = list.budget.unpricedCount
    ? `其中 ${list.budget.unpricedCount} 项还没有参考价，金额不准`
    : list.budget.estimatedPence > budget
      ? `预计超预算 ${((list.budget.estimatedPence - budget) / 100).toFixed(2)} 英镑`
      : "";

  return {
    today,
    range,
    days: out,
    changes: changed,
    counts,
    changedCount: changed.length,
    locked: locked.map((s) => ({
      date: s.date,
      state: s.state,
      recipeId: s.meal.recipeId || null,
      name: s.meal.recipeId && recipesById.get(s.meal.recipeId) ? recipesById.get(s.meal.recipeId).name : null
    })),
    past: overdue,
    movedPastDates: movedPast,
    stalePlan,
    spoiled,
    suspect,
    // 今天及以后还有没有「可以重排」的天：没有的话界面要说清楚，别假装排好了
    openDays: [...assign.keys()].sort(),
    purgeBatchIds: spoiled.map((s) => s.batchId),
    rescueNotes,
    estimatePence: list.budget.estimatedPence,
    budgetPence: budget,
    unpricedCount: list.budget.unpricedCount,
    overBudget: list.budget.estimatedPence > budget,
    note: noteText,
    // 落地用：日期 -> 菜；null 表示这天要清空
    assignments: Object.fromEntries([...assign.entries()].map(([d, c]) => [d, c ? { recipeId: c.recipeId, servings: c.servings } : null])),
    dropMealDates: drop
  };
}

function addDaysLocal(iso, n) {
  const d = new Date(`${iso}T12:00:00Z`);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

// ===== src\rules\ids.js =====
function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

// ===== src\rules\model.js =====
// 纯状态更新函数：给定当前 data，返回新的 data。便于测试，也让界面层保持简单。
function round3__m2(n) {
  return Math.round(n * 1000) / 1000;
}

function mealIdFor(date) {
  return `meal_${date}_dinner`;
}

function upsertMeal(data, date, patch) {
  const id = mealIdFor(date);
  const idx = data.meals.findIndex((m) => m.id === id);
  const base =
    idx >= 0
      ? data.meals[idx]
      : { id, date, slot: "dinner", state: "planned", recipeId: null, actualServings: null, servingsConfirmed: false };
  const next = { ...base, ...patch };
  const meals = data.meals.slice();
  if (idx >= 0) meals[idx] = next;
  else meals.push(next);
  return { ...data, meals };
}

function removeMeal(data, date) {
  const id = mealIdFor(date);
  return { ...data, meals: data.meals.filter((m) => m.id !== id) };
}

// 「本周」里拖动对调两天：
//   · 两天都是做菜（planned / cooking）→ 菜和份数互换，状态跟着菜走；
//   · 一天做菜、另一天闲着 → 整份挪过去，原来那天清空（这就是「拖动调整」）；
//   · 任一天是外食 / 跳过 / 吃剩菜 / 已做完 → 不换，那是你自己定的，让调用方告诉用户原因。
const SWAP_COOKING = ["planned", "cooking"];
const SWAP_STATE_LABEL = { done: "已做完", eating_out: "外食", skipped: "跳过", leftovers: "吃剩菜" };

function swapMealDays(data, dateA, dateB) {
  if (!dateA || !dateB) return { ok: false, data, reason: "没找到要换的那天" };
  if (dateA === dateB) return { ok: false, data, reason: "同一天不用对调" };
  const find = (d) => data.meals.find((m) => m.id === mealIdFor(d)) || null;
  const a = find(dateA);
  const b = find(dateB);
  const isCooking = (m) => !!m && SWAP_COOKING.includes(m.state);
  const isIdle = (m) => !m || (SWAP_COOKING.includes(m.state) && !m.recipeId);
  const stuck = (m) => !isCooking(m) && !isIdle(m);
  if (stuck(a)) return { ok: false, data, reason: `${dateA.slice(5)} 那天是「${SWAP_STATE_LABEL[a.state] || a.state}」，先改回做菜再对调` };
  if (stuck(b)) return { ok: false, data, reason: `${dateB.slice(5)} 那天是「${SWAP_STATE_LABEL[b.state] || b.state}」，先改回做菜再对调` };
  if (isIdle(a) && isIdle(b)) return { ok: false, data, reason: "这两天都没有安排" };

  const take = (m) =>
    isCooking(m) && m.recipeId
      ? { state: m.state, recipeId: m.recipeId, actualServings: m.actualServings, servingsConfirmed: !!m.servingsConfirmed }
      : null;
  const pa = take(a);
  const pb = take(b);
  let next = data;
  next = pb ? upsertMeal(next, dateA, pb) : removeMeal(next, dateA);
  next = pa ? upsertMeal(next, dateB, pa) : removeMeal(next, dateB);
  return { ok: true, data: next };
}

function updateSettings(data, { household, budget, stores } = {}) {
  const settings = { ...data.settings };
  if (household) settings.household = { ...settings.household, ...household };
  if (budget) settings.budget = { ...settings.budget, ...budget };
  if (stores) settings.stores = stores;
  return { ...data, settings };
}

function addDraftRecipe(data, name) {
  const recipe = {
    id: uid("recipe"),
    name,
    baseServings: data.settings.household.defaultServings,
    ingredients: [],
    steps: [],
    tags: [],
    status: "draft",
    createdAt: new Date().toISOString()
  };
  return { ...data, recipes: [...data.recipes, recipe] };
}

// 草稿被电脑补全后，由用户确认发布：状态改成 complete，才能排进本周。
function publishRecipe(data, recipeId) {
  return {
    ...data,
    recipes: data.recipes.map((r) => (r.id === recipeId ? { ...r, status: "complete", publishedAt: new Date().toISOString() } : r))
  };
}

// 已经被菜单引用的食谱不能删，否则那些餐次会指向不存在的东西。
function recipeInUse(data, recipeId) {
  return (data.meals || []).some((m) => m.recipeId === recipeId);
}

function removeRecipe(data, recipeId) {
  if (recipeInUse(data, recipeId)) return { data, ok: false, reason: "这道菜已经排进本周了，先去「本周」把它换掉再删。" };
  return { ok: true, data: { ...data, recipes: data.recipes.filter((r) => r.id !== recipeId) } };
}

// 调整食谱：食材、做法、份数都能改
function updateRecipe(data, recipeId, patch) {
  return {
    ...data,
    recipes: data.recipes.map((r) => (r.id === recipeId ? { ...r, ...patch } : r))
  };
}

// 套用一周推荐菜单：把选中的菜排进对应日期
function applyWeekPlan(data, picks, servings) {
  let next = data;
  for (const p of picks) {
    next = upsertMeal(next, p.date, {
      state: "planned",
      recipeId: p.recipeId,
      actualServings: servings,
      servingsConfirmed: true
    });
  }
  return next;
}

// 套用「一键优化排期」的结果：按方案重排它列出的那些天（null = 清空），
// 再把方案里说好要扔掉的过期批次删掉。
// 锁定天（外食 / 跳过 / 吃剩菜 / 已做完）和今天以前的天不在 assignments 里，所以不会被碰。
function applyOptimizedWeek(data, plan, { purgeBatchIds = [] } = {}) {
  let next = data;
  for (const date of Object.keys(plan.assignments || {})) {
    const a = plan.assignments[date];
    if (!a) next = removeMeal(next, date);
    else
      next = upsertMeal(next, date, {
        state: "planned",
        recipeId: a.recipeId,
        actualServings: a.servings,
        servingsConfirmed: true
      });
  }
  // 今天以前没做成、被顺到后面的那几顿：原来的记录要删掉，不然买菜清单里会算两遍
  for (const date of plan.dropMealDates || []) next = removeMeal(next, date);
  // 扔坏掉的库存放在最后：删批次会顺手对齐采购记录，不影响上面的菜单
  for (const id of purgeBatchIds) next = removeBatch(next, id);
  return next;
}

function newBatch({
  foodId,
  quantity,
  unit,
  location = "fridge",
  dateType = "unknown",
  date = null,
  dateSource,
  addedAt = null,
  note
}) {
  return {
    id: uid("batch"),
    foodId,
    location,
    quantityState: "exact",
    quantity,
    unit,
    dateType,
    date,
    ...(dateSource ? { dateSource } : {}),
    addedAt,
    opened: false,
    ...(note ? { note } : {})
  };
}

function upsertBatch(data, batch) {
  const idx = data.inventoryBatches.findIndex((b) => b.id === batch.id);
  const arr = data.inventoryBatches.slice();
  if (idx >= 0) arr[idx] = { ...arr[idx], ...batch };
  else arr.push(batch);
  return { ...data, inventoryBatches: arr };
}

// 删库存时顺手把账对齐，避免留下「孤儿采购」（记录说入库了、库存却不在了）：
//   · 这条批次来自一次采购，而那一笔还没填金额 → 它没有账目价值，连采购记录和入库流水一起清掉；
//   · 那一笔真花过钱 → 金额必须留着（那是"已付"的凭据），只把它标成「库存已不在」；
//   · 这笔采购还有别的批次在 → 什么都不动。
function removeBatch(data, id) {
  const batch = data.inventoryBatches.find((b) => b.id === id);
  const next = { ...data, inventoryBatches: data.inventoryBatches.filter((b) => b.id !== id) };
  const pid = batch && batch.sourcePurchaseId;
  if (!pid) return next;
  const purchase = data.purchases.find((x) => x.id === pid);
  if (!purchase) return next;
  if (next.inventoryBatches.some((b) => b.sourcePurchaseId === pid)) return next;

  if (purchase.amountPence == null) {
    return {
      ...next,
      purchases: next.purchases.filter((x) => x.id !== pid),
      stockLedger: (next.stockLedger || []).filter((e) => !(e.type === "purchase_in" && e.batchId === id))
    };
  }
  return {
    ...next,
    purchases: next.purchases.map((x) => (x.id === pid ? { ...x, stocked: false } : x))
  };
}

function adjustBatch(data, id, delta) {
  return {
    ...data,
    inventoryBatches: data.inventoryBatches.map((b) =>
      b.id === id ? { ...b, quantity: Math.max(0, Math.round((b.quantity + delta) * 1000) / 1000) } : b
    )
  };
}

function setPurchasePrice(data, purchaseId, amountPence, storeId) {
  return {
    ...data,
    purchases: data.purchases.map((p) =>
      p.id === purchaseId
        ? { ...p, amountPence, storeId: storeId === undefined ? p.storeId : storeId, status: amountPence == null ? "pending" : "complete" }
        : p
    )
  };
}

// 手动校准一次购买：分量、单位、实付金额、采购点都能改。
// 由这次购买入库的库存批次要同步改数量（差值方式，已经用掉一部分也不会算错），并重算单位成本。
function calibratePurchase(data, purchaseId, { quantity, unit, amountPence, storeId } = {}) {
  const p = data.purchases.find((x) => x.id === purchaseId);
  if (!p) return data;

  const newQty = Number(quantity);
  const hasQty = Number.isFinite(newQty) && newQty > 0;
  const finalQty = hasQty ? newQty : p.quantity;
  const finalUnit = unit || p.unit;
  const finalPence = amountPence === undefined ? p.amountPence : amountPence;
  const unitCostPence = finalPence != null && finalQty > 0 ? finalPence / finalQty : null;
  const food = (data.foods || []).find((f) => f.id === p.foodId) || null;
  // 换算到批次自己的单位再算差值：500g 用掉 300g 后改成 0.5kg，余量还是 200g，
  // 不能拿「0.5 − 500」去加。
  const inUnit = (qty, from, to) => {
    if (from === to) return qty;
    const c = convert(food, qty, from, to);
    return c.certain ? c.value : null;
  };

  const purchases = data.purchases.map((x) =>
    x.id === purchaseId
      ? {
          ...x,
          quantity: finalQty,
          unit: finalUnit,
          amountPence: finalPence,
          storeId: storeId === undefined ? x.storeId : storeId,
          status: finalPence == null ? "pending" : "complete"
        }
      : x
  );

  const inventoryBatches = data.inventoryBatches.map((b) =>
    b.sourcePurchaseId === purchaseId
      ? (() => {
          const nextInBatch = hasQty ? inUnit(finalQty, finalUnit, b.unit) : null;
          const oldInBatch = hasQty ? inUnit(p.quantity, p.unit, b.unit) : null;
          const quantity =
            nextInBatch == null || oldInBatch == null
              ? b.quantity
              : Math.max(0, round3__m2(b.quantity + (nextInBatch - oldInBatch)));
          return { ...b, quantity, unitCostPence };
        })()
      : b
  );

  return { ...data, purchases, inventoryBatches };
}

// 把一次校准后的规格记为这个食材以后的默认包装，下次采购就按新规格算。
// 分量变了但没给价格时，把旧价格清空（旧价格对应的是旧规格，留着会算错）。
function setFoodPack(data, foodId, { size, unit, pricePence } = {}) {
  const newSize = Number(size);
  if (!Number.isFinite(newSize) || newSize <= 0 || !unit) return data;
  const foods = data.foods.map((f) => {
    if (f.id !== foodId) return f;
    const packs = Array.isArray(f.packSizes) ? f.packSizes.slice() : [];
    const idx = packs.findIndex((p) => p.unit === unit);
    const prev = idx >= 0 ? packs[idx] : null;
    const sizeChanged = !prev || Number(prev.size) !== newSize;
    const price = pricePence != null ? pricePence : sizeChanged ? null : prev.pricePence;
    const next = { size: newSize, unit };
    if (prev && prev.label) next.label = prev.label;
    if (price != null) next.pricePence = price;
    if (idx >= 0) packs[idx] = next;
    else packs.unshift(next);
    return { ...f, packSizes: packs };
  });
  return { ...data, foods };
}

// 撤销一次采购：删掉采购记录和它入库的库存，并记一条反向流水（历史保留）。
// 如果这批货已经被做饭用掉过，就不让撤销——那样库存和做饭记录会对不上，改分量更稳妥。
function undoPurchase(data, purchaseId) {
  const p = data.purchases.find((x) => x.id === purchaseId);
  if (!p) return { data, ok: false, reason: "找不到这条采购记录" };

  const batches = data.inventoryBatches.filter((b) => b.sourcePurchaseId === purchaseId);
  const batchIds = new Set(batches.map((b) => b.id));
  // 「用过」按还没撤销的做饭记录算：撤销过的那顿，食材已经还回来了，可以正常撤销采购
  const used = data.cookLogs.some(
    (c) => !c.undoneBy && (c.consumed || []).some((x) => x.batchId && batchIds.has(x.batchId))
  );
  if (used) {
    return { data, ok: false, reason: "这批货已经用来做过饭了，直接撤销会和做饭记录对不上；点「改分量 / 价格」调整更稳妥。" };
  }

  const at = new Date().toISOString();
  const undos = batches.map((b) => ({
    id: uid("ledger"),
    at,
    type: "undo",
    foodId: p.foodId,
    batchId: b.id,
    quantity: -round3__m2(b.quantity),
    unit: b.unit,
    sourceKey: `undo:${p.sourceKey}`,
    note: "撤销采购"
  }));

  return {
    ok: true,
    data: {
      ...data,
      purchases: data.purchases.filter((x) => x.id !== purchaseId),
      inventoryBatches: data.inventoryBatches.filter((b) => b.sourcePurchaseId !== purchaseId),
      stockLedger: [...data.stockLedger, ...undos]
    }
  };
}

// 撤销「做完」：把扣掉的量还回批次，做饭记录标记为已撤销，餐次回到「已安排」。
function undoCook(data, mealId) {
  const log = data.cookLogs.find((c) => c.mealId === mealId && !c.undoneBy);
  if (!log) return { data, ok: false, reason: "这条做饭记录已经撤销过了" };

  const at = new Date().toISOString();
  const undoId = uid("ledger");
  const byId = new Map(data.inventoryBatches.map((b) => [b.id, { ...b }]));
  const undos = [];
  const missing = [];

  for (const c of log.consumed) {
    if (!c.batchId || !c.quantity) continue;
    const b = byId.get(c.batchId);
    if (!b) {
      // 批次被删过（比如手动删了库存），这批消耗补不回来 —— 得告诉用户，别装作成功
      missing.push(c.foodId);
      continue;
    }
    b.quantity = round3__m2(b.quantity + c.quantity);
    undos.push({
      id: uid("ledger"),
      at,
      type: "undo",
      foodId: c.foodId,
      batchId: c.batchId,
      quantity: round3__m2(c.quantity),
      unit: c.unit,
      sourceKey: `undo:cook:${mealId}`,
      note: "撤销做饭"
    });
  }

  return {
    ok: true,
    missing: [...new Set(missing)],
    data: {
      ...data,
      inventoryBatches: [...byId.values()],
      cookLogs: data.cookLogs.map((c) => (c.id === log.id ? { ...c, undoneBy: undoId } : c)),
      stockLedger: [...data.stockLedger, ...undos],
      meals: data.meals.map((m) => (m.id === mealId ? { ...m, state: "planned" } : m))
    }
  };
}

// ===== src\rules\idempotency.js =====
// 幂等：同一业务动作只能落一次流水。
// 购买入库按「购买来源唯一键」去重，做饭扣减按「餐次唯一键」去重。
// 双击、接口重试、跨设备同步都必须走同一套键。

// nonce：同一次勾选产生的唯一标识。没有它，同一天买同一样东西会算出同一个键，
// 第二次会被当成重复提交而静默跳过（删掉库存后重勾就会「不添加」）。
function purchaseSourceKey({ storeId, dateISO, foodId, quantity, unit, amountPence, nonce }) {
  return [
    "purchase",
    storeId || "unknown",
    dateISO,
    foodId,
    `${quantity}${unit}`,
    amountPence == null ? "na" : amountPence,
    nonce || "0"
  ].join("|");
}

function cookSourceKey(mealId) {
  return `cook:${mealId}`;
}

function undoSourceKey(sourceKey) {
  return `undo:${sourceKey}`;
}

// 同一 type + sourceKey 的流水只允许存在一条。
function canApplyLedger(entries, type, sourceKey) {
  return !entries.some((e) => e.type === type && e.sourceKey === sourceKey);
}

// ===== src\rules\inventory.js =====
// 库存流水：购买入库（+）与做饭扣减（−）。都带业务唯一键，重复调用不会重复记账。
// 做饭扣减按批次「日期早的先扣」，扣到 0 为止，不出现负库存。
function round3__m3(n) {
  return Math.round(n * 1000) / 1000;
}

// 注意：批次是采购/消耗/撤销的账目单位，不在数据层自动合并或删除。
// 同一样食材显示成一行是界面的事（见 views.js 的冰箱分组），
